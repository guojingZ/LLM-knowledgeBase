        steps:
          - 识别需要持续投入个体时间的服务内容
          - 将服务中可标准化的部分沉淀为知识库与方法论
          - 把服务封装为可规模化复制的产品
          - 通过产品扩大连接与传播，减少个体时间投入
          - 权衡产品化带来的更强竞争与差异化损失
      output:
        - 零边际成本的产品
        - 个体时间损耗的减少
    relations:
      references:
        - entity://《底层逻辑》
      related_to:
        - concept://空间换时间
        - entity://长尾理论
        - entity://正态分布
        - concept://共性模板化
    tags: [零边际成本, 产品化, 规模化]

