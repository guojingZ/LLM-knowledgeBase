# 第二轮填充 · 批次 2
# 原文依据：raw/AI时代个体思维能力进化知识显性化表达和输出能力.md、
#           raw/AI时代的个体思维进化从系统思维到第一性原理.md、
#           raw/AI时代的思考力程序员从学习成长到知识体系构建之路.md、
#           raw/一文详细讲解基于系统工程思想构建自己的学习体系和学习系统.md、
#           raw/个人提升解决问题能力的关键从结果到过程通过复盘形成闭环.md、
#           raw/个体进化的底层逻辑从知识到技能从技能到方法论.md、
#           raw/从信息焦虑到智慧从容构建个人知识管理体系从学习到实践.md

concepts:
  - id: POC验证
    define: 基于分析出的模型做POC试验，以验证方法是否真能解决问题
    ipo:
      input:
        - 问题分析建模得出的模型
        - 待解决的具体问题
      process:
        steps:
          - 由模型确定本次要验证的关键假设与方法
          - 设计POC试验的场景、范围与验证标准
          - 在受控场景中执行POC试验
          - 观察结果，确认方法是否真正解决了问题
          - 未通过则修正模型后再次验证
      output:
        - 方法有效性的验证结论
        - 可进入真实项目实践的方案
    relations:
      depends_on:
        - concept://问题分析建模
      related_to:
        - concept://最小目标验证
        - concept://实证
        - concept://假设验证
    tags: [验证, 试验, 问题解决]

  - id: 事物认知
    define: 以静态结构、动态行为与动静结合认识事物，先总后分先外后内
    ipo:
      input:
        - 待认知的事物或知识领域
        - 事物对外呈现的功能与约束信息
      process:
        steps:
          - 先总后分、先外后内，厘清事物的边界、功能与约束
          - 做静态结构分析，拆分事物的组成部件
          - 做动态行为分析，梳理部件的协同与流程
          - 动静结合，建立结构部件与行为步骤的映射
          - 通过归纳与演绎在抽象与具象之间往返
      output:
        - 事物的静态结构与动态行为认知
        - 结构机理与行为机制的完整理解
    decomposition:
      - step: 静态结构认知
        uses: concept://静态结构分析
        why: 先拆清楚组成部件，才谈得上研究部件之间如何协同
      - step: 动态行为认知
        uses: concept://动态行为分析
        why: 只看结构无法解释事物表现出的外在行为特征
      - step: 结构映射流程
        uses: concept://动静结合分析
        why: 要把静态组成部件和动态操作步骤建立映射才看得全
      - step: 抽象与具象往返
        uses: concept://归纳演绎循环
        why: 既要能看全貌，也要能抓关键，需在抽象与具象间往返
    relations:
      contains:
        - concept://静态结构分析
        - concept://动态行为分析
        - concept://动静结合分析
      related_to:
        - concept://归纳演绎循环
        - concept://思维双主线
    tags: [事物认知, 静态结构, 动态行为, 动静结合]

  - id: 二元对立
    define: 形式逻辑与认识论所基于的是非对错二分前提，泛化出各细分学科
    ipo:
      input:
        - 已形成的基本概念
        - 是非对错的基本判定
      process:
        steps:
          - 对概念做出是非对错的二元判定
          - 由二元判定形成命题
          - 由命题构成三段论式的推理逻辑
          - 沿二元分裂不断泛化演绎出细分学科与知识体系
      output:
        - 形式逻辑与认识论的推理体系
        - 难以穷尽的细分学科知识
    relations:
      produces:
        - concept://形式逻辑
      related_to:
        - concept://三段论推理
        - concept://第一性原理
        - concept://对立统一
    tags: [二元对立, 形式逻辑, 认识论]

  - id: 依赖关系排序
    define: 按知识点对目标的贡献优先级与前后依赖顺序排列学习路径
    ipo:
      input:
        - 已构建知识树上的知识点清单
        - 最终学习目标与知识点间的依赖关系
      process:
        steps:
          - 评估各知识点对最终目标的贡献大小
          - 按贡献大小排出学习优先级，优先攻克核心知识点
          - 标注知识点之间的前后依赖顺序
          - 综合优先级与依赖顺序排出最终学习次序
      output:
        - 科学有序的知识点学习路径
    relations:
      related_to:
        - concept://学习路径
        - concept://可视化迭代学习
        - concept://优先级排序
        - concept://知识体系构建
    tags: [学习路径, 优先级, 依赖顺序]

  - id: 信息焦虑
    define: 信息爆炸下收藏海量资料却无法内化，是知识资产管理上的失败状态
    ipo:
      input:
        - 信息爆炸环境下的海量资料
        - 被动接收信息的习惯
      process:
        steps:
          - 被动接收并收藏大量未经处理的原始素材
          - 资料停留在资料库而缺少分类归纳
          - 缺少亲身实践导致知识无法内化
          - 零散信息无法汇聚为解决复杂问题的能力
      output:
        - 信息焦虑的困境状态
        - 无法转化为实践战力的零散信息
    relations:
      related_to:
        - concept://知识内化
        - concept://知识四层演进
        - entity://三层六阶段学习法
    tags: [信息焦虑, 知识资产管理, 内化]

  - id: 修悟结合
    define: 动手实践的修与理性思考复盘的悟两个层面相结合的学习方式
    ipo:
      input:
        - 初步掌握的理论知识
        - 假想场景下的最小可行目标
      process:
        steps:
          - 设定最小目标后立即动手实践，哪怕依葫芦画瓢
          - 亲自操作并亲眼看到实践结果
          - 完成后做理性思考与复盘总结
          - 深入理解各个组件之间协同工作的原理
      output:
        - 内化的个人技能与经验
        - 对组件协同原理的理解
    relations:
      related_to:
        - concept://知识内化
        - concept://最小目标验证
        - concept://复盘
        - concept://证悟
    tags: [实践, 复盘, 知行合一]

  - id: 共性模板化
    define: 把不重复的东西抽象出共性参数做成模板，以提升效率的路径
    ipo:
      input:
        - 做事过程中不重复的工作内容
      process:
        steps:
          - 区分做事过程中重复与不重复的部分
          - 从不重复的内容中抽象出共性参数
          - 将共性参数固化为可套用的模板
          - 后续同类事务直接套用模板执行
      output:
        - 可复用的共性模板
    relations:
      related_to:
        - concept://重复自动化
        - concept://抽象
        - concept://复用
        - concept://模式提炼
    tags: [模板化, 效率, 抽象]

  - id: 分解
    define: 对复杂问题分而治之，拆解为高内聚松耦合且最终可集成的部分
    ipo:
      input:
        - 待认识或待处理的复杂系统与问题
      process:
        steps:
          - 选择合适的分解维度，如组成部件、流程阶段或影响因子
          - 将大系统分解为子系统或更小的单元
          - 分解到可分析、可匹配的细粒度为止
          - 分析各个组成单元之间的关系与制约
      output:
        - 子系统或影响因子清单
        - 单元间的相互制约关系
    relations:
      related_to:
        - concept://系统思维
        - concept://静态结构分析
        - concept://MECE
        - concept://集成
    tags: [分解, 分而治之, 结构]

  - id: 升维思考
    define: 从单一维度走向多维度，借分类形成问题关键维度再做多维分析
    ipo:
      input:
        - 单一维度下的问题描述
      process:
        steps:
          - 列举问题表现出的多种行为与事物的多种属性
          - 通过分类把这些行为和属性归纳为关键维度
          - 由单维度视角扩展到多维度视角
          - 基于多维做结构化分析与矩阵分析
      output:
        - 问题的关键维度清单
        - 多维分析后的深入认识
    relations:
      related_to:
        - concept://分类
        - concept://矩阵分析
        - concept://结构化分析
        - concept://问题定义
    tags: [升维, 多维分析, 分类]

  - id: 双循环
    define: 认知—解决为内循环、学习—复盘为外循环，两者叠加的反馈结构
    ipo:
      input:
        - 待认知的事物与待解决的问题
        - 已沉淀的经验模式库
      process:
        steps:
          - 内循环从事物认知进入问题解决
          - 将问题分解到细粒度，在经验模式库寻找匹配点
          - 组合为候选方案，再以验证闭环收敛为结论
          - 外循环由学习进入实践，实践完成后进入复盘
          - 复盘产出的经验模式回灌内循环
      output:
        - 收敛后的解决方案
        - 可复用的经验模式
    relations:
      contains:
        - concept://事物认知
        - concept://模式匹配
        - concept://复盘
      related_to:
        - concept://学习系统建模
        - concept://模式提炼
    tags: [双循环, 内循环, 外循环, 复盘]

  - id: 外思考
    define: 从内思考转向外思考，把思考拓展到问题边界定义与知识广度
    ipo:
      input:
        - 原本聚焦在问题内部的思考
      process:
        steps:
          - 把思考重心从问题内部解法转向问题边界定义
          - 从解决问题域转到问题定义域，精准定义场景边界
          - 从业务方面的思考转到业务场景方面的思考
          - 进一步拓展外在洞察问题的边界与知识广度
      output:
        - 清晰的问题边界与场景定义
        - 拓宽的知识广度
    relations:
      related_to:
        - concept://问题定义
        - concept://场景约束结合
        - concept://知识广度
        - concept://独立思考
    tags: [外思考, 问题定义, 知识广度]

  - id: 学习系统建模
    define: 用分层建模方法把个人学习系统建为具层次、接口与反馈的复杂系统
    ipo:
      input:
        - 个人长期写作与一线实践积累的经验
        - MBSE系统工程学的分层建模思想
      process:
        steps:
          - 划定个人学习系统边界，定义需求层的能力、转化与方法论诉求
          - 梳理功能层，按事物认知、问题解决、学习实践、复盘总结串联
          - 抽象逻辑层，形成思维框架逻辑、知识管理逻辑与学习方法逻辑
          - 确定物理层载体，即大脑、知识库系统、实践环境与反馈系统
          - 用行为层状态机表达学习、实践、复盘、进化的转换关系
      output:
        - 具层次、接口与反馈的个人学习系统架构
    decomposition:
      - step: 系统分层
        uses: concept://分层
        why: 学习系统要按需求、功能、逻辑、物理、行为分层才谈得上接口与反馈
      - step: 方法论主骨
        uses: concept://知识体系构建
        why: 学习方法逻辑要以三层六阶段为主骨并可度量可迭代
      - step: 闭环反馈
        uses: concept://双循环
        why: 认知解决是内循环、学习复盘是外循环，双循环叠加才能持续演进
    relations:
      uses:
        - entity://MBSE
        - entity://三层六阶段学习法
        - entity://PDCA
      contains:
        - concept://双循环
        - concept://事物认知
        - concept://知识四层演进
    tags: [学习系统, MBSE, 分层建模]

  - id: 归纳
    define: 通过系统观察、实验与排除法从特殊案例中总结出可靠的一般规律
    ipo:
      input:
        - 大量实践案例与观察样本
      process:
        steps:
          - 系统观察并记录多个特殊案例的现象
          - 通过实验与排除法筛除偶然因素
          - 从特殊案例中抽象出共有的规律
          - 用更多案例检验该规律的适用范围
      output:
        - 可靠的一般规律或方法论
    relations:
      related_to:
        - concept://演绎
        - concept://归纳演绎循环
        - concept://群体观察
        - concept://样本充分性
    tags: [归纳, 特殊到一般, 规律]

  - id: 思维链分析
    define: 研读AI的COT思维链，分析其思考过程对个人有哪些可借鉴之处
    ipo:
      input:
        - AI启用深度研究时输出的COT思维链
        - 个人原有的问题分析思路
      process:
        steps:
          - 取得AI进行深度研究时的COT思维链
          - 逐步研读AI分析和解决问题的思考过程
          - 分析该思考过程对个人有哪些好的借鉴
      output:
        - 可迁移到个人身上的思考方式与提问方式
    relations:
      uses:
        - entity://Google DeepResearch
      related_to:
        - concept://复盘
        - concept://外思考
        - concept://独立思考
    tags: [COT, 思维链, AI借鉴]

  - id: 技能转经验
    define: 通过复盘把做事情的技能提炼为带个人印记的经验模式的过程
    ipo:
      input:
        - 实践中已形成的个人技能
        - 做事情的过程记录与最终结果
      process:
        steps:
          - 记录做事情的完整过程与结果
          - 周期性复盘，比较预期与实际之间的差异
          - 提炼本次成功或失败背后自己的做法
          - 沉淀为带有个人印记的经验点
      output:
        - 带个人印记的经验模式
    relations:
      depends_on:
        - concept://知识转技能
      related_to:
        - concept://复盘
        - concept://经验模式库
        - concept://方法论抽象
    tags: [复盘, 经验沉淀, 个人印记]

  - id: 方法论抽象
    define: 由单个问题的做法上升到同类事情的方法，再抽象为个人方法论
    ipo:
      input:
        - 单个问题的解决过程
        - 多个同类事情的做法
      process:
        steps:
          - 复盘单个问题的解决过程，抽出可复用知识点
          - 将单个做法上升为处理同类问题的具体方法与步骤
          - 积累更多同类事情的做法并横向比较
          - 跨同类方法进一步抽象，形成个人方法论
      output:
        - 处理一类事情的个人方法论
    relations:
      depends_on:
        - concept://技能转经验
        - concept://复盘
      related_to:
        - concept://抽象
        - concept://知识点解耦
        - concept://归纳
    tags: [方法论, 抽象, 复盘]

  - id: 时间颗粒度
    define: 将时间分解到5分钟、10分钟等粒度进行管理的时间管理概念
    ipo:
      input:
        - 可自由支配的时间
        - 待安排的每日工作计划与任务
      process:
        steps:
          - 判断自己当前需要的时间分解粒度
          - 将一天的时间按该粒度切分为时间块
          - 把任务安排填入对应的时间块
          - 执行中检查实际耗时与计划的偏差
      output:
        - 按粒度切分的时间安排表
    relations:
      references:
        - entity://《底层逻辑》
      related_to:
        - concept://空间换时间
        - concept://碎片化时间利用
    tags: [时间管理, 颗粒度, 计划]

  - id: 最小目标验证
    define: 以最简单场景快速学习并实践，验证主干知识如何协同
    ipo:
      input:
        - 阶段一阶段二建立的基础认知与主干
        - 假想的应用场景
      process:
        steps:
          - 设定假想场景下的最小可行目标
          - 明确该目标的验证标准与自我期望
          - 不等理论全部学完，立即亲自动手实践
          - 对照标准确认结果是否满足期望
          - 复盘各个组件之间如何协同工作
      output:
        - 第一波可见的实践成果
        - 对主干知识协同方式的验证结论
    relations:
      related_to:
        - concept://修悟结合
        - concept://找寻主干
        - concept://POC验证
        - concept://实证
    tags: [最小目标, 及早实践, 验证]

  - id: 本源抽象
    define: 从树叶树枝朝树根追溯，找寻可作为演绎起点的根节点的抽象过程
    ipo:
      input:
        - 分散在末端的具体知识与现象
      process:
        steps:
          - 从最末端的具体知识点出发朝上追溯
          - 逐层抽象，把可归约的概念向上合并
          - 在不同分支的交汇处建立连接
          - 一直追溯到不再可追问的根节点
          - 以该根节点作为后续演绎泛化的起点
      output:
        - 可作为演绎起点的根节点
        - 跨分支建立的知识连接
    decomposition:
      - step: 逐层向上抽象
        uses: concept://抽象
        why: 只有朝树根方向抽象，原本无关的末端知识才会融合并建立连接
      - step: 定位根节点
        uses: concept://第一性原理
        why: 追溯到不能再被追问、不证自明的起点才是真正的根
      - step: 由根泛化
        uses: concept://演绎
        why: 越靠近根节点，后续演绎泛化时创新的可能性才越大
    relations:
      produces:
        - concept://第一性原理
      related_to:
        - concept://抽象
        - concept://跨领域迁移
        - concept://举一反三
    tags: [追本溯源, 抽象, 根节点]

  - id: 架构思维
    define: 以分解、集成、抽象、泛化、组合、复用、组装为核心内容的思维方式
    ipo:
      input:
        - 待设计的系统或复杂问题
      process:
        steps:
          - 对系统做分解，拆出组成部件
          - 对分解出的部件做抽象与泛化
          - 定义部件间的接口与约束并完成集成
          - 对已有资产做组合、复用与组装
      output:
        - 完整的系统架构设计方案
    relations:
      depends_on:
