# 第二轮填充 · 批次 4
# 原文依据：raw/关于思维的七个观点供大家参考.md、raw/在职场怎么抓住学习和成长的机会.md、
#           raw/基于思维框架逻辑来构建思维能力体系并应用到实践.md、
#           raw/如何提升自己的结构化思维和系统思维能力.md、
#           raw/如何理解辩证思维从抽象规定到思维具体化的完整过程.md、
#           raw/如何高效和系统化的构建个人思维和认知体系.md

concepts:
  - id: 主动探索
    define: 从被动接受任务转向主动思考，任务完成后主动弥补其暴露的知识缺陷
    ipo:
      input:
        - 已完成的一个具体工作任务
        - 已解决的一个具体问题
      process:
        steps:
          - 任务完成后追问该任务还涉及哪些知识或外延值得学习
          - 问题解决了追问该问题暴露了自己哪些知识缺陷
          - 针对识别出的缺陷主动去搜索材料并学习弥补
          - 在没有工作安排时也自主发起思考和探索
      output:
        - 补上的知识外延与缺陷清单
        - 持续自我提升的主动习惯
    relations:
      related_to:
        - concept://问题驱动学习
        - concept://从点到面学习
        - concept://主动信息过滤
        - concept://实践驱动学习
    tags: [主动学习, 自我驱动, 持续改进]

  - id: 事物群认知
    define: 由单个事物认知扩展到同类事物群，归纳抽象出普适性规律并入库
    ipo:
      input:
        - 多个同类事物的单次认知记录
        - 知识经验库中的历史同类分析经验
      process:
        steps:
          - 去知识经验库查找是否原来分析过类似的同类事物
          - 把同类事物放到一起做周期性的复盘
          - 抽象归纳出同类事物共性的规律和方法论
          - 将形成的普适性规律入库到经验模式库
      output:
        - 同类事物的普适性规律
        - 经验模式库中的新增条目
    decomposition:
      - step: 周期性复盘同类事物
        uses: concept://深度复盘
        why: 对一类事物的周期性复盘才是一个深度复盘过程
      - step: 从特殊到一般归纳抽象
        uses: concept://归纳
        why: 认知升级的关键就是从特殊到一般完成关键的抽象动作
    relations:
      is_a:
        - concept://事物认知
      depends_on:
        - concept://深度复盘
        - concept://归纳
      produces:
        - concept://经验模式库
      related_to:
        - concept://举一反三
        - concept://空间换时间
    tags: [事物群, 归纳抽象, 认知升级]

  - id: 从点到面学习
    define: 由问题之点出发，复盘后延展到该领域整个知识体系和框架的学习
    ipo:
      input:
        - 实践中已经解决的一个具体问题
      process:
        steps:
          - 承认问题解决并不是终点并进入复盘
          - 思考该问题究竟涉及到哪个知识体系
          - 确定对该领域进行系统和有针对性的学习的内容
          - 展开对该领域整个知识体系和框架的学习
      output:
        - 该领域完整的知识体系与框架
    relations:
      depends_on:
        - concept://复盘
      related_to:
        - concept://问题驱动学习
        - concept://知识体系构建
        - concept://知识地图
    tags: [问题驱动, 由点到面, 知识体系]

  - id: 任务依赖打破
    define: 通过任务拆分打破传统任务依赖与关键路径约束，提升早期资源利用率
    ipo:
      input:
        - 项目的任务清单与传统任务依赖关系
        - 团队的角色分工与可用资源
      process:
        steps:
          - 识别哪些工作只有特定角色才能完成从而形成等待
          - 将任务拆分为更细粒度可并行的子任务
          - 打破传统的前置依赖与关键路径约束
          - 把当前能够提前做的工作尽早启动迭代
          - 持续检查是否有人闲着没事做
      output:
        - 提前启动的工作任务安排
        - 项目早期更高的资源利用率
    relations:
      depends_on:
        - concept://分解
      related_to:
        - entity://关键路径法
        - concept://依赖关系排序
        - concept://迭代思维
    tags: [任务拆分, 并行启动, 资源利用率]

  - id: 信息茧房
    define: 推荐机制只让人看到想看的内容，不断固化习惯并收窄认知
    ipo:
      input:
        - 平台上实际存在的全部内容
        - 你过去的点击与浏览行为
      process:
        steps:
          - 内容推荐机制按你的历史行为筛选推送内容
          - 你实际看到的内容只占全部内容的冰山一角
          - 有用的但不在兴趣范围内的信息被过滤掉
          - 行为习惯被不断固化并停留在自我舒适区
          - 认知范围越来越狭窄
      output:
        - 只剩自己想看的少量内容
        - 受限且收窄的个人认知
    relations:
      related_to:
        - concept://主动信息过滤
        - concept://认知偏差
        - concept://跳出盒子
        - concept://体系思维
    tags: [推荐机制, 信息窄化, 认知障碍]

  - id: 去我化呈现
    define: 输出呈现时去自我中心，关注受众真正关心的内容与受众的知识经验结构
    ipo:
      input:
        - 已内化的知识或解决方案内容
        - 受众的角色与知识经验结构
      process:
        steps:
          - 明确本次呈现面向的受众是谁
          - 分析受众的经验和知识结构是怎样的
          - 判断受众真正关心的关键内容是什么
          - 以最有效的方式把Key Point呈现给受众
          - 用不同时长和不同受众反复做呈现练习
      output:
        - 受众能抓住重点的呈现版本
        - 面向不同受众的差异化讲述方案
    relations:
      related_to:
        - concept://呈现和泛化
        - concept://结构化呈现
        - concept://自我最简陈述
        - concept://知识显性化
    tags: [受众视角, Key Point, 去我化]

  - id: 场景约束结合
    define: 应用抽象概念必须结合相应场景，不能脱离事物内在关联与依赖约束
    ipo:
      input:
        - 已完善属性与行为的抽象概念
        - 待应用的具体场景
      process:
        steps:
          - 取出抽象概念上附带的属性与行为特征
          - 为每条行为特征找出其成立的前提条件与约束
          - 将概念放到具体场景中检验其行为是否成立
          - 按场景约束补充或修正属性与行为定义
      output:
        - 带前提约束的行为特征
        - 结合场景后更完整的概念认知
    relations:
      depends_on:
        - concept://思维具体化
        - concept://抽象规定
      related_to:
        - concept://辩证思维
        - concept://属性行为内在影响分析
        - concept://信息场景依赖
    tags: [场景约束, 前提条件, 概念应用]

  - id: 复杂匹配
    define: 先将问题分解为细粒度子问题，底层逐一匹配后再向上聚合形成完整方案
    ipo:
      input:
        - 待解决的一个新问题
        - 经验模式库中的细粒度可复用经验点
      process:
        steps:
          - 将问题分解为细粒度的子问题
          - 在底层为每个子问题逐一匹配已有的经验模式
          - 将底层匹配到的结果向上聚合
          - 整合形成针对原问题的完整解决方案
      output:
        - 针对该问题的完整解决方案
    relations:
      is_a:
        - concept://模式匹配
      depends_on:
        - concept://问题分解
      uses:
        - concept://经验模式库
      related_to:
        - concept://集成
        - concept://跨领域迁移
    tags: [模式匹配, 分解, 聚合]

  - id: 对立统一
    define: 不只看到事物好的一面，综合正反两个方面形成更加完整的结论
    ipo:
      input:
        - 事物被观察到的正面表现
        - 事物被观察到的反面表现
      process:
        steps:
          - 列出事物好的一面的相关论据
          - 列出事物不好的一面的相关论据
          - 认识到不能只用单一方面下结论
          - 把正反两个方面综合起来考量
          - 形成一个更加完整的结论
      output:
        - 综合正反两面后的完整结论
    relations:
      related_to:
        - concept://辩证思维
        - concept://正题反题合题
        - concept://辩证综合
        - concept://二元对立
      references:
        - entity://赫拉克利特
        - entity://《小逻辑》
    tags: [正反两面, 辩证法, 综合结论]

  - id: 属性行为内在影响分析
    define: 分析抽象事物具备的属性和行为之间的内在影响以及行为间的正反作用
    ipo:
      input:
        - 已完成属性与行为定义的抽象概念
      process:
        steps:
          - 列出该抽象事物具备的属性与行为特征
          - 分析属性与行为之间的内在影响关系
          - 分析行为与行为之间相互的正反作用
          - 识别每个行为特征成立所需的条件判断
          - 将得到的约束与联系回填到概念定义中
      output:
        - 属性行为间的内在影响关系
        - 行为间的正反作用关系
    relations:
      depends_on:
        - concept://思维具体化
      related_to:
        - concept://辩证思维
        - concept://场景约束结合
        - concept://动静结合分析
        - concept://动态行为分析
    tags: [属性行为, 正反作用, 辩证逻辑]

  - id: 岗位能力差距分析
    define: 分析岗位所需核心能力、诚实面对短板，形成现状与目标的GAP差距清单
    ipo:
      input:
        - 所在岗位要求掌握的核心能力清单
        - 自己当前真实的能力现状
      process:
        steps:
          - 列出岗位究竟需要掌握哪些核心能力
          - 诚实评估自己当前的现状与真实短板
          - 列出自己想要达到的能力目标清单
          - 比对现状与目标形成GAP差距清单
          - 依据差距制定有针对性的季度学习计划
      output:
        - 能力现状与目标的GAP差距清单
        - 有针对性的季度学习计划
    relations:
      depends_on:
        - concept://目标定位
      produces:
        - concept://学习路径
      related_to:
        - concept://量化自我评估
        - concept://知识体系构建
    tags: [能力差距, 目标清单, 学习计划]

  - id: 思维三阶段
    define: 信息输入、大脑处理、价值输出，处理含定义降噪、加工处理、模式匹配
    ipo:
      input:
        - 外界输入的信息
      process:
        steps:
          - 接收外界信息的输入
          - 对信息做定义与降噪，筛掉无效部分
          - 对保留下来的信息做加工处理
          - 与已有知识经验做模式匹配
          - 形成有价值的输出结果
      output:
        - 对事物的认识或问题的解决方案
    decomposition:
      - step: 定义降噪
        uses: concept://信息降噪
        why: 加工车间第一步是筛选清洗，去掉噪声才谈得上后续加工
      - step: 加工处理
        uses: concept://加工
        why: 有效信息需要被组织与加工才能成型
      - step: 模式匹配
        uses: concept://模式匹配
        why: 大脑会自动调用已有知识经验对比匹配，形成认识与方案
    relations:
      contains:
        - concept://信息降噪
        - concept://加工
        - concept://模式匹配
      related_to:
        - concept://思维双主线
        - concept://思维框架体系
        - concept://元认知
    tags: [信息输入, 大脑处理, 价值输出]

  - id: 思维具体化
    define: 为抽象概念完善其属性与行为特征，属性行为完备才完成对事物的完整抽象
    ipo:
      input:
        - 从特殊到一般得出的抽象概念
        - 关于该类事物的感性认知积累
      process:
        steps:
          - 确认已经抽象出的概念名，类似Class类的定义
          - 具体化地定义该概念究竟应该包括哪些属性
          - 具体化地定义该概念究竟应该具备哪些行为特征
          - 检查属性与行为是否已经完备
          - 属性行为完备才算完成对事物的完整抽象
      output:
        - 具备完整属性与行为特征的抽象概念定义
    relations:
      depends_on:
        - concept://抽象规定
      related_to:
        - concept://辩证思维
        - concept://属性行为内在影响分析
        - concept://概念抽象
        - entity://面向对象
    tags: [属性行为, 完整抽象, Class类]

  - id: 批判性提问
    define: 对既有流程和最佳实践持续追问为什么，引发对陈旧做法的重新思考
    ipo:
      input:
        - 既有的流程、规范或最佳实践
      process:
        steps:
          - 指出某项流程或最佳实践没有人说得清为什么
          - 对该做法持续追问为什么一定要这么做
          - 判断它在当前场景下是否仍然成立
          - 提出质疑并引发团队对陈旧做法的重新思考
          - 重新设计一套更精简的替代方案
      output:
        - 更精简高效的替代方案
    relations:
      is_a:
        - concept://批判思维
      related_to:
        - concept://方法论迁移
        - concept://独立思考
        - entity://敏捷方法
    tags: [质疑, 追问为什么, 流程优化]

  - id: 抽象规定
    define: 从特殊到一般得出的抽象概念，类似面向对象分析中Class类的定义
    ipo:
      input:
        - 对多个同类具体事物的感性认知
      process:
        steps:
          - 观察并积累多个同类的具体事物
          - 从特殊到一般完成关键的抽象动作
          - 给出该类事物的概念名
          - 此时只有类名，属性与方法尚未完备
      output:
        - 一个尚未完备的抽象概念
    relations:
      is_a:
        - concept://抽象
      related_to:
        - concept://思维具体化
        - concept://概念抽象
        - concept://归纳
        - entity://面向对象
    tags: [从特殊到一般, Class类, 抽象]

  - id: 模仿超越
    define: 先模仿他人结构和写法做到形似，理解内在逻辑后经实践消化形成自己的方法论
    ipo:
      input:
        - 同类材料与他人写好的文档或PPT
        - 他人的方法论与最佳实践
      process:
        steps:
          - 上网搜索相似材料，看看其他人究竟怎么写的并做对比
          - 完全模仿他人的结构和写法，先做到形似
          - 详细分析并对别人方法论的内在逻辑进行思考
          - 真正从原理上搞明白而不完全照搬
          - 通过自身项目大量实践消化，取其精华去其糟粕
      output:
        - 适合团队和自我的方法论体系
    relations:
      uses:
        - entity://IBM
        - entity://埃森哲
        - entity://HP
      related_to:
        - concept://方法论抽象
        - concept://实践反刍
        - concept://方法论迁移
    tags: [模仿形似, 内在逻辑, 实践消化]

  - id: 正题反题合题
    define: 正题与反题通过辩证思考走向合题的辩证逻辑推进形式
    ipo:
      input:
        - 一个待考察的命题作为正题
        - 与之相对的反命题
      process:
        steps:
          - 提出正题
          - 提出与之相对的反题
          - 对正题与反题做辩证思考
          - 由正题反题推进到对立统一形成合题
      output:
        - 对立统一后的合题
    relations:
      is_a:
        - concept://辩证逻辑
      related_to:
        - concept://对立统一
        - concept://辩证思维
        - concept://二元对立
      references:
        - entity://《小逻辑》
        - entity://黑格尔
    tags: [正题反题, 合题, 黑格尔]

  - id: 深度复盘追问
    define: 复盘不停留在表面原因，逐层追问为什么以找到真正的解决方案
    ipo:
      input:
        - 刚结束的项目或事件
        - 已经给出的表面原因
      process:
        steps:
          - 项目结束后给自己留出专门的思考时间
          - 问自己做对了什么、做错了什么、为什么会这样、下次如何更好
          - 不满足于时间估计不准确这类表面原因
          - 继续追问为什么以逐层深挖
          - 找到流程或方法上的漏洞并在下个项目中调整
      output:
        - 真正的解决方案
        - 下一个项目的改进调整项
    relations:
      is_a:
        - concept://深度复盘
      depends_on:
        - concept://复盘
      related_to:
        - concept://根因分析
        - concept://因果链分析
        - concept://批判性提问
    tags: [追问为什么, 深度挖掘, 改进]

  - id: 知识串联
    define: 以串接和扩展把已有知识点整合为体系，并转化为自己的经验与方法论
    ipo:
      input:
        - 已有的大量知识点存量
        - 实践中产生的新经验
      process:
        steps:
          - 盘点自己已有的知识点
          - 在知识点之间建立前后串接关系
          - 对串联后的知识点做扩展与融会贯通
          - 在持续的自我实践中检验串联形成的经验
          - 将串联能力沉淀为工作经验和方法论
      output:
        - 串联成体系的知识网络
        - 转化为自我的工作经验与方法论
    relations:
      related_to:
        - concept://融会贯通
        - concept://知识关联
        - concept://知识网络构建
        - concept://经验模式库
        - concept://知识结构化
    tags: [知识串联, 融会贯通, 方法论]

  - id: 科学决策
    define: 设定标准、成本、风险与权重，以综合得分比较方案
    ipo:
      input:
        - 多个可选的备选方案
        - 真实的场景与问题目标
      process:
        steps:
          - 明确决策目标与问题场景
          - 确定评价的准则与维度
          - 结合场景与问题驱动为各准则设定权重
          - 对各方案按准则评估打分并计算综合得分
          - 比较综合得分选择最终方案
      output:
        - 选定的最终方案
        - 落到具体行动上的计划
    relations:
      depends_on:
        - concept://评价模型
      related_to:
        - concept://结构化决策
        - concept://多目标决策转换
        - concept://事物认知
        - concept://优先级排序
    tags: [评估准则, 权重, 综合得分]

  - id: 自我最简陈述
    define: 用最简单方式陈述一个道理，越能最简说明越说明深入实践过并了解细节
    ipo:
      input:
        - 想要表达的一个道理或一件事
        - 自己亲身经历过的细节实践
      process:
        steps:
          - 回想该道理是否来自自己亲身的细节实践
          - 剔除只说大套话与普适大道理的理论表述
          - 用最简单的方式把该道理陈述出来
          - 检验能否说清究竟该怎么做
          - 以能否真正落地来检验陈述是否到位
      output:
        - 最简且能落地的陈述
        - 反映出的自身实践深浅程度
    relations:
