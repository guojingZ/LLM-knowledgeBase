        - concept://呈现和泛化
        - concept://去我化呈现
        - concept://知识显性化
        - concept://证悟
    tags: [最简陈述, 实践深浅, 落地]

  - id: 认知偏差
    define: 大脑为节省能量形成思维捷径而带来的确认偏差、锚定效应、可得性偏差
    ipo:
      input:
        - 大脑接收到的待判断信息
      process:
        steps:
          - 大脑为节省能量启用思维捷径
          - 捷径带来确认偏差、锚定效应和可得性偏差
          - 主动寻找反面证据
          - 延迟判断并做多角度思考
          - 寻求外部反馈来校正判断
      output:
        - 被识别出的偏差清单
        - 校正后的判断
    relations:
      related_to:
        - concept://元认知
        - concept://信息茧房
        - concept://批判思维
        - concept://误认因果
        - concept://实证
    tags: [确认偏差, 锚定效应, 思维捷径]

  - id: 认知四境界
    define: 不知道自己不知道、知道自己不知道、知道自己知道、不知道自己知道
    decomposition:
      - step: 不知道自己不知道
        uses: concept://元认知
        why: 此境界知识库和经验库都贫乏且元认知缺失，需靠重大挫折意识到无知
      - step: 知道自己不知道
        uses: concept://知识体系构建
        why: 突破路径是系统化学习与大量输入，构建初步知识框架
      - step: 知道自己知道
        uses: concept://深度复盘
        why: 突破路径是大量刻意实践与深度复盘反思，使理性推理流畅
      - step: 不知道自己知道
        uses: concept://模式匹配
        why: 此境界的特征是专家直觉，能快速识别模式并做出判断
    relations:
      related_to:
        - concept://元认知
        - concept://认知水平差异
        - concept://模式匹配
        - concept://长期主义
    tags: [认知境界, 元认知, 螺旋上升]

  - id: 评价模型
    define: 认知升级的关键，负责选择评价维度并打分，是事物认知的演绎过程
    ipo:
      input:
        - 已完成认知的事物
        - 可选的评价维度
      process:
        steps:
          - 确定对该事物评价需要选择哪些维度
          - 为每个维度设定打分标准
          - 对事物在各维度上逐一打分
          - 汇总形成该事物的评价结论
          - 将评价结果交给决策模型结合场景权重做选择
      output:
        - 该事物的多维度评价得分
    relations:
      is_a:
        - concept://演绎
      depends_on:
        - concept://事物认知
      related_to:
        - concept://科学决策
        - concept://结构化决策
        - concept://认知升华
    tags: [评价维度, 打分, 认知升级]

  - id: 输出倒逼输入
    define: 通过写博客、做分享、向他人解释，把模糊理解转化为清晰表达
    ipo:
      input:
        - 刚学到的新知识
        - 自己尚且模糊的理解
      process:
        steps:
          - 学完新知识后主动寻找输出场景
          - 通过写博客、做部门分享或向同事解释来输出
          - 为讲清楚而把模糊理解转化为清晰表达
          - 在输出中暴露自己理解上的漏洞
          - 回头补学并修正理解
      output:
