  - id: 认识论分析
    define: 研究知识、信念与意见的性质、起源、范围和限制
    ipo:
      input:
        - 对外部世界的感知与观察
        - 已有的知识、信念与意见
      process:
        steps:
          - 区分事物本身与对事物的认识，承认认识因人而异
          - 追问我们如何知道我们所知道的
          - 检验该认识的真理标准
          - 界定这一认识的适用范围与限制条件
          - 由感性材料经知性判断再到理性综合形成普遍必然认知
      output:
        - 关于认识能力边界与知识有效性的判断
    decomposition:
      - step: 区分事物与对事物的认识
        uses: concept://事物认知
        why: 事物的存在是绝对客观的，而认识是后天的且因人而异
      - step: 感性到理性逐级加工
        uses: concept://感性知性理性三分
        why: 先验自我提供先天形式，感知观察提供后天质料，两者结合才形成理性认知
      - step: 考察认识的来源
        uses: concept://先验知识
        why: 需要判断知识是来自先天先验形式还是后天的经验归纳
    relations:
      references:
        - entity://康德
        - entity://《纯粹理性批判》
        - entity://休谟
      related_to:
        - concept://本体论分析
        - concept://感性知性理性三分
        - concept://先验知识
    tags: [认识论, 知识来源, 认识边界, 哲学]

