        - 先验的认识形式
      process:
        steps:
          - 感性接受直观材料
          - 知性用范畴对材料进行判断推理
          - 理性追求更高层次的统一
          - 在实践中验证并证悟为智慧
      output:
        - 从感性上升到理性的知识
        - 经实践证悟的智慧
    relations:
      references:
        - entity://康德
      related_to:
        - concept://感性知性理性三分
    tags: [感性, 知性, 理性, 证悟]

