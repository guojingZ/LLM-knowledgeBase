  - id: 双维度知识矩阵
    define: 纵向全生命周期流程、横向分层解耦交织的知识组织方式
    ipo:
      input:
        - 待组织的知识领域
      process:
        steps:
          - 纵向按全生命周期流程展开完整价值链
          - 横向按业务、数据、技术、管理分层解耦
          - 横纵交织形成矩阵坐标
          - 将知识点填入矩阵并识别空白格
      output:
        - 覆盖领域全貌的知识矩阵
        - 知识边界与空白点
    relations:
      related_to:
        - concept://知识体系构建
        - concept://知识地图
    tags: [矩阵, 知识体系, 双维度]

  - id: 知识地图
    define: 呈现知识全景、标明知识边界与当前位置和目标位置的全景图
    ipo:
      input:
        - 领域知识全景信息
        - 个人当前掌握情况
      process:
        steps:
          - 列出领域全部知识节点并划定边界
          - 标注自己当前所处位置
          - 标注想要达到的目标位置
      output:
        - 知识全景地图
        - 当前位置与目标位置的差距
    relations:
      produces:
        - concept://学习路径
      related_to:
        - concept://知识体系构建
    tags: [知识地图, 全景, 定位]

  - id: 学习路径
    define: 基于当前位置与目标位置的差距制定的针对性学习计划与路线
    ipo:
      input:
        - 知识地图上的当前位置与目标位置
        - 知识点间的依赖关系
      process:
        steps:
          - 计算当前位置与目标位置的差距
          - 按知识点对目标的贡献度排优先级
          - 按前后依赖顺序排列学习次序
          - 制定分阶段学习计划
      output:
        - 有针对性的学习路径与计划
    relations:
      depends_on:
        - concept://知识地图
      related_to:
        - concept://依赖关系排序
    tags: [学习路径, 差距, 计划]

  - id: 认知升华
