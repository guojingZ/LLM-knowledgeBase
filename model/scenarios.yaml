version: "2.0"
updated_at: "2026-09-23"

scenarios:

  - id: 如何从系统思维进阶到第一性原理
    sources:
      - raw/AI时代的个体思维进化从系统思维到第一性原理.md
    define: 面对复杂系统时，如何通过分解关系与回溯根节点完成思维的逐层抽象
    trigger: "用户已经能做系统思考（会分解组件、分析相互制约关系），但发现自己只是在前人经验和细分学科的大前提下做演绎推理，得出的都是微创新和修修补补，难以产生从0到1的突破；或者想弄清系统思维和第一性原理到底是什么关系，\"越抽象越强大\"这条路具体该怎么往上走。"
    goal: 用户能从组件+关系+原则范式的系统思维出发，沿抽象之路从树叶树枝回溯到不可再追问的根节点（空间+时间+逻辑），以该元起点重新演绎泛化，获得跨领域迁移、举一反三和颠覆式创新的能力。
    composition:
      - phase: 以系统思维为起点
        uses:
          - concept://系统思维
          - concept://形式逻辑
          - concept://辩证逻辑
          - entity://《系统思考》
        rule: 第一性原理应放在系统思维之下，先掌握融入形式逻辑与辩证逻辑的系统思维，完成从点线到网状思维结构的转换。
        key_points:
          - 系统思维 = 组件 + 组件间关系 + 原则范式
          - 形式逻辑更多是线性的推理逻辑，辩证逻辑是建立组件间相互关系和约束的逻辑，两者融合形成点线到网状思维结构的转换
          - 系统思维让人以动态发展眼光，从空间时间多维度、从整体局部、从外在到内在约束整体性地思考问题
          - AI出来后我们很容易变成问题提出者而不是问题思考者，更需要锻炼系统思维能力
      - phase: 分解关系与跨领域类比
        uses:
          - concept://分解
          - concept://要素关联分析
          - concept://跨领域迁移
        rule: 跨领域类比本质是系统思维的应用，通过知识点之间的关联和映射形成知识网络，是走向抽象前的必要准备。
        key_points:
          - 跨领域类比是系统思维能力的应用，实现知识点之间的关联和映射，形成知识网络
          - 理解复杂系统首先要分类和分解，将大系统分解为子系统或更小的单元
          - 分解的树状展开往往只是第一步，分析展开后部件或因素之间的相互影响和制约才是最重要的
          - 系统思维让人看清多个影响因子如何在某个时间点达到动态平衡
      - phase: 沿抽象之路回溯根节点
        uses:
          - concept://抽象
          - concept://找寻主干
          - concept://本源抽象
          - concept://知识树
        rule: 探寻第一性原理是朝前不断抽象的过程，要从树叶树枝追本溯源找到最基本的根节点，抽象是构建跨领域类比的关键。
        key_points:
          - 对世界的认知是不断演绎泛化的过程，探寻第一性原理则是一个朝前不断抽象的过程
          - 最末端的叶子和叶子之间没有关联，朝前追溯抽象到树干这个地方才融合在一起并建立连接
          - 越向树干和根节点抽象，越容易具备举一反三的能力
          - 越抽象越容易完成自我知识的跨领域融合，真正做到触类旁通，把所有知识体系融合为一个整体
      - phase: 落到空间+时间+逻辑的元起点
        uses:
          - concept://第一性原理
          - concept://先验知识
          - entity://亚里士多德
          - entity://康德
        rule: 第一性原理是系统中不能再被追问或推导的、最根本的、不证自明的起点或前提，可简化为空间+时间+逻辑。
        key_points:
          - 亚里士多德定义的第一性原理是不证自明的起点或前提，否则为每个前提找前提会陷入无限回溯困境
          - 康德的先验无需证明的知识恰好就是空间、时间、数和十二范畴逻辑
          - "这个根是反二元对立的，是一种天然的融合，类似\"有物混成，先天地生\""
          - 二元对立的不断分裂和泛化演绎出了不同的知识体系和学科，这些是无法穷尽的
      - phase: 从根节点重新演绎泛化
        uses:
          - concept://演绎
          - concept://归纳演绎循环
          - concept://举一反三
          - entity://马斯克
        rule: 从根节点重新演绎泛化才能突破前人思维知识约束，多数人真正缺的是归纳和抽象逻辑而非演绎逻辑。
        key_points:
          - 只在前人基础上演绎推理，虽能得出新结论但很难得出新知识，可以有创新但都是微创新
          - 颠覆式创新和从0到1的突破必须回归本质的根节点，越抽象后续泛化时创新的可能性越大
          - 马斯克的很多突破性创新基本体现了这个思路
          - 第一性原理不适合所有普通人，越抽象到最底层，后续演绎泛化的推理逻辑和步骤就越多
    inputs:
      - 一个已被分解为组件和关系的复杂系统
      - 该领域前人已总结的细分知识与大前提
      - 跨领域可类比的现象或知识
    outputs:
      - 从树叶到根节点的抽象路径
      - 不可再追问的第一性原理元起点
      - 从根节点重新演绎出的创新方向与方案
      - 跨领域融合后的统一知识网络
    tags: [第一性原理, 系统思维, 抽象, 跨领域迁移, 颠覆式创新]

  - id: 如何分析和解决复杂问题
    sources:
      - raw/我们在解决复杂问题时如何抽丝剥茧透过现象看本质.md
      - raw/我是如此思考的思维整体框架和逻辑.md
      - raw/问题分析和解决逻辑麦肯锡七步成诗仅是开始.md
      - raw/问题分析解决核心逻辑麦肯锡解决问题七步法仅是开始.md
    define: 系统或业务出现异常偏差时，如何定义问题、分析根因、验证并解决
    trigger: "系统或业务运行出现明确偏差时触发，例如\"CRM 客户信息查询很慢\"\"提交出差申请时报错\"\"今年经营业绩持续下滑\"。此时用户手上只有零散的现象、各方说法和情绪，说不清问题点究竟在哪里、该从哪一环下手；或者已经反复修过，但问题复发、甚至刚解决旧问题又引入新问题（加索引让查询变快却让录入变慢）。"
    goal: 产出一份可被量化检验的问题定义陈述、一张按优先级排序的关键影响因素与根因假设清单、经假设验证后确认的根本原因，以及包含备选方案评估、决策与详细行动步骤的解决方案；并通过复盘把本次实践转化为可复用的经验模式点，避免同类问题下次仍从零开始排查。
    composition:
      - phase: 问题定义与分类
        uses:
          - concept://问题定义
          - concept://问题分类
          - entity://5W1H
          - entity://问题四分类
          - entity://《你的灯亮着吗》
        rule: 问题就是期望值与实际值之间的差距，先用 5W1H 把涉众、环境场景、操作步骤、异常信息和边界条件描述清楚，问题定义清楚往往就解决了一半；同时务必不要把解决方案误当作问题本身。
        key_points:
          - 解决途径只有两条，降低期望或改变现状
          - 完整定义包括涉及的人、产生的环境（空间和时间）、产生的过程（方法、步骤、工具）三类内容
          - 借鉴《提问的智慧》，异常要有文字和图片详细描述，并自己先把边界条件搞清楚
          - 先分清是 What、How、Which、Where 哪一类，Where 类即异常偏差才走根因定位路线
          - 牛耕田慢的真正问题是提升耕田效率，而不是去找比牛快的动物
      - phase: 结构化分解与影响因子穷举
        uses:
          - concept://问题分解
          - concept://结构化分析
          - concept://MECE
          - entity://逻辑树
          - entity://鱼骨图
          - entity://头脑风暴
        rule: 静态分析从环境、背景、人等因素列出影响因子，动态分析从流程、活动、步骤列出影响因子，两者不能混淆在同一层；分解用的模型归根到底都是树模型，需符合 MECE 且同层同粒度。
        key_points:
          - 分解可以是目标本身的分解，也可以是问题可能产生原因的分解
          - 经验不足时走流程分析加头脑风暴的自底向上路线，避免关键要素遗漏
          - 鱼骨图按人、机、料、法、环五个方面分解，重点体现因果关系
          - 逻辑树前面几层可分解子目标，后面几层分解控制变量
          - 任何问题的产生只有两个原因，输入的某个 X 出错，或加工中某个步骤出错
      - phase: 优先级排序与假设提出
        uses:
          - concept://优先级排序
          - concept://非结构化分析
          - concept://经验存量
          - concept://依赖关系排序
          - entity://二八法则
        rule: 排序的目的是确定关键影响因素，这份优先级列表是进入问题解决阶段的关键输入；有经验者直接提出最可能假设（非结构化），无经验者才逐个穷举验证（结构化）。
        key_points:
          - 优先级是综合多个属性要素得出的级别，不是单一要素排序
          - 排序依据只有两种，历史经验积累和初步诊断中已做的假设验证与排除
          - "按二八原则找出那 20% 的最可能影响因素"
          - 别人解决问题快，是因为直接提出最可能假设并验证，而不是逐个排查
          - 分析阶段就要开展初步实践活动，把非关键点排除或降低其优先级
      - phase: 假设验证与根因确认
        uses:
          - concept://假设验证
          - concept://根因分析
          - concept://根因两类
          - concept://实证
          - entity://PDCA
        rule: 问题解决的本质就是按优先级对假设制定验证方案并执行，观察结果是否消除了差距；难点从来不在验证本身，而在解决当前问题时是否又引入了新的问题。
        key_points:
          - 制定详细的验证方案和验证计划，执行后观察和确认结果是否解决问题
          - 单问题多因子场景下多个举措并行，难以评估单个影响因素的功效
          - 面对事物群或问题群时，可能只解决占绝大多数原因的单一因素就能把结果控制到期望范围
          - 警惕加索引解决查询慢却导致录入慢这类引入新问题的情况
          - 没有复盘的实践只是经历不是经验，PDCA 循环的核心是 Check 环节
      - phase: 决策行动与复盘沉淀
        uses:
          - concept://结构化决策
          - concept://科学决策
          - concept://复盘
          - entity://决策矩阵
          - entity://麦肯锡七步法
        rule: 决策要基于多维度评估排序，除影响因子外还要考虑实施难度、投入工作量成本、实施周期，因此最终决策不一定是解决最关键影响点；行动后必须复盘，把实践转化为自己的经验库。
        key_points:
          - 决策是从多个备选方案中确定最优方案，行动是针对最优方案制订详细计划
          - 用决策矩阵把评估标准、成本、风险按权重计算综合得分，将直觉转化为结构化数据
          - 不能因为手上有锤子就把所有东西看成钉子，要跳出既有框架约束
          - 简单的事情简单处理，复杂的事情要分类、分解、细化、演绎，做细粒度匹配
          - 解决问题的能力只能在不断实践、不断碰壁中自我总结出来
    inputs:
      - 出现异常或偏差的现象描述、报错信息与初步运行数据
      - 涉众诉求与可量化的期望目标值
      - 历史经验库、同类问题处理记录与领域知识
      - 可用于执行验证的环境、数据与工具
    outputs:
      - 明确的问题定义陈述（含边界条件与差距量化）
      - 按优先级排序的关键影响因素与根因假设清单
      - 已确认的根本原因与验证计划执行结论
      - 含备选方案评估、决策与行动步骤的解决方案，以及复盘沉淀的经验模式点
    tags: [问题分析, 根因定位, 结构化思维, 决策, 复盘]

  - id: 如何制作一份完整的解决方案
    sources:
      - raw/思维究竟是什么思维的逻辑和模式匹配.md
      - raw/问题分析和解决逻辑麦肯锡七步成诗仅是开始.md
    define: 面对客户目标或需求时，如何形成多个措施协同融合的完整解决方案
    trigger: "拿到客户或业务方的一个目标性需求时触发，例如\"把产品交付周期从 50 天缩短到 30 天以内\"\"编写一份售前技术方案文档\"\"解决当前业务系统性能缓慢的问题\"；或者跨入一个陌生业务域（只做过 CRM 却要写智慧校园方案），手上有一堆搜来的资料却不知道如何组织结构、保证方案内部逻辑自洽并能真正支撑目标达成。"
    goal: 产出一份由多个解决措施协同融合而成的完整解决方案，其中现状与问题能映射到目标、目标能分解到各架构模块、各子模块能回答交互逻辑与可实现性，并形成从提出问题、总体设计、详细实现到实施方案的承上启下、相互集成的整体，而不是网上材料的简单拼凑。
    composition:
      - phase: 破题与目标转化
        uses:
          - concept://破题
          - concept://问题定义
          - concept://目标转化
          - entity://SMART原则
          - entity://问题四分类
        rule: 不破不立，先把客户的表述转化为明确目标，且目标必须同时具备空间性与时间性；目标明确前不适合做过多发散性思考，否则大量思考内容无法围绕主线。
        key_points:
          - 智慧校园解决方案等于智慧信息化加校园业务加 IT 解决方案，先识别出自己的经验差距
          - 把问题转化为目标，再把多个子目标抽象或提升为一个终极目标
          - 目标要符合 SMART 原则，重点体现时间性 T 与空间性 S 和 M
          - 目标是基础不是用来平衡的，用来平衡的只是各个影响和制约因素
          - 目标难以量化时可先做短周期试验，用试验验证目标的可行性
      - phase: 素材收集与子问题映射
        uses:
          - concept://问题分解
          - concept://问题域映射
          - concept://模式匹配
          - entity://麦肯锡七步法
          - entity://头脑风暴
        rule: 第一阶段把目标分解为子问题，再将收集到的论据素材逐条映射到对应子问题上；已有知识库不足就去学习和搜索，把支撑不了目标的素材全部清理掉。
        key_points:
          - 业界做法加已有知识经验等于达成目标的完整框架逻辑
          - 素材包括同类解决方案材料与目标业务领域资料两类
          - 大量浏览后要做对比，拆分出各资料的关键项，再按自己的目标整合
          - 最后留下的必须是能够完全支撑目标的有用论据材料
          - 通用 IT 解决方案思路可归纳为提出问题、总体设计、详细实现三大部分
      - phase: 归纳整合与结构搭建
        uses:
          - concept://归纳
          - concept://集成
          - concept://结构化呈现
          - entity://金字塔原理
          - entity://金字塔结构
        rule: 第二阶段做粗粒度对应，抽象归纳形成大块解决模块并对应到子问题域，同时对素材做优先级排序；第三阶段进一步归纳成整体，再从归纳反转到演绎。
        key_points:
          - 各模块必须首先是一个整体不能散，不论静态金字塔结构还是动态流程结构
          - 从归纳反转到演绎，呈现各解决模块如何充分支撑各子问题的解决
          - 内容必须承上启下、相互衔接，不应有脱离核心主题结构的内容
          - 通过各个解决方案模块的集成和联动最终完成大目标的解决
          - 避免搜到一两个方案就简单拼凑，那样内在逻辑自己都讲不清楚
      - phase: 逐层求精与动态流程落地
        uses:
          - concept://流程分析
          - concept://演绎
          - concept://自底向上装配
          - concept://结构化思维
        rule: 这一步解决如何做层面的匹配，即过程步骤序列如何达成目标，必须讲清事物内部运转机制，靠动态流程分析把关键活动的输入输出衔接起来。
        key_points:
          - 搜索解决的是目标到目标的匹配，这一步要解决通过什么过程步骤达到目标
          - 动态分析的关键是流程分析，流程分析的关键是把各活动节点的输入输出搞清楚
          - 如同给出爆米花机后还要解释它如何把玉米加白糖变成爆米花
          - 可自底向上装配，先整合各子件，再集成到总体架构框架上
          - 从树木到树干是分解梳理，从细枝末节组合到树干是装配过程
      - phase: 匹配逻辑检验与呈现
        uses:
          - concept://逻辑自洽
          - concept://方案整合
          - concept://呈现和泛化
          - entity://决策矩阵
        rule: 方案最常见的逻辑性错误是问题分析和匹配逻辑缺失，现象描述一大堆就直接给出完整架构；必须把从问题如何得出方案、细粒度匹配后如何向上聚合的过程讲清楚。
        key_points:
          - 现状和问题要通过建设思路映射到目标，实现问题与目标的匹配
          - 目标达成要分解到具体架构设计中的各个模块，实现目标到实现的匹配
          - 各子模块要实现描述清楚，回答交互逻辑和可实现性
          - 结构逻辑、形式逻辑、匹配逻辑三方面任一出问题，方案就会显得不合逻辑
          - 缺少匹配过程会让架构看起来高大上，但是否真正解决问题并不清楚
    inputs:
      - 客户或业务方提出的目标、需求与现状问题描述
      - 同类方案的业界做法、参考资料与目标业务域知识
      - 自身已有的解决方案经验点与素材库
      - 实施资源、周期与成本方面的约束条件
    outputs:
      - 明确的问题定义与转化后的目标陈述
      - 子问题分解树及与之对应的论据和解决模块映射
      - 含总体设计、详细实现、实施方案的完整解决方案文档
      - 各模块与目标、子问题之间的匹配逻辑说明
    tags: [解决方案, 结构化呈现, 模式匹配, 金字塔原理, 售前]

  - id: 如何培养架构思维与大架构观
    sources:
      - raw/从架构思维到大架构观的培养.md
      - raw/技术人员如果跳出盒子实现思维和认知升级.md
      - raw/软件架构师应走出技术狂热误区锻炼核心全局思维能力.md
    define: 面对业务到IT实现的转化，如何以分解集成抽象复用等思维完成整体架构设计
    trigger: "技术人员或架构师面对一个业务域需求要给出整体技术方案时触发，典型状态是：认为自己\"会用 SpringCloud 就是微服务架构师、会 Hadoop 就是大数据架构师\"，搭了一个空框架却发现业务功能无法验证；或者长期脱离一线编码，设计的架构在开发侧落不了地、上线后在可靠性、性能、扩展性上出问题。也可能表现为沉迷追新框架、每两年把公司技术平台推翻重建一次。"
    goal: 建立业务驱动技术的整体架构观，能够同时交付功能性架构（子系统与模块划分、接口与集成模式、数据架构）和非功能性架构（可靠性、性能、高可用、高扩展）设计，把架构复杂性屏蔽在内部，给出当前业务场景下最合理、可落地且架构师自己能够实证的架构模型，而不是理想化或照搬来的现成模型。
    composition:
      - phase: 架构认知校准
        uses:
          - concept://架构思维
          - concept://业务驱动技术
          - entity://企业架构
        rule: 架构的核心作用是在业务现实世界和抽象的 IT 实现之间架起桥梁，因此架构思维的核心是业务驱动技术、技术最终为业务服务；会用某个技术框架绝不等于具备架构能力。
        key_points:
          - 架构思维是系统思维、结构化思维、编程思维等诸多思维模式的合集
          - 技术框架不是业务需求，实现在技术框架之上的业务功能组件才满足真实业务需求
          - 业务需求未最终实现前，技术框架无法充分验证，空框架搭建没有很高技术含量
          - 脱离业务的技术架构，架构师连自己都无法实证设计对现实业务的支撑能力
          - 架构设计要完成业务与技术、需求与实现、软硬件、静态与动态、成本与收益多方面的平衡
      - phase: 核心思维要素拆解
        uses:
          - concept://分解
          - concept://集成
          - concept://抽象
          - concept://复用
          - concept://分层
          - concept://动静结合分析
          - concept://迭代思维
        rule: 分解加集成是架构最核心的思考方式，分解要对复杂问题分而治之并保证高内聚松耦合，集成要能通过合适的接口设计把各部分重新集成为整体，分解后无法集成则分解毫无意义。
        key_points:
          - 分解的核心是定义问题，架构首先仍然需要把需求理解清楚
          - 动静结合，既有流程、用例等动态分析，又有数据、类等静态建模，两者高度协作
          - 复用包括业务能力组件化、组件能力服务化、平台加应用、共性能力下沉；分层核心是资源加服务加应用三大层，平台加应用是其变形
          - 抽象更重要的是把非类似场景的共性也总结出来，以更好地适应变更
          - 没有最优的架构只有不断进化的架构，应随业务需求迭代演化而非追求一步到位
      - phase: 业务到技术的映射建模
        uses:
          - concept://场景-技术映射
          - concept://概念模型搭建
          - concept://模式匹配
          - concept://结构化思维
          - entity://金字塔原理
        rule: 架构设计中的模式匹配是把最终的业务域问题匹配到对应的技术实现，必须根据业务需求来挑选最适合的技术，而不是用主流和最先进的技术去反推业务。
        key_points:
          - 先通过用例分析业务功能的可实现性与实现机制，再从用例中寻找核心对象并抽象为接口
          - 静态侧用概念模型、类关系图或数据库设计解决持久化与数据交互
          - 追求当下最合理的架构模型，而不是理想化模型或网上顺手搬来的现成架构
          - 架构最主要的产出是图，既用于引导实施者，也是架构师头脑中清晰的目标系统
          - 好的架构师必须既懂技术又懂业务，企业内部架构师更强调业务加技术的综合能力
      - phase: 功能与非功能的整体平衡
        uses:
          - concept://系统思维
          - concept://横切思维
          - concept://复杂度屏蔽
          - concept://黑盒思维
          - entity://资源-服务-应用三层
          - entity://SOA治理框架
        rule: 好的架构必须同时解决功能性架构和非功能性架构两方面问题；系统思维要求研究组件之间的关系和相互作用，追求整体的最优化而不是单个目标的最优。
        key_points:
          - 非功能性需求包括可靠性、性能、高可用性、高扩展性，需在搭建模型时就一并考虑
          - 要充分考虑到异常边界、并发峰值、安全攻击等场景，确保系统平稳高效运行
          - 任何架构的复杂性都应作为黑盒屏蔽在设计内部，通过粗粒度接口对外暴露
          - 最终开发人员只需按架构原则、标准规范和开发指南开发，不必关心内部复杂性
          - 横切思维在关键阶段点做拦截形成聚合点，实现统一管控与共性能力复用
      - phase: 跳出盒子与实践验证
        uses:
          - concept://跳出盒子
          - concept://不求甚解
          - concept://实证
          - entity://《架构之美》
        rule: 大架构观要求既深入细节又能跳出盒子的双重思维，既宏观全局又微观局部，既刨根究底又不求甚解，置身产品之中又能跳出产品做用户视角的思考。
        key_points:
          - 经验库积累路径只能是知识理论到实践、再到总结复盘、再到抽象，循序渐进反复迭代没有捷径
          - 见多才能识广，架构靠的是大量模式匹配库与经验库，而不单纯是创新和学习能力
          - 真正好的架构师来源于一线实践而非理论，长期脱离实践易犯经验主义错误
          - 架构是一个过程而非结果，是洞见内在结构、规律、原则和逻辑的过程
          - 不做技术狂热，不盲目追新框架，而要做好业务与技术适配、成本与收益分析
    inputs:
      - 业务场景、业务流程以及功能性与非功能性需求
      - 现有技术资产、组件库与可复用共性能力清单
      - 团队技能结构、交付周期与成本约束
      - 行业参考架构、标准规范与开源技术选型信息
    outputs:
      - 功能性架构模型（子系统与模块划分、接口与集成、数据架构）
      - 非功能性架构与技术选型方案（含业务适配与成本收益分析）
      - 架构标准规范、开发指南与架构原型验证结论
      - 屏蔽复杂性之后的粗粒度接口契约与开发约束
    tags: [架构思维, 系统设计, 业务驱动技术, 技术选型, 大架构观]

  - id: 如何培养系统思维能力
    sources:
      - raw/什么是系统思维个人应该如何培养系统思维能力从基本概念到案例分析.md
      - raw/如何提升自己的结构化思维和系统思维能力.md
    define: "面对多因素相互制约、多目标冲突的问题时，如何以元素-连接-目标三要素做整体思考"
    trigger: "用户面对类似\"餐馆该不该涨价、该涨多少\"\"是否该招新人、招几个\"\"公交车发车频率多少合适\"这类多因素相互制约、多个目标同时冲突的问题，靠直觉和经验给出的判断彼此打架，头脑风暴发散后反而抓不住核心逻辑；或者读了《第五项修炼》《系统思考》后陷在环形正负反馈回路的画法里不得要领，问\"系统思维到底是什么、应该怎么练\"。"
    goal: "用户能以元素-连接-目标三要素为框架做整体思考：由问题反溯出带空间和时间维度的目标，把系统分解为影响因子并画出因子间的正反作用与制约，再用动态模拟在多因素平衡下找到满意解而不是最优解，并通过复盘把单次问题的解决升级为对整个知识体系的系统学习。"
    composition:
      - phase: 建立系统三要素认知
        uses:
          - concept://系统思维
          - entity://《系统思考》
          - entity://彼得·圣吉
        rule: "先建立元素-连接-目标的整体观，但整体观必须落到可操作的方法上，不能停留在\"要有全局观\"的思维层面。"
        key_points:
          - 系统是多个部件或组件、多类活动、多个影响因子构成的整体，最大特点是因子间相互影响、相互制约、正反作用，在某个时间点达到动态平衡
          - 系统思维的本质仍是辩证逻辑，形式逻辑处理多因得一果，辩证逻辑处理元素之间的关联依赖与制约
          - 学习系统思维最容易陷入环形正负反馈回路的构建方法里，反而忽视了应用场景和思考模式
          - 系统思维里面自然会用到大量的逻辑思维和结构化思维
      - phase: 由问题反溯目标
        uses:
          - concept://目标反溯
          - concept://目标定位
          - entity://SMART原则
        rule: 问题本身不是系统，目标下隐藏的才是一个完整系统，因此先由问题反溯目标，并同时给出目标的空间性和时间性。
        key_points:
          - 问题是现实与期望之差距，期望即是目标，只有找到目标才能完整分析影响因子及其子影响因子
          - "只提\"利润最大化\"没有意义，必须加上时间维度：是当年利润最大化还是3年利润最大化"
          - 目标尽量符合SMART原则，简化为体现时间性（T）与空间性（S和M）
          - 真正的目标不是静态的，涨价只是决策不是目标，目标是增加时间维度后的动态发展目标
      - phase: 分解系统并分析要素关联
        uses:
          - concept://分解
          - concept://MECE
          - concept://要素关联分析
          - concept://流程分析
          - entity://金字塔原理
        rule: 先按MECE把大系统分解为子系统或影响因子，分解只是第一步，必须继续分析分解后要素之间的相互作用和影响。
        key_points:
          - 分解的重点是考虑清楚要达成目标究竟存在哪些因素，如价格、顾客生活指数、竞争对手、原材料成本、销售量
          - MECE原则最大的问题是没有谈分解后要素之间的关联和依赖关系，单独提升一个要素会对其它要素造成消极影响
          - 分解可以自顶向下，也可以头脑风暴后自下向上归纳整合，两种方式都可以
          - 对完全没接触过的事物更推荐用流程分析全面识别影响要素，动态流程分析是为静态分解服务的
      - phase: 动静结合与动态模拟
        uses:
          - concept://动静结合分析
          - concept://系统动力学建模
          - entity://因果循环图
          - entity://iThink
          - entity://系统动力学
        rule: 从静态思考走向动态思考，寻找的是多因素平衡下的满意解而非公式化最优解，涉及幅度的定量决策必须借助历史数据做计算机模拟。
        key_points:
          - 传统形式逻辑下求解标准公式得最优解，系统思维下是寻找多因素相互平衡下的满意解
          - 从静态到动态：1个月盈利最大化和1年盈利最大化得出的决策结论会出现明显差别
          - "简单二元决策用层次分析法等结构化方法即可，涉及\"涨多少\"这种幅度决策则必须模拟"
          - 直觉对多因素复杂系统往往是错的，只有把思维用模型固化下来才具备传递性和继承性
      - phase: 多目标权衡与满意决策
        uses:
          - concept://多目标决策转换
          - concept://结构化决策
          - concept://动态平衡
        rule: 多目标要么转化为单目标，要么拆成多个两两目标分析，再根据目标容忍度范围和子目标重要性选择最佳平衡方案。
        key_points:
          - 第一种方法是转多目标为单目标，把质量和资源成本投入约束为不可变目标
          - 第二种方法是保留多目标，将N维问题转换为多个二维问题逐一分析
          - 二维目标下不是唯一解，需要系统模拟得出多组可选择的解决方案后再决策
          - 最终方案是对多个子目标都存在变动范围下的最好平衡，即全局思考
      - phase: 由点到面的复盘迭代
        uses:
          - concept://从点到面学习
          - concept://深度复盘
          - concept://复盘
          - concept://修悟结合
        rule: 问题解决不是终点，解决后要复盘它涉及哪个知识体系并由点到面系统学习，且经验升级为方法论必须靠周期性深度复盘。
        key_points:
          - 实际工作中往往是问题驱动，但把问题解决并不是终点，问题是点上引发的而学习总结应由点到面
          - 浅复盘只完成知识到经验的转化，经验到方法论和模式的升级必须靠周期性深度复盘
          - 人们不可能通过思考养成一种实践习惯，只能通过实践学会一种新的思考方式
          - 知识和经验体系不是简单堆积，而是不断将知识抽象为经验、将经验抽象为方法论和模式
    inputs:
      - 一个多因素相互制约、多目标冲突的现实决策问题
      - 该问题涉及的业务或系统的历史运行数据
      - 已有的头脑风暴或各方意见
    outputs:
      - 带空间和时间维度的明确目标
      - 系统影响因子清单及因子间正反作用的因果循环图
      - 多因素动态模拟后的满意决策方案
      - 由该问题牵引的某领域系统学习计划
    tags: [系统思维, 动态平衡, 多目标决策, 结构化思维, 复盘迭代]

  - id: 如何定义融入个人经验的AI提示语与技能
    sources:
      - raw/AI时代个体思维能力进化知识显性化表达和输出能力.md
    define: 提示语已从需求定义升级为经验萃取时，如何写出含规则约束与最佳实践的提示语
    trigger: 用户发现用同样的AI工具、写同样的一段需求描述，产出的质量远不如别人；尤其在Claude推出Claude Skills之后，提示语已经从需求问题定义升级为个人知识经验的显性化萃取，用户想知道一个好的提示语或Skills到底应该包含哪些内容、自己的价值体现在哪。
    goal: "用户能把提示语从单一段的需求问题定义扩展为\"需求问题+规则约束+最佳实践\"三段式，写出融入个人经验与最佳实践的操作手册（类似Claude.md、Claude Skills），让AI按自己的既定轨道运行，产出他人无法复现的差异化结果。"
    composition:
      - phase: 重新定位提示语
        uses:
          - concept://问题定义
          - concept://知识转技能
          - entity://Claude Skills
        rule: 提示语的逻辑已从简单的需求问题定义提升到个人知识经验的显性化萃取，技能 = 问题定义 + 个人知识经验描述。
        key_points:
          - Claude推出Claude Skills概念后，整个提示语的逻辑从需求问题定义提升到了个人知识经验的显性化萃取
          - 技能 = 问题定义 + 个人知识经验描述
          - 知识可以解决通用场景问题，但是只有知识+技能才能够更好地解决特定场景下的业务问题
          - Skills实际是隐性经验的集大成者
      - phase: 写清需求问题
        uses:
          - concept://问题定义
          - concept://场景约束结合
        rule: 第一段给出详细的问题定义，包括背景和场景说明，是掌握需求定义描述方法后大家都能做的部分。
        key_points:
          - 需求问题要求详细的问题定义，包括背景、场景说明
          - 这部分大家在掌握了一定的需求定义描述方法后都可以做
          - 场景说明决定了后续规则和最佳实践的适用边界
          - 真正体现个人价值的是后面的规则约束和最佳实践
      - phase: 补充规则约束
        uses:
          - concept://共性模板化
          - concept://场景约束结合
          - entity://Claude.md
        rule: 第二段给出规范标准约束、做事步骤约束、分解方法约束，等于给AI一份更准确的操作手册让它按既定轨道运行。
        key_points:
          - 规则约束包括规范标准约束、做事步骤约束、分解方法约束
          - 方法、工具、技术、知识这些经验都需要提前定义好，给AI一个更加准确的操作手册
          - 同样需求下AI输出代码质量的好坏，往往就在于个人对Claude.md文件的定义上面
          - 目的是让AI按你的既定轨道运行，而不是自由发挥
      - phase: 注入最佳实践
        uses:
          - concept://经验模式库
          - concept://模式匹配
          - concept://经验存量
        rule: 第三段提供历史个人案例参考、模板库、样例库，这是将历史经验显性化变现、别人无法复制的核心价值所在。
        key_points:
          - 最佳实践包括历史个人案例参考、模板库、样例库
          - 来源于我提供的历史参考样例代码，这个才是真正的核心价值
          - 这是将你的历史经验显性化变现
          - 没有个人经验最佳实践的输入，AI得出的是和所有人一样的道理
      - phase: 验证差异化价值
        uses:
          - concept://独立思考
          - entity://Google Nano Banana
          - entity://Google DeepResearch
        rule: 先用小样例跑通再逐步扩量，同时自问这套做法别人是否也能照做，能照做的部分并不构成自己的竞争力。
        key_points:
          - 对不熟悉的知识领域，可先让AI做深度研究输出报告，再让大模型归纳成体现内在逻辑结构的文章，最后投喂给绘图工具
          - 这个变通做法他人同样可以照做并输出同样结果，关键问题在于你的价值究竟在哪里
          - 真正的价值是基于大量历史文章归纳出的、体现个人经验逻辑的输出，他人没法输出
          - AI绝对不会淘汰一个真正独立思考的人，不要想着用AI偷懒、让AI代替自己思考
    inputs:
      - 一个具体的AI任务需求及其背景场景
      - 个人在该领域的历史案例、模板与样例
      - 该领域做事的规范、标准与步骤约束
    outputs:
      - 需求问题+规则约束+最佳实践三段式提示语
      - 融入个人经验的可复用Claude.md或Claude Skills
      - AI按既定轨道产出的差异化结果
    tags: [提示语工程, 知识显性化, Claude Skills, 最佳实践, AI竞争力]

  - id: 如何实现思维逻辑自洽
    sources:
      - raw/深度思考的一个关键完成思维逻辑的自洽.md
    define: 深度思考时如何让结论在因果、关系、过程三个层面都能自圆其说
    trigger: "用户做深度思考时得出了一个结论，却说不清原因能否支撑这个结论；或者单独讲每个知识点都很熟，一旦把两个知识点关联起来追问就答不上来；又或者素材现成、结论也对，别人一问\"你是怎么一步步推出来的\"自己却描述不清楚。"
    goal: 用户能让自己输出的结论在因果、关系、过程三个层面都自圆其说：归纳样本充分且演绎前提能支撑结论、多个知识点之间的关联关系说得清、从素材到结论的推导路径能一步步复述，从而形成完整的深度思考过程。
    composition:
      - phase: 确立自洽的三个层面
        uses:
          - concept://逻辑自洽
          - concept://逻辑思维
        rule: 深度思考的关键在于完成思维逻辑的自洽，必须同时实现因果的自洽、关系的自洽、过程逻辑的自洽。
        key_points:
          - 闭环这个词用得太多，这里用自洽，即结论要能自圆其说
          - 思维的逻辑包含结构化的逻辑、归纳演绎逻辑、匹配逻辑三个关键方面
          - 只有实现因果、关系、过程三种自洽，才能够形成一个完整的深度思考过程
          - 不能自洽意味着思考的逻辑存在断点和缺陷
      - phase: 因果自洽
        uses:
          - concept://三段论推理
          - concept://归纳
          - concept://样本充分性
        rule: 检查归纳所依据的样本是否充分、演绎的大前提小前提能否支撑结论，且不能由结论去反推前提。
        key_points:
          - "观察诸多现象抽象归纳出的结论本身是否正确，样本不足会归纳出错误结论，如\"所有动物都有四条腿\""
          - 有大前提小前提才能得出结论，反过来由结论反推前提不成立，如有两只眼睛的不一定是人
          - "多个项目性能问题都靠数据库调优解决，就归纳出\"所有性能问题都靠数据库调优\"，是样本不足的归纳错误"
          - 性能问题也可能是代码逻辑本身有问题、代码没注意资源释放导致的
      - phase: 关系自洽
        uses:
          - concept://知识关联
          - concept://结构化思维
          - entity://金字塔原理
        rule: 结构化思维中事物和事物之间的关系必须自洽，两个知识点单独都熟悉不等于它们之间的关系说得清。
        key_points:
          - 结构化思维里谈MECE法则、谈金字塔原理、谈事物的组成结构，衍生出关系的自洽
          - 单独问微服务架构知识很熟悉，单独问电商项目也很熟悉，问到电商项目里如何用微服务做拆解却回答不清
          - 这是最终输出的内容、呈现的成果在多个知识点关系上没办法实现完整自洽
          - 检验的办法就是把两个知识点强行做关联来提问
      - phase: 过程自洽
        uses:
          - concept://演绎
          - concept://过程逻辑
          - concept://模式匹配
        rule: 必须能一步步复述从素材到结论的推导路径，描述不清过程就说明思考逻辑存在断点。
        key_points:
          - 很多人手上有大量素材和论据、结论也对，但描述不清怎样一步步推导出这个结论
          - 典型例子是过程模型图里各组件之间究竟什么关系、上游活动的输出如何转为下游活动的输入没说清
          - 过程不能自洽，间接说明你在思考过程中思考的逻辑存在断点和缺陷
          - 模式匹配逻辑里面很关键的一个自洽就是过程的自洽
    inputs:
      - 一个已得出的结论或主张
      - 支撑该结论的素材、现象与论据
      - 结论涉及到的多个知识点及其关联
    outputs:
      - 前提与样本经过检验的因果链
      - 知识点之间关系清晰的关联说明
      - 可逐步复述的完整推导过程
      - 在三个层面均自洽的深度思考结论
    tags: [逻辑自洽, 深度思考, 归纳演绎, 关系关联, 过程推导]

  - id: 如何将隐性经验显性化并结构化输出
    sources:
      - raw/AI时代个体思维能力进化知识显性化表达和输出能力.md
      - raw/关于思维的七个观点供大家参考.md
    define: 工作多年却无写作记录习惯时，如何通过显性化和结构化让隐性经验可被AI放大
    trigger: "用户工作多年却没有写博客、记日志的习惯，所有经验都是隐性的；用着和别人一样的AI工具（如Google Nano Banana、DeepResearch），却画不出别人那种有内在逻辑的成果，或者想让AI放大自己的经验却拿不出可投喂的结构化素材，于是问\"我的经验该怎么沉淀和表达出来\"。"
    goal: 用户能把积累多年的隐性经验通过持续写作显性化，产出具备静态结构逻辑、动态流程逻辑与组件关系逻辑的结构化内容，并能用最简洁的方式陈述清楚、按受众去我化地呈现，最终形成可被AI放大、他人无法复制的个人经验模式库。
    composition:
      - phase: 认清显性化是AI时代的竞争力
        uses:
          - concept://知识显性化
          - concept://知识显隐转化
          - entity://大模型
        rule: AI时代个人思维能力的竞争不是AI工具的竞争，而是把个人知识经验显性化表达的能力之争。
        key_points:
          - 大家都在用AI大模型，如果没有自己的经验作为输入，AI得出的都是同样的道理，你相对他人没有竞争力
          - 隐性经验没有通过写作显性化和结构化整理，更谈不上抽象化为个人知识体系
          - 由于历史经验没法显性化，自然很难通过AI把隐性知识显性化放大
          - 工具的提示词规范和操作步骤人人可复制，只有融入个人经验的输出别人无法复制
      - phase: 从记录输出开始动手
        uses:
          - concept://输出倒逼输入
          - concept://知识萃取
          - concept://实践反刍
        rule: 原来没有记录输出习惯的，第一步就是先把历史经验显性化输出和表达出来，不等想清楚再写，也不能认为规范里都有就没得可写。
        key_points:
          - 如果没有记录输出的习惯，首先去将历史经验显性化输出和表达出来
          - 如果觉得没什么可表达、公司规范流程里都定义了，那到AI时代同样没有任何竞争力
          - 工作经验不是单纯的时间积累，工作5年后经验含金量往往下降，差异在于对已有知识点的串联能力
          - 真正适合的经验和最佳实践一定是自己经过大量底层事务性工作后磨练总结出来的，是自己亲身证悟的
      - phase: 结构化整理素材
        uses:
          - concept://知识结构化
          - concept://结构化分析
          - concept://结构化呈现
        rule: 输出内容必须体现静态结构逻辑、动态流程逻辑和组件关系逻辑，素材本身凌乱则AI输出必然凌乱。
        key_points:
          - 素材若没有基本的结构化逻辑（静态结构逻辑+动态流程逻辑+组件关系逻辑），AI输出的信息图同样凌乱
          - 投喂给AI的文章素材质量决定了AI最终的呈现质量
          - 知识演进分为资料库、知识库、经验库、模式库四个层级，最难也最有价值的是模式库
          - 持续优化不是知识堆积，而是不断将知识抽象为经验、将经验抽象为方法论和模式
      - phase: 抽象为概念模型与最简陈述
        uses:
          - concept://概念模型搭建
          - concept://自我最简陈述
          - concept://抽象
        rule: 一个道理越能用最简单的方式陈述清楚，越说明你深入实践过并了解细节，也越清楚不同层级受众的真实需求。
        key_points:
          - 越是能用最简单方式陈述清楚，越是说明深入实践过并了解细节
          - 写出来的东西别人看不懂，极可能是自己脱离一线实践太久，无法把内容写详细写易懂
          - 真正适合自己的经验和最佳实践是自己亲身证悟的，不是从书本理论拼凑出来的
          - 可以从学生到教授，但必须是从工匠到大师或专家
      - phase: 去我化的呈现与表达
        uses:
          - concept://去我化呈现
          - concept://呈现和泛化
          - concept://模仿超越
        rule: 学习摄入是以自我为中心的，但到输出呈现阶段必须去我化，关注受众真正关心什么、受众的知识结构是什么。
        key_points:
          - 输出阶段一定不能沉浸在自己的世界里面而忘记了观众
          - 练习同一解决方案在1小时、30分钟、10分钟乃至5分钟内如何都讲完并抓住关键内容
          - 面对开发人员、面对客户业务人员、面对领导，同一个方案的讲法不同
          - 任何超越往往从模仿他人开始，先形似再取其精华去其糟粕，最终形成适合自己的方法论体系
      - phase: 沉淀为个人模式库
        uses:
          - concept://经验模式库
          - concept://知识串联
          - concept://融会贯通
          - concept://深度复盘
        rule: 通过周期性深度复盘把做过的一系列事情放到一起抽象共性，形成可复用的模式匹配能力，而不是停留在单个项目的浅复盘。
        key_points:
          - 浅复盘只完成知识到经验的转化，经验到方法论和模式的升级必须靠周期性深度复盘
          - 对已有知识点的串接、扩展和融会贯通能力是学无止境的，离不开不脱离一线的实践
          - 模式库就是最核心的模式匹配能力积累，就是你最核心的底层逻辑
          - 不要在精力旺盛期过早陷入平衡的陷阱，任何成功都来源于长期坚持和专注
    inputs:
      - 个人多年积累但未记录的隐性工作经验
      - 历史文章、项目总结、复盘记录等零散素材
      - 目标受众的知识结构与关注点
    outputs:
      - 显性化且具备三类结构化逻辑的文章或知识素材
      - 可用最简方式陈述的个人概念模型
      - 面向不同受众的差异化呈现版本
      - 可被AI放大复用的个人经验模式库
    tags: [知识显性化, 结构化输出, AI时代竞争力, 经验沉淀, 去我化呈现]

  - id: 如何平衡知识广度与深度构建核心竞争力
    sources:
      - raw/思维和认知能力退化AI时代跨领域知识广度远比专业深度更加重要.md
      - raw/知识和智能时代个人核心竞争力深刻理解知识广度和深度之间的辩证逻辑关系.md
      - raw/职场年过四十被裁员无法破的学习曲线可以破的成长定律.md
    define: AI时代如何按阶段在广度与深度间切换以形成不可替代性
    trigger: "在 AI 与知识时代感到\"记忆力越来越不值钱、专业深度越往上越难突破\"时触发；或者职业发展进入瓶颈期、面临被裁员风险，纠结是该继续深耕专业深度还是转向跨领域的知识广度，不知道自己当前阶段的时间与精力应该投在哪一头。也包括工作多年后发现自己只是吃经验老本、真正的经验存量并没有增长的情形。"
    goal: 明确自己当前阶段在沙堆底面积（知识广度）与沙堆高度（知识深度）上的投入配比与切换条件，形成以深度为价值锚点、以广度为支撑的阶段性策略，持续积累能够创造价值的经验存量并提升效率增量，最终构建出差异化、不可替代的个人核心竞争力。
    composition:
      - phase: 沙堆模型认知
        uses:
          - concept://知识广度
          - concept://知识深度
          - concept://学习曲线
          - entity://沙堆理论
        rule: 用沙堆类比知识结构，底面积代表知识覆盖范围，高度代表专业领域的精通程度；深度决定价值上限，广度决定发展潜力，两者必须动态迭代配合才能构建稳固高耸的知识沙堆。
        key_points:
          - 沙堆高度存在极限，到达一定高度后再想增高必须先扩展底面积
          - 只有广度没有深度，知识就是一盘散沙，无法形成竞争力
          - 掌握通用学习方法后半年到一年可达到 60 至 70 分，但 90 分以上所需时间呈指数级增长
          - 从 70 分到 100 分的提升需要更深入的理论学习、实践探索、实验验证与经验积累
          - 知识深度、知识广度以及达到该深度广度所需时间构成知识的核心三个维度
      - phase: 阶段定位与策略选择
        uses:
          - concept://广度深度阶段策略
          - concept://回溯广度
          - concept://价值锚点
          - entity://T型人才
        rule: 不同发展阶段重点不同，学习阶段广度优先，职业初期深度优先，瓶颈期回溯广度，成熟期广度与深度深度融合；始终把知识深度创造价值、广度服务于深度作为价值锚点。
        key_points:
          - 职业前两三年专注专业技能提升，通过大量项目实践固化核心技能
          - 瓶颈期的触发条件是专业发展停滞不前或需要跨领域协作
          - 积累阶段要避免频繁换岗或追逐新技术，否则基本功不扎实
          - 用问题驱动学习的方式拓展广度，借助已有经验触类旁通找到新突破口
          - 细分领域如海量并发架构、高精度算法的极限突破更易形成不可替代性
      - phase: 经验存量与效率增量经营
        uses:
          - concept://经验存量
          - concept://升维思考
          - concept://差异化竞争
          - entity://成长第一定律
          - entity://成长第二定律
        rule: 真正提升自我价值的是经验存量与效率增量两个指标；中年后精力与学习力下降，必须以生产率换时间，不能用相同的方法和工具去和年轻人竞争。
        key_points:
          - 经验存量不是简单的工作时长，而是能够创造价值的经验库
          - 大存量让你在很小的速度和生产率下也能获取足够大的增量
          - 提升生产率的核心是升维思考、降维打击，而不是比拼时间投入与加班
          - 没有速度加持的存量是没有意义的，效率增量是盘活存量的唯一方式
          - 大存量还能在高生产率的同时保证产出质量，实现真正的高效
      - phase: 知识索引化与跨域串联
        uses:
          - concept://知识索引
          - concept://知识串联
          - concept://跨领域迁移
          - entity://知识竞争力公式
          - entity://大模型
        rule: AI 时代竞争力从记忆知识、贩卖经验转向理解和应用知识，应减少记忆、增加知识链接，只需掌握知识的前后置索引与关键接口，让 AI 去完善底层细节。
        key_points:
          - 真正值钱的是知道在什么场景下应该用什么方法和技术来解决问题
          - 知识竞争力等于深度（垂直积累）乘以广度（跨域连接）再乘以时间（持续精进）
          - 借助 AI 按个人知识现状生成针对性的渐进式学习计划，加速新领域拓展
          - 知识与知识之间的串接是粗粒度的，知道前后置索引就能整合为完整输出
          - 死记硬背没有价值，实践后形成的抽象知识索引和场景应用模式才具备核心竞争力
      - phase: 误区规避与长期迭代
        uses:
          - concept://长期主义
          - concept://负熵
          - concept://质变突破
          - entity://PDCA
        rule: 要规避两类典型误区，只重广度成为门门通样样松的杂家，或只重深度导致知识结构脆弱；同时要保持负熵，主动脱离舒适区做长期坚持的事情。
        key_points:
          - 只关注技术架构而忽视业务需求、用户体验、团队协作的架构师，其架构往往存在缺陷
          - 人都偏向适应熵增定律朝混乱无序发展，负熵就是主动找不自在的事长期坚持做
          - 工作十年二十年的真正有价值经验可能与工作五年的人差不多，不学习即为退步
          - 知识体系需要周期性重构，通过阅读、培训、实践持续更新知识结构
          - 真正的成长发生在学习、实践、复盘的持续迭代闭环中，没有捷径可走
    inputs:
      - 所在行业与岗位的能力要求同自身能力的差距评估
      - 现有知识结构与经验存量的盘点（哪些能够真正转化为价值）
      - 个人长期职业定位与短期目标（需体现时间性与空间性）
      - AI 工具可提供的知识获取、串联与学习计划手段
    outputs:
      - 当前阶段广度与深度的投入配比及其切换触发条件
      - 面向目标的知识树主干与阶段性学习路径
      - 经验存量积累与效率增量提升的行动方案
      - 可复用的知识索引与场景到方法的映射清单
    tags: [知识广度与深度, 核心竞争力, 职业发展, AI时代, 学习成长]

  - id: 如何构建个人思维框架与认知体系
    sources:
      - raw/基于思维框架逻辑来构建思维能力体系并应用到实践.md
      - raw/如何高效和系统化的构建个人思维和认知体系.md
      - raw/对思维框架和内在逻辑的完整梳理和认识.md
      - raw/思维框架和模型全面提升个人认知水平和分析解决问题的能力.md
      - raw/所有的思维均来源于我们对世界和自我的认知对思维框架逻辑构建的哲学思考.md
      - raw/技术人员如果跳出盒子实现思维和认知升级.md
      - raw/普通人理解和认知事物的底层逻辑完整版本.md
      - raw/构建你的多维思考力从事物认知到问题解决.md
      - raw/碎片化时代从体系思维到系统化知识体系构建之路.md
    define: 如何围绕事物认知与问题解决两条主线搭建个人思维认知体系
    trigger: "用户发现自己遇到问题只会凭已有经验套答案，思维能力长期停留在结构化思维、系统思维层面难以再上台阶，或者读过大量思维类书籍后觉得道理都对却指导不了实践，于是提出类似\"如何建立自己的思维框架\"\"思维和认知能力究竟该怎么系统提升\"的问题。"
    goal: 得到一套以事物认知与问题解决为双主线、以归纳演绎与模式匹配为逻辑内核、以学习实践复盘为闭环的个人思维能力体系：能够先判断面对的是认知类还是问题解决类场景再选择对应框架，把零散的思维方法归位到元模型中，并结合自己的专业领域形成可落地、可迭代的思维能力应用体系。
    composition:
      - phase: 思维能力的定位与元模型确立
        uses:
          - concept://思维双主线
          - concept://思维框架体系
          - entity://思维钻石模型
          - concept://思维构成公式
        rule: 先把思维定义为信息输入、大脑加工、价值输出的加工过程，明确思维能力是独立于知识储备与先天智力、可后天习得的技能；从事物认知与问题解决两条主线切入建立元模型，而不是零散收集各种思维技巧。
        key_points:
          - 思维的核心框架是事物认知与问题解决两条主线
          - 事物认知解决是什么的问题，问题解决解决如何做的问题
          - 知识是思维的原材料，思维能力是可后天习得的技能
          - 思维不能停留在意识和心理学层面，必须能指导实践
          - 从已有思维方法中抽象元模型是归纳过程，用元模型构建能力体系是演绎过程
      - phase: 思维框架核心组件的拆解
        uses:
          - concept://静态结构分析
          - concept://动静结合分析
          - concept://流程分析
          - concept://MECE
          - concept://分类
        rule: 对事物的完整认知必须静态结构与动态过程两个维度结合：静态分解遵循相互独立、完全穷尽且同层级同粒度，动态分析梳理流程与状态转换，最终回答底层组件如何协同产生外在行为。
        key_points:
          - 静态分析的核心是分解，分解后各部分相互独立、完全穷尽
          - 同一层级的分解内容应处于相同的粒度和维度
          - 动态分析包括行为分析即黑盒输入输出，与过程分析即内部协同机制
          - 分类与抽象是从事物群走向类对象的关键
          - 动静结合才能洞悉事物的内在本质而不只是表面现象
      - phase: 归纳演绎与模式匹配的逻辑内核
        uses:
          - concept://归纳演绎循环
          - concept://模式匹配
          - concept://三段论推理
          - concept://复杂匹配
          - concept://问题分解
        rule: 事物认知靠归纳演绎推动，问题解决靠模式匹配推动；问题分解得越细粒度越容易完成匹配，逐层匹配后再向上聚合形成完整方案。
        key_points:
          - 归纳是从具体到一般，演绎是从一般到具体
          - 演绎的典型形式是明确大前提、小前提、结论的三段论
          - 简单匹配是一对一直接对应，复杂匹配需先分解再逐层匹配后聚合
          - 模式匹配能力往往决定一个人问题解决能力的高低
          - 提升匹配能力要同时抓问题的有效分解和细粒度可复用经验点
      - phase: 学习实践复盘的闭环搭建
        uses:
          - concept://复盘
          - concept://实践反刍
          - concept://模式提炼
          - entity://PDCA
          - entity://倒金字塔转化模型
        rule: 学习成果进知识库、实践提取进经验库，通过复盘完成知识库向经验模式库的转化，形成学习、实践、复盘三者缺一不可的持续改进闭环。
        key_points:
          - 没有学习实践缺乏指导，没有实践学习无法验证，没有复盘经验无法沉淀
          - 理论指导实践，但更重要的是实践反刍理论
          - 知识库层、技能层、经验层三层递进，知识经实践转技能、技能经复盘转经验
          - 经验要细粒度化为可复用的经验点，大而全的框架反而不易用
          - 真正的能力提升体现在现实世界的实践上，而不是理论堆砌或POC验证
      - phase: 思维能力体系的应用与评估
        uses:
          - concept://深度复盘
          - concept://事物群分析
          - concept://演绎
          - concept://量化自我评估
          - entity://思维闭环系统
        rule: 面对新事物先判断属于认知类还是问题解决类场景再调用对应框架；周期性对同类事物做深度复盘，用抽象出的普遍规律演绎解决未见过的问题，并定期从认知深度、分析速度、解决效果、迁移能力做自我评估。
        key_points:
          - 先分析面对的是哪类思维场景，再决定用认知类还是问题解决类框架逻辑
          - 单个事物的研究是问题驱动的，事物群的研究是自我驱动的
          - 对一类事物的周期性复盘才是深度复盘，并由此完成从特殊到一般的抽象
          - 问题本身也是事物，问题群分析与事物群分析方法一致
          - 克服认知障碍、打破舒适区，有意识地跳出原有框架才能突破能力天花板
    inputs:
      - 个人当前零散使用的思维方法与专业领域实践经验
      - 一个待认知的新事物或待解决的具体问题
      - 已有的个人知识库与经验模式库
      - 需要突破的思维障碍与能力短板清单
    outputs:
      - 以双主线加逻辑要素加闭环构成的个人思维能力体系框架
      - 面向认知类与问题解决类场景的思维实践应用流程
      - 入库的细粒度可复用经验点与更新后的经验模式库
      - 思维能力多维度自我评估结果与持续迭代计划
    tags: [思维框架, 认知体系, 归纳演绎, 模式匹配, 学习实践复盘]

  - id: 如何构建个人知识体系
    sources:
      - raw/从信息焦虑到智慧从容构建个人知识管理体系从学习到实践.md
      - raw/如何构建完整的个人知识体系以下五个关键点供你参考.md
      - raw/思维框架和知识体系构建知识组件并实现知识快速组装.md
      - raw/思维系列从个人知识体系构建到知识网络图谱的构建.md
      - raw/碎片化工作和时间如何构建体系化知识库提升系统思维.md
      - raw/碎片化时代从体系思维到系统化知识体系构建之路.md
    define: 面对离散知识与真实工作问题时，如何搭建可检索、可复用的知识体系
    trigger: "用户收藏了大量文章资料、笔记散落在多个工具里，遇到新问题时明明学过却找不到也想不起来，知识点之间孤立连不成网，越学越焦虑，于是提出类似\"如何搭建个人知识体系\"\"个人知识管理到底该怎么做、用什么工具\"的问题。"
    goal: 得到一张覆盖目标领域、可检索可复用的个人知识网：先有以业界参考模型为树干的知识地图和由差距推导出的学习路径，再按资料库、知识库、经验库、模式库分层沉淀，并能在面对新场景时通过场景分解、知识组件匹配、快速组装三步直接调用，而不是每次从零开始。
    composition:
      - phase: 目标定位与知识地图
        uses:
          - concept://目标驱动知识管理
          - concept://知识地图
          - concept://信息焦虑
          - concept://知识索引
          - concept://学习路径
        rule: 知识管理本身只是方法和工具而非最终成果，必须先明确目标与定位；先有地图再谈收集，否则收藏、摘抄、下载只会加重信息焦虑而非形成体系。
        key_points:
          - 先回答为什么要建立，而不是一开始就忙着收集
          - 没有地图就不知道自己当前在什么位置、目标在哪里、缺哪些环节
          - 要记忆的不是具体问题的答案，而是知识索引
          - 知识索引等于知道挂在哪个知识域加上知道文档笔记放在哪里能搜到
          - 目标不清楚，后面的分类、整理、归档都会退化成机械劳动
      - phase: 知识树主干与概念结构逻辑三层
        uses:
          - concept://知识树
          - concept://知识三层模型
          - concept://概念模型搭建
          - entity://PMBOK
          - entity://CMMI
        rule: 先参考业界标准参考模型把领域最基本的树干结构立起来再补树叶外延；每个知识点都要落到概念模型、静态结构与动态结构、以及归纳演绎辩证的底层逻辑三层才算打通。
        key_points:
          - 供应链有SCOR、项目管理有PMBOK、软件工程有CMMI，先学标准参考模型
          - 概念模型回答是什么，结构模型回答由什么组成和如何随时间变化
          - 静态结构基于空间研究组成关系，动态结构基于时间研究发展变化
          - 分解、集成、抽象、聚合等逻辑方法归一到归纳、演绎、辩证三大基础逻辑
          - 分析问题时从上到下分解，解决问题时从下到上演绎
      - phase: 从知识树到知识网络
        uses:
          - concept://知识网络构建
          - concept://双维度知识矩阵
          - concept://依赖关系排序
          - concept://知识关联
          - concept://动态学习链
        rule: 思维导图是单维度逐层展开，多维度知识体系要用矩阵或流程表达，把知识的组成、层级关系、前后依赖、映射关系和流程节点补出来，树才真正连成网。
        key_points:
          - 知识结构包括知识的组成、知识的层级关系和知识点间的前后依赖
          - 分类的过程就是思考的过程，通过分类形成完整的知识体系结构
          - 当前工作做不下去往往是前导知识缺失，任务做完就停止思考会失去外延机会
          - 流程分为阶段、子流程和活动，知识点附着在节点上并说明输入输出与模板
          - 跨学科跨领域的关联与映射能力决定树能否连成网
      - phase: 分层沉淀与知识组件组装
        uses:
          - concept://知识四层演进
          - concept://知识组件
          - concept://知识组件组装
          - concept://知识显性化
          - entity://ima知识库
        rule: 保存不要一锅炖，按资料库、知识库、经验库、模式库分层演进；沉淀出同时包含概念、结构、逻辑的知识组件后，用场景分解、组件匹配、快速组装三步应对千变万化的业务场景。
        key_points:
          - 资料库是收集泛读，知识库是主题学习归类，经验库是实践复盘，模式库是体系化抽象
          - 理论到理论价值有限，知识必须经实践验证和复盘才算扎实
          - 任何一个知识组件都应同时包含概念、结构和逻辑，而不是静态资料
          - 业务场景千变万化，但底层可复用的业务、技术、过程管理知识块可以穷举
          - 写作是让隐性经验显性化、让零散知识体系化的最高效手段
      - phase: 检索复用与持续演进
        uses:
          - concept://模式匹配
          - concept://复用
          - concept://知识萃取
          - concept://碎片化时间利用
          - entity://Obsidian
        rule: 检验标准是新问题出现时能否快速定位、快速检索、快速组装；碎片化时间只适合泛读与碎片信息获取，体系化整理必须用完整大块时间，AI 只是加速器而不是个人积累的替代品。
        key_points:
          - 目录分层要稳定，主题标签要克制，关键文档要能全文搜索
          - 每次项目结束、每次专题学习结束都要做一次复盘归档
          - 没有模式库就会停留在懂了很多道理的层面，有了才具备模式匹配能力
          - 先为学日益完成知识广度积累，再为道日损浓缩为经验模式与知识索引
          - AI 可辅助完成提炼、搜索与图谱化，但底层仍然是个人长期积累
    inputs:
      - 当前岗位或专业方向的学习目标与能力差距清单
      - 散落在笔记、文档、收藏夹中的资料与知识点
      - 该领域可用的业界标准参考模型与经典书籍
      - 真实工作中待解决的问题与项目实践记录
    outputs:
      - 以参考模型为树干、含层级依赖与映射关系的知识地图
      - 按资料库、知识库、经验库、模式库分层的个人知识库结构与归档规范
      - 可复用的知识组件集合与场景分解、匹配、组装流程
      - 面向目标差距的分阶段学习路径与知识索引检索体系
    tags: [知识体系, 知识管理, 知识网络, 知识组件, 学习实践复盘]

  - id: 如何用模式匹配解决未知问题
    sources:
      - raw/思维究竟是什么思维的逻辑和模式匹配.md
      - raw/突破认知障碍构建认知提升闭环系统.md
    define: 面对陌生问题，如何通过问题转化与细粒度匹配调用已有知识经验求得解法
    trigger: 遇到从未处理过的陌生问题或跨入一个全新领域、脑子一片空白不知从何下手时触发；或者明知自己学过相关的公式、算法和经验点，却不知道在什么场景下应该调用哪一个，只能陷入题海战术比谁见过的题型多；也包括借助 AI 得到答案后，仍然没有学会分析和解决问题方法的情况。
    goal: 能够把未知问题转化为已知问题、把粗粒度问题分解为可在细粒度上匹配的子问题，逐条调用经验模式库中的解法后再聚合为完整方案并实证验证；同时把本次新经验细粒度化后回灌经验库，形成越用越强的模式匹配与跨领域迁移能力。
    composition:
      - phase: 问题定义与场景锚定
        uses:
          - concept://问题定义
          - concept://信息场景依赖
          - entity://5W1H
          - entity://问题四分类
        rule: 信息输入不能脱离场景，脱离场景的输入往往只是没有价值的数据；先用 5W1H 完成问题定义与降噪，之后才谈得上加工和模式匹配。
        key_points:
          - 问题即期望值与实际值之间的差距，先把这个差距界定清楚
          - 系统宕机如果没有具体场景，很难分析具体问题点在哪里
          - 问题产生无外乎两类原因，输入的某个 X 出错或加工中某个步骤出错
          - 先判断属于 What、How、Which、Where 哪一类，再决定走认知还是解决路线
          - 大脑处理的第一步就是定义和降噪，然后才是加工与模式匹配
      - phase: 未知到已知的问题转化
        uses:
          - concept://问题转化
          - concept://目标定位
          - concept://举一反三
          - concept://跨领域迁移
          - entity://回溯算法
        rule: 面对新问题首先考虑能否归类到一个已经熟悉的已知问题类型，转化成功是解决问题的关键；如果无法转化或映射，知道再多的算法和公式也没有用。
        key_points:
          - 小学应用题的本质是设置参数后转化为方程式求解
          - 八皇后问题转化为回溯算法，背包问题转化为动态规划问题
          - 智慧校园虽陌生，但提出问题、总体设计、详细实现的 IT 方案框架是通用的
          - 做 CRM 的经验可迁移，只需把校园业务知识填充到已有大框架中
          - 业界做法加已有知识经验等于达成目标的完整框架逻辑
      - phase: 分解与细粒度匹配
        uses:
          - concept://问题分解
          - concept://模式匹配
          - concept://复杂匹配
          - concept://分解
          - entity://逻辑树
        rule: 粒度越粗越难匹配，完全一模一样的问题出现概率极小；必须先把问题分解为细粒度子问题与经验点一一匹配，最后再整合为完整解法。
        key_points:
          - 任何四则运算题都可分解为加减乘除，经验库只需掌握四种基本操作
          - 简单匹配是一对一的直接对应，复杂匹配是分解后细粒度匹配再向上聚合
          - 分解、组合、排序、聚合、抽象、重组等加工活动都是为后续模式匹配服务
          - 静态维度的加工包括分类、分组、维度属性、矩阵、树和层级、关联关系
          - 动态维度的加工包括阶段、流程、活动、事件、消息
      - phase: 方案整合与实证验证
        uses:
          - concept://集成
          - concept://假设验证
          - concept://实证
          - concept://最小目标验证
          - entity://PDCA
        rule: 匹配完成后要向上聚合形成完整解决方案并在实践中验证；一个人真正的自我能力提升一定体现在现实世界的实践上，而不是理论堆砌或 POC 验证。
        key_points:
          - 解决问题的四个步骤是定义问题、分解问题、模式匹配、整合方案
          - 非结构化思路是用经验直接提出最可能假设并优先验证，而非穷举排查
          - 也可对输入做正确性与完整性校验，对处理步骤逐步检查（可二分查找）
          - 经验库的质量和数量直接决定了模式匹配的效率和成功率
          - 没有复盘的实践只是经历不是经验，PDCA 循环的核心是检查环节
      - phase: 经验沉淀与模式库升华
        uses:
          - concept://模式提炼
          - concept://深度复盘
          - concept://知识经验库
          - concept://经验模式库
          - entity://认知提升闭环操作系统
        rule: 每次问题解决后要思考有哪些可复用的知识点可以入库，而不是把整条解决方法原样存储；通过体系化研究与深度复盘，把经验升华为方法论和模式。
        key_points:
          - 知识和经验的颗粒度越细，可复用性越强，匹配成功率越高
          - 从数据资料到知识技能，再经大量实践形成经验，最后深度复盘提炼方法论和模式
          - 模式特指针对特定场景下特定问题的、经过验证的最佳解决方案集合
          - 学习、实践、复盘构成螺旋引擎，复盘的深浅直接决定跨领域问题分析解决能力
          - 坚持记录和写作让思考显性化，是最高效的沉淀方式
    inputs:
      - 一个陌生或跨领域的新问题描述及其所处场景
      - 已有的知识库、经验模式库与可复用的细粒度经验点
      - 可补充学习的新领域资料与业界做法
      - 实践验证的条件与反馈渠道
    outputs:
      - 定义清晰并已归属到已知问题类型的问题陈述
      - 细粒度子问题分解树与经验点匹配结果
      - 聚合后的问题解决方案与实证验证结论
      - 新增入库的可复用经验点与模式条目
    tags: [模式匹配, 问题解决, 问题转化, 经验库, 复盘沉淀]

  - id: 如何突破认知障碍实现认知升级
    sources:
      - raw/从认知的概念到认知系统模型的构建.md
      - raw/克服认知障碍实现认知升级打造认知闭环.md
      - raw/如何高效和系统化的构建个人思维和认知体系.md
      - raw/知识和认知的本质区别.md
      - raw/突破认知障碍构建认知提升闭环系统.md
    define: 基础认知积累后，如何通过事物群分析与深度复盘打造持续改进的认知闭环
    trigger: "用户工作年限不断增加但认知能力没有同步提升，困在自我舒适圈与信息茧房里，形成一个观点后只找有利证据、忽视不利数据，学了很多道理却依然用不出来，于是提出类似\"如何突破认知瓶颈\"\"为什么懂得很多道理还是解决不了新问题\"的问题。"
    goal: 得到一套可自我进化的认知闭环操作系统：先定位自己在不知道自己不知道到不知道自己知道四境界中的位置并识别认知障碍类型，再从事物群分析与周期性深度复盘切入完成从基础认知到元认知的跃迁，把大量需要记忆的知识库压缩为少量可演绎的经验模式库，实现螺旋式上升。
    composition:
      - phase: 认知困境溯源与境界定位
        uses:
          - concept://认知四境界
          - concept://基础认知
          - concept://信息茧房
          - concept://认知偏差
          - entity://认知系统模型
        rule: 先诊断认知停滞的三个根源，即隐性知识未显性化、缺少复盘机制、知识不成体系，并用认知四境界定位自己当前所处位置与突破路径。
        key_points:
          - 工作年限无法等同于认知能力
          - 困于舒适圈、信息茧房和确认偏误是最典型的认知障碍
          - 知识是硬盘里的存储量，认知是CPU的处理能力
          - 基础认知就是学过和见过的，靠记忆和固有思考即可完成
          - 大部分人停留在第一和第二境界，需要系统化学习实践复盘才能跃迁
      - phase: 认知障碍识别与感知降噪
        uses:
          - concept://元认知
          - concept://知识显隐转化
          - concept://信息降噪
          - concept://主动信息过滤
          - entity://知识与认知五维对比
        rule: 用元认知监控识别自身的认知偏差与固定思维，同时强化感知接收器的过滤能力，建立清晰的目标和关注焦点、主动屏蔽无关信息，避免信息过载造成认知疲劳。
        key_points:
          - 元认知是对认知的认知，负责评估效果、识别偏差、调整策略
          - 外部信息无限而注意力有限，必须做降噪与过滤
          - 确认偏误让人只找有利证据而忽视不利数据和证据
          - 认知能力不是理论，必须自我亲自实践证悟才能真正提升
          - 知识是素材，认知是算法，只有素材没有算法依然产不出价值
      - phase: 从基础认知到元认知的跃迁
        uses:
          - concept://事物群分析
          - concept://抽象
          - concept://归纳
          - concept://举一反三
          - entity://第一实体与第二实体
        rule: 认知升级的关键是从单个事物的研究过渡到同类事物群的研究，按识别共相、分类归纳、结构化三步完成抽象，形成可迁移的元认知。
        key_points:
          - 单个事物的研究是问题驱动的，事物群的研究是自我驱动的
          - 高手不断抽象基础认知逻辑，抽象出来的就是元认知
          - 识别共相要从多个具体事物中跳出局限站在更高维度找共同属性
          - 分类归纳要遵循相互独立、完全穷尽的原则组织信息
          - 真正能认知升级的人一定具备抽象共性和举一反三的能力
      - phase: 周期性深度复盘与经验模式库沉淀
        uses:
          - concept://深度复盘
          - concept://深度复盘追问
          - concept://方法论抽象
          - concept://空间换时间
          - entity://认知闭环
        rule: 深度复盘要周期性、自我驱动地做，重点不是复盘单个事件而是对比多个同类事件，完成提取可复用经验点、归纳共性规律、抽象方法论、识别认知盲区四件事。
        key_points:
          - 复盘的四项任务是提取经验点、归纳共性、抽象方法论、识别认知盲区
          - 结果是形成在X情境下采用Y方法解决Z问题的套路
          - 只有通过深度复盘才能实现知识库向经验模式库的转化
          - 知识库量大、问题无法穷举，要用空间换时间构造自己的知识索引
          - 没有渐修就没有顿悟，突破往往发生在长期迭代之后的某个瞬间
      - phase: 认知闭环运行与持续迭代
        uses:
          - concept://双循环
          - concept://演绎
          - concept://模式匹配
          - entity://PDCA
          - entity://认知提升闭环操作系统
        rule: 用没有见过的新问题检验闭环：基于已有普遍规律做演绎尝试解决，若发现原有归纳仍有缺陷则触发下一轮深度复盘；以个人PDCA循环让认知系统自我驱动、持续优化。
        key_points:
          - 第一个循环是从经验到应用，第二个循环是从实践到提升
          - 更新后的经验模式库会直接反哺下一次实践并指导新一轮学习
          - 行动改变环境、环境产生新刺激，构成认知行动再认知的大循环
          - 认知的终极目标是面对任何新领域新问题都能快速建立框架并找到路径
          - 真正的高手不是知道得最多的人，而是认知系统运转最高效的人
    inputs:
      - 个人当前的认知水平定位与认知障碍清单
      - 大量已积累但尚未体系化的基础认知与实践案例
      - 个人知识库与经验模式库现状
      - 一个具体的长期目标或最想提升的专业领域
    outputs:
      - 认知四境界定位结果与认知障碍诊断
      - 从基础认知抽象出的元认知与事物群共性规律
      - 更新后的经验模式库与可迁移方法论
      - 可持续运行的个人认知闭环操作系统与周期性复盘机制
    tags: [认知升级, 元认知, 深度复盘, 认知闭环, 经验模式库]

  - id: 如何进行结构化决策
    sources:
      - raw/我是如此思考的思维整体框架和逻辑.md
    define: 面对多个方案和多维影响因素时，如何排序组合并选择满意方案
    trigger: "用户面对\"餐馆该涨价多少\"\"培训该投入多少\"\"几个方案该选哪个\"这类问题，发现影响要素多、备选方案多，而且不是简单的是与非的判断而是程度问题，靠直觉拍脑袋或简单的二元判断难以服人，希望有一套可操作的排序与选择方法。"
    goal: 用户能从破题明确终极目标出发，把目标分解为子目标和关键影响因素、用流程分析补全要素，再对要素做优先级排序并用矩阵分析做组合权衡，最后按评估准则在多个备选方案中选出满意方案并形成执行反馈闭环。
    composition:
      - phase: 破题与目标定位
        uses:
          - concept://破题
          - concept://目标定位
          - concept://目标转化
          - entity://SMART原则
        rule: 思考第一步是确定目标，重点在破题：从对问题表象的思考转化到对目标本身的定义，先形成单一的符合空间+时间要求的终极目标。
        key_points:
          - 不破不立，没有明确目标前不适合进行太多发散性思考，否则很多思考内容无法围绕目标
          - 目标要体现时间性和空间性，即SMART原则里的T与S、M
          - 目标是基础不是用来平衡的，不要把影响和制约因素当成了终极目标
          - 思考开始不要马上进入多个目标的平衡，先把多个子目标抽象为一个终极目标
          - 目标无法很好量化时，做更短周期的实践和试验来评估并最终确定目标
      - phase: 目标分解与关键要素识别
        uses:
          - concept://分解
          - concept://MECE
          - entity://CSF关键成功因素法
          - entity://树模型
        rule: 终极目标分解为子目标、子目标分解为关键影响要素、再通过流程分析找到关键控制变量，分解要符合MECE且同层同粒度。
        key_points:
          - CSF关键成功因素法把分解为子目标、找寻子目标关键要素、找寻关键控制变量三个环节结构化了
          - 分解过程需要尽量符合MECE法则，树上同层必须是相同层面和粒度、属于相同类别下的分解
          - 用SMART原则判断分解出来的内容是子目标还是关键成功要素
          - "目标到子目标分解最好3-5个，子目标到要素分解最好5-7个"
          - 静态和动态分解不能混淆在同一层，不熟悉领域建议先做动态分解
      - phase: 流程分析与要素补全
        uses:
          - concept://流程分析
          - concept://归纳
          - entity://鱼骨图
          - entity://头脑风暴
        rule: 自顶向下分解需要领域知识积累，陌生领域先用流程分析覆盖事物发展全过程再头脑风暴，避免关键要素遗漏。
        key_points:
          - 没有相关领域知识积累我们很难做到自顶向下，经验不足时无从下手
          - 流程分析和头脑风暴必须结合以保证不出现重要关键要素的遗漏
          - 头脑风暴内容零散，需要通过分组自下向上抽象形成完整的问题分解树
          - 分解用的模型归根到底是树模型，逻辑树前面几层是子目标分解、后面几层是控制变量分解
      - phase: 优先级排序
        uses:
          - concept://优先级排序
          - concept://依赖关系排序
          - concept://矩阵分析
        rule: 优先级是对事物多个属性要素综合衡量得出的级别，不是单一要素排序；排序前先找到影响事物的关键要素。
        key_points:
          - 单要素排序基本以数字说话，优先级排序则是多个属性要素综合得出的级别
          - 购房决策要综合价格、周边配套、学位、交通、未来发展多个要素得出综合得分
          - 排序前首先要找到影响事物的关键要素，找关键要素遵循分解的方法
          - 排序之目的最终是形成优先级列表，为决策服务
      - phase: 组合分析与权衡
        uses:
          - concept://多目标决策转换
          - concept://方案整合
          - entity://决策矩阵
          - entity://BSC平衡计分卡
        rule: 对问题群要的是组合决策而非二元决策，用矩阵分析从子目标维度看要素的分组特性，按目标和风险容忍度确定组合范围。
        key_points:
          - 矩阵分析是最简单的多维度分析和决策，打破原有的简单二元判断逻辑
          - 矩阵的维度来自目标分解的关键子目标，如投资收益与风险、性能提升幅度与成本
          - 很多时候要的不是排序最终的分值，而是排序清单的分组边界
          - 要素对目标诸多维度的影响是平衡的，一方面好了另一方面肯定带来负面影响
      - phase: 方案选择与执行闭环
        uses:
          - concept://结构化决策
          - concept://科学决策
          - entity://层次分析法
          - entity://决策树
        rule: 决策是从两个以上方案中选择满意方案，按明确评估准则、给出备选方案、多维度评估、选择推荐方案、执行跟踪五步推进。
        key_points:
          - 决策一定涉及多个方案的选择，决策的目的是行动和执行，执行的目的是解决问题
          - 结构化决策能用确定的模型或语言描述并以适当算法产生决策方案、从中选最优解
          - 先根据目标确定评估备选方案的准则，再给出多个可行备选方案并多维度评估后选择推荐方案
          - 执行决策结果并跟踪效果形成闭环；简单二元决策用层次分析法，涉及量的决策需要计算机模拟和动力学模型辅助
    inputs:
      - 一个待决策的现实问题及其现实与期望的差距
      - 该问题涉及的影响要素与备选方案清单
      - 历史数据与可参照的评估准则
    outputs:
      - 符合空间+时间要求的终极目标
      - 问题分解树与关键要素优先级列表
      - 矩阵组合分析后的方案范围
      - 选定的满意方案及跟踪反馈计划
    tags: [结构化决策, 目标分解, 优先级排序, 矩阵分析, 执行闭环]

  - id: 如何透过现象看透事物本质
    sources:
      - raw/思维系列如何一阵见血的看透事物的本质.md
      - raw/普通人理解和认知事物的底层逻辑完整版本.md
      - raw/构建思维能力知识体系和框架逻辑的闭环体系.md
    define: 面对表象和噪音时，如何通过动静分析、抽象归纳与模式匹配洞察底层规律
    trigger: "面对一个新事物或新领域，只看到外在表象和纷杂噪音、说不清它由什么构成、如何运作、为什么这样运作时触发；典型表现为读过大量讲底层逻辑的书和文章，道理都知道却无从下手，无法把内容应用到自己的学习和工作实践中，或者面对复杂现象被 90% 的噪音淹没、抓不住那 10% 的核心变量。"
    goal: 形成对事物的立体认知（静态结构加动态演进加所处环境），打开黑盒洞悉内部组件协同运作的机理，抽象出可复用的共性与底层规律，并能用因果自洽、关系自洽、过程自洽三重检验确认自己是否真的看透本质，最终把提炼出的逻辑元素连接成可持续生长的个人底层逻辑网络。
    composition:
      - phase: 认知框架定位
        uses:
          - concept://事物认知
          - concept://动静结合分析
          - concept://底层逻辑
          - entity://康德
          - entity://《纯粹理性批判》
        rule: 认知等于空间结构加时间演进加所处环境，先建立这条主线才知道要观察什么、从哪几个维度切入；底层逻辑归根到底是归纳法、演绎法和辩证法，不要把方法论层面的枝叶当成根。
        key_points:
          - 康德的三个先验要素空间、时间和范畴逻辑是认识和理解事物的最基本框架
          - 空间属性回答这个东西由什么组成以及各组成部分之间是什么关系
          - 时间属性回答这个东西是怎么运作的、经历了怎样的发展变化
          - 环境属性要求把事物放进更大的系统考察，任何事物都不是孤立存在的
          - 所谓底层逻辑归根结底只有归纳法、演绎法和辩证法这三项最根本的内容
      - phase: 打开黑盒的静态与动态解剖
        uses:
          - concept://静态结构分析
          - concept://动态行为分析
          - concept://运行机制分析
          - concept://分解
          - concept://分类
          - entity://因果循环图
        rule: 静态分析由外到内逐层分解，不止要识别组成部分更要搞清组件之间的依赖与协作关系；动态分析沿因果链追溯，两者建立映射才算真正打开黑盒。
        key_points:
          - 笛卡尔方法论的核心原则是把复杂问题尽量分解为多个较简单的小问题逐个解决
          - 静态结构分析同样适用于抽象概念，如数字化转型可分解为连接、数据和智能
          - 动态分析的核心要素是阶段、流程、活动、事件和状态变化，前一步输出即后一步输入
          - 要追问内部组件究竟如何协同运作才产生了这个外在行为，这是打开黑盒的真正含义
          - 警惕休谟的提醒，只观察到连续出现不能简单推断必然因果，避免经验联想式归因
      - phase: 抽象归纳与第一性原理上溯
        uses:
          - concept://抽象
          - concept://归纳
          - concept://样本充分性
          - concept://第一性原理
          - concept://本源抽象
        rule: 抽象的本质是抛弃个性、提取共性；第一性原理则要求朝树根方向不断上溯，越抽象泛化空间越大，后续重新推导时的分叉可能性也越多。
        key_points:
          - 抽象需要从具体事物中提取本质特征、剥离非本质细节，形成可复用的概念
          - 归纳要警惕样本偏差，样本量要足够且要注意代表性和多样性
          - 传统演绎路径容易被前人的框架束缚，最多只能在既有范式内做微创新
          - 从优化锂电池到提高能量存储效率再到如何储存能量，抽象度越高推导空间越大
          - 实践的程度越深入反而需要记忆的内容越少，因为已经掌握了那个一的索引
      - phase: 模式匹配与跨领域映射
        uses:
          - concept://模式匹配
          - concept://复杂匹配
          - concept://跨领域迁移
          - concept://举一反三
          - entity://事物认知模型
        rule: 粒度越粗越难匹配，必须把问题分解后在细粒度上与已有模式库一一对应，匹配后再向上聚合；高手能一语道破本质是因为存储了大量经过验证的模式。
        key_points:
          - 问题分解可静态按组成部分、动态按流程阶段、或按责任与功能进行
          - 简单匹配是一对一的直接对应，复杂匹配是分解后细粒度匹配再向上聚合
          - 大部分人解决问题能力弱的原因一是知识经验积累少，二是模式匹配能力弱
          - 知识和经验的颗粒度越细可复用性越强，模式匹配的成功率越高
          - 最高层次的本质洞察来自跨领域的联结与映射，朝前抽象到树干处即可建立连接
      - phase: 逻辑自洽检验与持续内化
        uses:
          - concept://逻辑自洽
          - concept://三段论推理
          - concept://批判思维
          - concept://深度复盘
          - entity://思维导图
        rule: 真正的深度洞察必须经得起三重检验，因果自洽看归纳演绎是否正确，关系自洽看知识点之间是否真正关联，过程自洽看能否清晰描述从素材到结论的推导。
        key_points:
          - 两个项目都用数据库调优解决性能问题就归纳出所有性能问题都是数据库问题，是典型归纳错误
          - 关系不自洽表现为单独问都熟悉，问两者如何结合使用就答不上来
          - 过程不自洽表现为素材现成、结论正确，却说不清一步一步如何推导出来
          - 底层逻辑不是学来的而是实践反刍来的，必须经历学习、实践和复盘三个阶段
          - 周期性深度复盘是把多个项目放在一起共同抽象提炼共性模式，而非单次浅复盘
    inputs:
      - 待认知的具体事物或现象及其外在表象观察
      - 已有的知识库、经验模式库与相关领域资料
      - 该事物所处环境与关联要素的信息
      - 可开展实践与验证的真实场景
    outputs:
      - 事物的静态组成结构图与组件间关系说明
      - 动态运作流程与真实因果链条
      - 抽象出的共性规律、概念模型与可复用逻辑元素
      - 经因果、关系、过程三重检验的本质结论与底层逻辑网络节点
    tags: [事物认知, 本质思考, 动静分析, 抽象归纳, 逻辑自洽]

  - id: 如何通过复盘实现能力进化闭环
    sources:
      - raw/个人提升解决问题能力的关键从结果到过程通过复盘形成闭环.md
      - raw/个体进化的底层逻辑从知识到技能从技能到方法论.md
      - raw/思维系列从学习的本质到如何高效快速学习.md
      - raw/碎片化工作和时间如何构建体系化知识库提升系统思维.md
      - raw/重申观点学习过程的价值远远超过学到的知识本身.md
    define: 长期只关注答案不关注过程时，如何从问题定义、分析、解决三阶段复盘闭环
    trigger: "用户习惯遇到问题时直接问同事或上网搜答案，事情一解决就丢到一边，多年下来工作年限增加而能力没有同步增长，同样的坑反复踩、复盘时只停留在时间估计不准这类表面原因，于是提出类似\"如何从经验中真正成长\"\"项目结束后到底该怎么复盘\"的问题。"
    goal: 得到一套从结果回溯到过程的复盘机制：能按问题定义、问题分析、问题解决三阶段还原当时的思考过程，把一次性的成败打碎为细粒度可复用的经验点，再经周期性深度复盘抽象为方法论，形成学习、实践、复盘螺旋上升的能力进化闭环。
    composition:
      - phase: 从结果导向转向过程导向
        uses:
          - concept://复盘
          - concept://元认知
          - concept://认知偏差
          - entity://三环学习法
        rule: 只关注答案不关注过程是能力停滞的根因；复盘要从我拿到了什么结果转向我当时是如何定义、分析和解决的，并逐层反思行动、假设与场景上下文三层闭环。
        key_points:
          - 问同事或搜答案虽解决了问题，却没有学会如何思考
          - 三环学习分别对应行动闭环、假设闭环和上下文闭环
          - 行动闭环只是正确地做事，假设闭环是做正确的事
          - 上下文闭环要求跳出盒子从更大的时间和空间找根因
          - 复盘不是为了找借口，而是为了找到真正的解决方案
      - phase: 问题定义阶段的复盘
        uses:
          - concept://问题定义
          - concept://升维思考
          - concept://问题分类
          - concept://问题分解
          - entity://5W1H
        rule: 复盘时先还原问题的场景环境与现状与期望的差距，做好问题的分类、分解和抽象，并从单一维度走向多维度的升维处理。
        key_points:
          - 问题的本质是期望值与实际值之间的差距
          - 要搞清问题所处的环境和场景、问题的所有者以及差距边界
          - 大问题拆为小问题，大目标拆为小目标，多个相关问题做归类处理
          - 通过分类将行为和属性沉淀为问题的关键维度
          - 有了维度才能做结构化分析和矩阵分析
      - phase: 问题分析阶段的复盘
        uses:
          - concept://问题分析建模
          - concept://运行机制分析
          - concept://根因分析
          - concept://因果链分析
          - entity://鱼骨图
        rule: 分析的核心是建模，即打开黑盒研究内部各组件之间的关系、依赖与相互作用，找到导致外在行为的真正根因，而不是停留在表面现象。
        key_points:
          - 任何一个问题一旦分析清楚，都可以用最简单的模型来描述
          - 要深入内部研究组件如何相互作用并最终导致问题的行为
          - 追问到底，例如不停留在需求变更频繁而要追问沟通还是收集方法的问题
          - 避免把表面现象直接当作根因
          - 常用分析方法包括流程分析、头脑风暴、鱼骨图分析
      - phase: 问题解决阶段的复盘与经验点萃取
        uses:
          - concept://假设验证
          - concept://POC验证
          - concept://知识萃取
          - concept://技能转经验
          - entity://GRAI模型
        rule: 复盘按回顾目标、评估结果、分析原因、总结规律四步展开，把结论打碎成细粒度可组合复用的经验点，并对关键假设做验证而不是默认其成立。
        key_points:
          - 回顾目标阶段要还原最初的期望和标准
          - 评估结果阶段要客观记录实际发生的情况
          - 分析原因阶段要深入挖掘成功或失败的根本原因
          - 总结规律阶段要提炼可复用的经验和方法
          - 经验点颗粒度必须打碎，才能更好地组合和复用
      - phase: 周期性深度复盘与闭环进化
        uses:
          - concept://深度复盘
          - concept://事物群分析
          - concept://方法论抽象
          - concept://空间换时间
          - concept://群体观察
        rule: 单个问题解决后马上复盘是好事，但更要养成周期性深度复盘的习惯：对同类问题群做共性抽象形成方法论，实现知识库向经验模式库的转化，用空间换时间应对无法穷举的问题。
        key_points:
          - 问题解决后马上复盘重要，周期性复盘更重要
          - 要从结果到过程、从单一到多维度、从单一问题到问题群
          - 所有方法论都来自大量实践、不断总结复盘后的一步一步抽象归纳
          - 个体进化本质在群体中完成，要对多个案例做群体观察再总结普遍规律
          - 复盘的深浅直接决定跨领域分析问题与解决问题的能力
    inputs:
      - 一次已完成的实践、项目或问题解决的全过程记录
      - 当初设定的目标计划与最终实际结果的偏差数据
      - 个人已有的知识库与经验模式库
      - 同类问题的历史案例集合
    outputs:
      - 问题定义、分析、解决三阶段的复盘记录与根因结论
      - 细粒度可复用的经验点与更新后的经验库条目
      - 同类问题群的共性规律与抽象出的方法论
      - 下一轮实践的目标调整与改进行动计划
    tags: [复盘, 问题解决, 经验萃取, 方法论, 能力进化闭环]

  - id: 如何高效学习一个全新领域
    sources:
      - raw/AI时代的思考力程序员从学习成长到知识体系构建之路.md
      - raw/一文详细讲解基于系统工程思想构建自己的学习体系和学习系统.md
      - raw/在职场怎么抓住学习和成长的机会.md
      - raw/思维系列从学习的本质到如何高效快速学习.md
      - raw/进入职场后的学习逻辑三层六阶段金字塔学习方法论和PPT分享.md
    define: 进入陌生领域时，如何从主干认知到实践复盘形成高效学习闭环
    trigger: "用户被要求接手一个陌生的技术或业务领域，或自己决定转换方向，面对大量新名词术语不知从何下手，看了很多资料却记不住也用不上，于是提出类似\"如何快速入门一个全新领域\"\"新领域的学习路线应该怎么定\"的问题。"
    goal: 得到一条从黑盒主干认知到最小目标验证、再到完整知识树与可视化迭代、最终融会贯通的三层六阶段学习路径：能在最短时间内形成可以挂靠的骨架，产出可量化检验的最小成果，并把学习、实践、复盘串成闭环，真正具备独立分析和解决该领域问题的能力。
    composition:
      - phase: 学习的本质与目标定位
        uses:
          - concept://理解型学习
          - concept://目标驱动学习
          - concept://主干认知
          - concept://学习曲线
          - entity://三层六阶段学习法
        rule: 学习的本质是信息摄入后经大脑加工形成新理解，没有新理解形成就只是记忆；进入新领域前必须先明确最终学习目标与当前差距，否则拿到地图也没有用。
        key_points:
          - 学习等于信息摄入加大脑处理，结果是形成新的理解
          - 一次理解是理论学习，二次理解是实践检验后被条件化的定理
          - 要从记忆型学习转向理解型学习，从被动接收转向主动思考
          - 工作后的学习更多是实践驱动理论，先实践再反馈和理论系统化
          - 明确目标才能分清哪些知识点必须深入钻研、哪些只需大抵理解
      - phase: 不求甚解与找寻主干
        uses:
          - concept://不求甚解
          - concept://找寻主干
          - concept://黑盒思维
          - concept://概念模型搭建
          - entity://学习金字塔模型
        rule: 先用黑盒思维从外部把握整体，静态层面搞清对外提供哪些能力、动态层面只关注能否从起点状态到终点状态；再拆成几个主干块并搞清块间协同与前后依赖，能用自己语言复述清楚才算掌握。
        key_points:
          - 不求甚解不是敷衍，而是避免一开始就钻进细节而一叶障目不见泰山
          - 静态拆解拆成几个大块，动态拆解搞清这些块之间如何协同工作
          - 概念模型是对事物形成基础认知的自我可理解最简模型
          - 主干点之间的前后依赖没搞清楚就不要急于往下走
          - 能用自己的语言复述清楚，才说明真正掌握了事物的主干框架
      - phase: 最小目标的达成与验证
        uses:
          - concept://最小目标验证
          - concept://修悟结合
          - concept://POC验证
          - concept://假设验证
          - entity://SSH框架
        rule: 及早启动实践，在主干不做过多展开的前提下设定一个假想场景的最小可行目标并亲自动手完成，用修看到最终效果、用悟反推各层各组件如何协同。
        key_points:
          - 凡所有事，需亲自动手实践验证，以确认是否满足自我期望
          - 修是依葫芦画瓢看到效果，悟是完成后反推各组件如何协同
          - 最小目标本身可能没有实用价值，却能理清框架各层的协同关系
          - 快速达成小目标能帮助树立继续深入学习的信心
          - 从知道是什么到理解怎么做，完成从抽象到具象的第一次落地
      - phase: 知识树搭建与可视化迭代学习
        uses:
          - concept://知识树
          - concept://优先级排序
          - concept://依赖关系排序
          - concept://可视化迭代学习
          - entity://学习金字塔
        rule: 大量泛读但不过早钻入细节，把主干分解为细化知识点并识别重复交叉的底层公共基础；再按知识点对目标的贡献优先级和前后依赖关系制定分阶段、可量化的迭代学习计划。
        key_points:
          - 先回答最终的学习目标是什么，以及涉及哪些细化知识点
          - 从只见树木到最终能够看清楚完整的森林
          - 两个主干共同依赖的底层知识点最具复用价值，要优先打牢
          - 每一个迭代都必须是一个学习、实践、复盘总结的完整闭环
          - 迭代学习成果必须可视化且可量化检验
      - phase: 融会贯通与闭环进化
        uses:
          - concept://临界点突破
          - concept://深度复盘
          - concept://融会贯通
          - concept://输出倒逼输入
          - entity://学习状态机
        rule: 质变靠自我反省复盘与高人指点两个要素配合触发；用更严格专业的标准逼迫自己持续改进以逼近临界点，并通过写作与分享把隐性经验显性化，让学习状态机从复盘状态进入进化状态。
        key_points:
          - 量变到质变的突破核心靠自我反省复盘和高人指点
          - 用更严格专业的眼光要求自己，持续改进才能逼近极限和临界点
          - 参与实际项目过程中学习的效果远好于单纯看书自学
          - 导师能以旁观者身份看清你看不到的薄弱点
          - 学习过程的价值远远超过学到的知识本身
    inputs:
      - 待进入的全新领域及其业务或技术背景
      - 个人当前的知识基础与岗位能力差距清单
      - 可参考的业界标准模型、经典书籍与课程
      - 可用于验证的假想场景或真实项目机会
    outputs:
      - 该领域的主干概念模型与主干点依赖关系说明
      - 一个已完成的最小目标验证实践及其复盘记录
      - 完整的领域知识树与可视化分阶段迭代学习计划
      - 沉淀到个人知识与经验库的细粒度知识点和可复用模式
