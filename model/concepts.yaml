  - id: 归纳演绎循环
    sources:
      - raw/从经验思维到统计思维你应该了解的思维发展史.md
      - raw/思维框架和模型全面提升个人认知水平和分析解决问题的能力.md
      - raw/思维究竟是什么思维的逻辑和模式匹配.md
      - raw/我们在解决复杂问题时如何抽丝剥茧透过现象看本质.md
    define: 从经验归纳理论，再演绎检验和解决新问题以产生新经验
    type: 思维方法
    ipo:
      input:
      - 实践中产生的多个特殊案例
      - 已有的经验素材
      process:
        steps:
        - 从特殊案例出发观察现象并寻找共性
        - 提炼本质形成一般规律或理论模型
        - 以该规律为大前提，结合当前事实作为小前提进行演绎
        - 用演绎结论去解决新的特殊案例并验证
        - 把产生的新经验回补为下一轮归纳的素材
      output:
      - 迭代升级的理论模型
      - 解决新问题的具体结论
    decomposition:
      - step: 由具体到抽象
        uses: concept://归纳
        why: 由特殊案例出发观察现象、寻找共性、提炼本质形成一般规律
      - step: 由抽象到具体
        uses: concept://演绎
        why: 从一般规律结合事实推出结论，应用到新的特殊案例上
