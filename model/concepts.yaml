        - 判断该场景应映射到哪一类标准技术或AI能力
        - 用粗粒度的前置后置关系把场景诉求对接到技术接口上
        - 由已确定的标准技术驱动工具完成具体的实现输出
        tools:
        - entity://大模型
      output:
      - 场景到具体技术的匹配结论
      - 由该技术实现交付的可落地结果
    relations:
