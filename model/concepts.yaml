        - 在已有知识树上找到其应挂载的位置
        - 像拼积木一样把新知识点精准挂载上去
        - 建立它与相邻知识点之间的连接
        - 定期梳理结构并识别缺失环节
        tools:
        - entity://思维导图
      output:
