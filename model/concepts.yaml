      - step: 加工处理
        uses: concept://加工
        why: 有效信息需要被组织与加工才能成型
      - step: 模式匹配
        uses: concept://模式匹配
        why: 大脑会自动调用已有知识经验对比匹配，形成认识与方案
    relations:
