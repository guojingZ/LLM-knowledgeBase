      - raw/什么是系统思维个人应该如何培养系统思维能力从基本概念到案例分析.md
      - raw/如何提升自己的结构化思维和系统思维能力.md
    define: 以元素、连接、目标三要素认识事物，关注要素间相互作用与动态平衡的整体思维方式
    type: 思维方法
    ipo:
      input:
      - 待决策的问题或现象
      - 系统边界内的构成要素清单
      - 历史运行数据
      process:
        steps:
        - 由问题反溯其背后的目标，因为目标下才隐藏完整系统
        - 确定目标的空间维度（静态）与时间维度（动态）
        - 将系统分解为子系统或影响因子，分析因子间相互促进与制约
        - 基于动态模拟寻找多因子平衡下的满意解并决策
        tools:
        - entity://因果循环图
        - entity://iThink
      output:
      - 要素间正负反馈关系图
      - 多目标平衡后的满意决策方案
    decomposition:
      - step: 由问题反溯目标
        uses: concept://目标反溯
        why: 问题本身不是系统，只有目标下才隐藏完整的系统
      - step: 分解系统为影响因子
        uses: concept://分解
        why: 理解复杂系统必须先分类分解再分析单元间关系
      - step: 分析因子间相互作用
        uses: concept://要素关联分析
        why: 分解只是第一步，因子间的制约影响才是系统思考的根本
    relations:
      uses:
      - entity://因果循环图
      - entity://系统动力学
      contains:
      - concept://目标反溯
      - concept://要素关联分析
      references:
