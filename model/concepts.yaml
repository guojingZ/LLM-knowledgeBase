      - 大量且完备的数据
      process:
        steps:
        - 承认复杂事物难以短时间找到确定性和因果关系
        - 改用不确定性的思路看待世界
        - 把复杂问题转换为消除不确定性的问题
        - 找到能够消除相应不确定性的信息
        - 用足够大量的数据持续训练并迭代模型
        tools:
