        steps:
        - 按知识点对目标贡献大小排出学习优先级
        - 结合知识点之间的前后依赖关系划分学习阶段
        - 为每一阶段设定明确的产出目标而非泛读积累
        - 每阶段学习完成后立即实践，实践后再复盘总结
        - 以可量化的成果检验本轮迭代成效并进入下一轮
        tools:
        - entity://PDCA
      output:
      - 分阶段迭代的学习计划
      - 可量化的阶段性学习成果
    decomposition:
      - step: 每阶段设定明确产出目标
        uses: concept://目标驱动学习
        why: 目标驱动意味着不漫无目的泛读，而是有明确产出
      - step: 按贡献与依赖排序
        uses: concept://依赖关系排序
        why: 知识点对目标的贡献和彼此依赖共同决定学习次序
      - step: 实践后复盘
        uses: concept://复盘
        why: 每个迭代完成后马上实践再复盘，才能螺旋上升
      - step: 循环持续改进
        uses: concept://迭代思维
        why: 按计划执行检查改进的闭环持续迭代，无法一蹴而就
    relations:
      contains:
      - concept://目标驱动学习
      - concept://复盘
      - concept://迭代思维
      uses:
      - entity://PDCA
      related_to:
      - concept://依赖关系排序
      - concept://优先级排序
      - concept://深度学习
    tags: [目标驱动, 分阶段迭代, 可量化检验, 实践导向]

  - id: 可证伪性
    sources:
      - raw/从知识到智慧如何从西方哲学发展历史角度来理解知识这个核心概念.md
    define: 理论在逻辑上可能被反驳或检验，是区分科学与非科学的划界标准
    type: 哲学概念
    ipo:
      input:
      - 待判断的普遍命题或理论
      - 有限的个别经验事实
      process:
        steps:
        - 把理论表述为可被检验的普遍命题
        - 推演在何种观察事实下该命题会被推翻
        - 用观察和实验去尝试证伪而非证实
        - 逻辑上可能被反驳者判为科学，否则判为非科学
      output:
      - 科学与非科学的划界判断
      - 经检验暂时保留下来的理论
    relations:
      references:
      - entity://波普尔
      - entity://证伪主义
      related_to:
      - concept://试错法
      - concept://科学思维
      - concept://实证
    tags: [波普尔, 划界标准, 可反驳, 科学哲学]

  - id: 否定之否定
    sources:
      - raw/从知识到智慧如何从西方哲学发展历史角度来理解知识这个核心概念.md
    define: 知识通过不断否定旧知识、建立新知识而持续更新进步的规律
    type: 哲学概念
    ipo:
      input:
      - 已有的知识或命题
      - 其内部潜藏的矛盾与对立面
      process:
        steps:
        - 把握现有知识作为出发点并展开其内在矛盾
        - 提出与现有知识相对立的一面
        - 在矛盾的对立与扬弃中综合出更高层的知识
        - 新知识继续成为被否定的对象而循环推进
      output:
      - 更新后的知识
      - 由量的积累达到的质的飞跃
    relations:
      references:
      - entity://黑格尔
      - entity://《小逻辑》
      related_to:
      - concept://辩证逻辑
      - concept://正题反题合题
      - concept://质变突破
      - concept://对立统一
    tags: [黑格尔, 辩证法, 扬弃, 知识发展]

  - id: 呈现和泛化
    sources:
      - raw/对思维框架和内在逻辑的完整梳理和认识.md
    define: 问题解决后做结构化呈现，并把解法演绎泛化到同类问题
    type: 分析操作
    ipo:
      input:
      - 已解决问题的完整求解过程
      - 由本次求解沉淀出的一手经验
      process:
        steps:
        - 确定本次输出的核心结论与要呈现的主题
        - 用金字塔原理自顶向下组织承上启下的呈现结构
        - 把本次解法由特殊上升为一般，抽象为可复用的方法论
        - 用泛化后的方法去解答同类新问题并再次验证
      output:
      - 结构完整的呈现文档或方案材料
      - 可迁移复用的通用方法论
    relations:
      uses:
      - entity://金字塔原理
      related_to:
