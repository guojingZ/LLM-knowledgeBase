        - 将任务拆分为更细粒度可并行的子任务
        - 打破传统的前置依赖与关键路径约束
        - 把当前能够提前做的工作尽早启动迭代
        - 持续检查是否有人闲着没事做
      output:
      - 提前启动的工作任务安排
      - 项目早期更高的资源利用率
    relations:
