        - 逐段观察各时间片段下事物的状态变化与过程步骤
        - 以前一步的输出作为后一步的输入串成流程链条
        - 由最终结果沿因果链逐级向上追溯成因
        - 排除多因素共同作用下的表面联想式归因
      output:
      - 事物阶段、流程、活动、事件的动态刻画
      - 剔除伪相关后的真实因果链
