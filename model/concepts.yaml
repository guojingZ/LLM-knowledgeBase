  - id: 事物认知
    sources:
      - raw/一文详细讲解基于系统工程思想构建自己的学习体系和学习系统.md
      - raw/普通人理解和认知事物的底层逻辑完整版本.md
      - raw/突破认知障碍构建认知提升闭环系统.md
    define: 以静态结构、动态行为与动静结合认识事物，先总后分先外后内
    type: 思维方法
    ipo:
      input:
      - 待认知的事物或知识领域
      - 事物对外呈现的功能与约束信息
      process:
        steps:
        - 先总后分、先外后内，厘清事物的边界、功能与约束
        - 做静态结构分析，拆分事物的组成部件
        - 做动态行为分析，梳理部件的协同与流程
        - 动静结合，建立结构部件与行为步骤的映射
        - 通过归纳与演绎在抽象与具象之间往返
      output:
      - 事物的静态结构与动态行为认知
      - 结构机理与行为机制的完整理解
    decomposition:
      - step: 静态结构认知
        uses: concept://静态结构分析
        why: 先拆清楚组成部件，才谈得上研究部件之间如何协同
      - step: 动态行为认知
        uses: concept://动态行为分析
        why: 只看结构无法解释事物表现出的外在行为特征
      - step: 结构映射流程
        uses: concept://动静结合分析
        why: 要把静态组成部件和动态操作步骤建立映射才看得全
      - step: 抽象与具象往返
        uses: concept://归纳演绎循环
        why: 既要能看全貌，也要能抓关键，需在抽象与具象间往返
    relations:
      contains:
      - concept://静态结构分析
      - concept://动态行为分析
      - concept://动静结合分析
      related_to:
      - concept://归纳演绎循环
      - concept://思维双主线
    tags: [事物认知, 静态结构, 动态行为, 动静结合]

  - id: 二元对立
    sources:
