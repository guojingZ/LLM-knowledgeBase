        - 你实际看到的内容只占全部内容的冰山一角
        - 有用的但不在兴趣范围内的信息被过滤掉
        - 行为习惯被不断固化并停留在自我舒适区
        - 认知范围越来越狭窄
      output:
      - 只剩自己想看的少量内容
      - 受限且收窄的个人认知
    relations:
