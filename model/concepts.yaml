    tags: [回溯广度, 瓶颈突破, 跨域迁移]

  - id: 因果的习惯性联想
    sources:
      - raw/从知识到智慧如何从西方哲学发展历史角度来理解知识这个核心概念.md
    define: 休谟认为因果关系只是多次经验形成的心理习惯性预期，非客观必然
    type: 哲学概念
    ipo:
      input:
      - 多次重复观察到的相继现象
      process:
        steps:
        - 反复观察到两个现象先后相继出现
        - 在心理上形成后者将随前者出现的预期
        - 把先后相继当作因果关系来使用
        - 承认无法通过经验证明其客观必然性
      output:
      - 关于因果的习惯性预期
      - 对人类认识能力有限性的判断
    relations:
      references:
      - entity://休谟
      - entity://经验主义
      related_to:
      - concept://误认因果
      - concept://归纳
      - concept://实证
    tags: [休谟, 因果, 习惯联想, 怀疑论]

  - id: 因果链分析
    sources:
      - raw/所有的思维均来源于我们对世界和自我的认知对思维框架逻辑构建的哲学思考.md
    define: 把事物置于环境中，分析多因素作用与行为间的因果链条
    type: 分析操作
    ipo:
      input:
      - 事物在特定环境下的外在行为表现
      - 环境中可能作用于该事物的诸多因素
      process:
        steps:
        - 把事物放进大环境中识别与之关联和依存的外在因素
        - 观察并记录事物行为表现及其变化
        - 逐一考察单因素变化是否引起该行为变化
        - 检验该行为是单因所致还是多因素组合影响的结果
        - 用严谨的实验论证串出导致该行为的因果链条
      output:
      - 导致事物行为的多因素因果链条
      - 经实验验证的因果关系结论
    decomposition:
      - step: 先观察因素与行为的相关性
        uses: concept://相关性分析先行
        why: 环境研究首先是观察事物与外部因素的关联作用，再谈因果
      - step: 警惕习惯性联想
        uses: concept://因果的习惯性联想
        why: 休谟指出因果只是心理上的习惯性联想，靠经验联想易得错误结论
      - step: 排除伪因果
        uses: concept://误认因果
        why: 看到浇水后花开不等于浇水是必然原因，需排除偶然与不相关因素
      - step: 实验论证因果
        uses: concept://实证
        why: 找出因果链条不是简单关联联想，需要更严谨的实验论证
    relations:
      depends_on:
      - concept://相关性分析先行
      contains:
      - concept://实证
      references:
      - entity://休谟
      related_to:
      - concept://误认因果
      - concept://因果的习惯性联想
      - concept://事物认知
    tags: [因果链条, 环境因素, 组合影响, 实验论证]

  - id: 场景-技术映射
    sources:
      - raw/思维和认知能力退化AI时代跨领域知识广度远比专业深度更加重要.md
    define: 判断在具体的问题场景下应该选用什么技术去解决
