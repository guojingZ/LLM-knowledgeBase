  - id: 普遍怀疑
    sources:
      - raw/从知识到智慧如何从西方哲学发展历史角度来理解知识这个核心概念.md
    define: 笛卡尔以怀疑一切寻找不可动摇的确定性、确立知识起点的思维方法
    type: 思维方法
    ipo:
      input:
      - 待接受的各种既有结论与观念
      process:
        steps:
        - 对既有结论逐一怀疑，包括权威的结论
        - 只保留自己判断非常清楚确定、无可怀疑者
        - 发现怀疑这一行为本身无法被怀疑
        - 由怀疑行为的存在确立思考者自身的存在
        - 以该确定性为起点展开其余知识
      output:
      - 不可动摇的知识起点
      - 经怀疑筛选后的清楚明确的观念
    relations:
      references:
      - entity://笛卡尔
      - entity://《方法论》
      related_to:
      - concept://天赋观念
      - concept://演绎
      - concept://批判思维
      - concept://独立思考
    tags: [笛卡尔, 怀疑, 确定性起点, 我思故我在]

