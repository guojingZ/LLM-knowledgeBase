  - id: 本体论分析
    sources:
      - raw/所有的思维均来源于我们对世界和自我的认知对思维框架逻辑构建的哲学思考.md
    define: 研究存在的本质、基本结构、形式与本质属性
    type: 哲学概念
    ipo:
      input:
      - 待研究的事物或存在者
      process:
        steps:
        - 确认该事物作为存在者的客观实在性
        - 追问什么是最真实的存在
        - 考察存在有哪些种类或形式，区分质料与形式
        - 提炼事物的本质属性与共相
        - 区分第一实体（具体个体）与第二实体（抽象类别）
      output:
      - 对事物存在本质与基本结构的界定
      - 抽象出的共相与第二实体概念
    decomposition:
      - step: 研究存在本身
        uses: concept://事物认知
        why: 单纯研究事物本体是自然科学的起源，先确认事物是什么
      - step: 抽象理解这种存在
        uses: concept://本源抽象
        why: 形而上学研究的重点是如何抽象地理解客观存在的事物和现象
    relations:
      references:
      - entity://亚里士多德
      - entity://海德格尔
      - entity://第一实体与第二实体
      related_to:
      - concept://认识论分析
      - concept://事物认知
      - concept://本源抽象
    tags: [本体论, 存在, 本质属性, 哲学]

  - id: 本源抽象
    sources:
      - raw/AI时代的个体思维进化从系统思维到第一性原理.md
    define: 从树叶树枝朝树根追溯，找寻可作为演绎起点的根节点的抽象过程
    type: 思维方法
    ipo:
      input:
      - 分散在末端的具体知识与现象
      process:
        steps:
        - 从最末端的具体知识点出发朝上追溯
        - 逐层抽象，把可归约的概念向上合并
        - 在不同分支的交汇处建立连接
        - 一直追溯到不再可追问的根节点
        - 以该根节点作为后续演绎泛化的起点
      output:
      - 可作为演绎起点的根节点
      - 跨分支建立的知识连接
    decomposition:
      - step: 逐层向上抽象
        uses: concept://抽象
        why: 只有朝树根方向抽象，原本无关的末端知识才会融合并建立连接
      - step: 定位根节点
        uses: concept://第一性原理
        why: 追溯到不能再被追问、不证自明的起点才是真正的根
      - step: 由根泛化
        uses: concept://演绎
        why: 越靠近根节点，后续演绎泛化时创新的可能性才越大
    relations:
      produces:
      - concept://第一性原理
      related_to:
      - concept://抽象
      - concept://跨领域迁移
      - concept://举一反三
    tags: [追本溯源, 抽象, 根节点]

  - id: 机械思维
    sources:
      - raw/从经验思维到统计思维你应该了解的思维发展史.md
    define: 认定规律确定且可用精确数学公式表达并用于指导未知领域的思维方式
    type: 认知原理
    ipo:
      input:
      - 观察到的现象数据
      - 关于确定性规律的假设
      process:
        steps:
        - 假定世界变化有规律且规律具有确定性
        - 用数学公式对规律做精确建模
        - 用模型在未知领域做预测
        - 用预测结果指导实践、改造自然
        - 检查建模失败是否源于影响因子过多或测量不准
      output:
      - 精确描述规律的数学模型
      - 可用于未知领域的预测与指导
    relations:
      references:
      - entity://《自然哲学的数学原理》
      related_to:
      - concept://科学思维
      - concept://定性到定量
      - concept://统计思维
      - concept://实证
    tags: [确定性, 数学公式, 模型, 工业革命]

  - id: 架构思维
    sources:
      - raw/AI时代的思考力程序员从学习成长到知识体系构建之路.md
      - raw/软件架构师应走出技术狂热误区锻炼核心全局思维能力.md
    define: 以分解、集成、抽象、泛化、组合、复用、组装为核心内容的思维方式
    type: 思维方法
    ipo:
      input:
      - 待设计的系统或复杂问题
      process:
        steps:
        - 对系统做分解，拆出组成部件
        - 对分解出的部件做抽象与泛化
        - 定义部件间的接口与约束并完成集成
