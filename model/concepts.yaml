version: "2.0"
updated_at: "2026-09-23"

concepts:

  - id: MECE
    sources:
      - raw/什么是系统思维个人应该如何培养系统思维能力从基本概念到案例分析.md
      - raw/我们在解决复杂问题时如何抽丝剥茧透过现象看本质.md
      - raw/深度思考的一个关键完成思维逻辑的自洽.md
    define: 分解时相互独立、完全穷尽、不重不漏的划分原则
    type: 分析操作
    ipo:
      input:
      - 待分解的整体或问题
      process:
        steps:
        - 确定分解维度并逐层展开
        - 检查同一层各子项是否相互独立
        - 检查子项加总是否完全覆盖整体
      output:
      - 不重不漏的分解结构
    relations:
      references:
      - entity://金字塔原理
      related_to:
      - concept://分解
      - concept://结构化思维
    tags: [分解, 不重不漏, MECE]

  - id: POC验证
    sources:
      - raw/一文详细讲解基于系统工程思想构建自己的学习体系和学习系统.md
      - raw/个人提升解决问题能力的关键从结果到过程通过复盘形成闭环.md
      - raw/对思维框架和内在逻辑的完整梳理和认识.md
      - raw/思维框架和模型全面提升个人认知水平和分析解决问题的能力.md
    define: 基于分析出的模型做POC试验，以验证方法是否真能解决问题
    type: 分析操作
    ipo:
      input:
      - 问题分析建模得出的模型
      - 待解决的具体问题
      process:
        steps:
        - 由模型确定本次要验证的关键假设与方法
        - 设计POC试验的场景、范围与验证标准
        - 在受控场景中执行POC试验
        - 观察结果，确认方法是否真正解决了问题
        - 未通过则修正模型后再次验证
      output:
      - 方法有效性的验证结论
      - 可进入真实项目实践的方案
    relations:
      depends_on:
      - concept://问题分析建模
      related_to:
      - concept://最小目标验证
      - concept://实证
      - concept://假设验证
    tags: [验证, 试验, 问题解决]

  - id: 三段论推理
    sources:
      - raw/深度思考的一个关键完成思维逻辑的自洽.md
    define: 由大前提、小前提推出结论的形式逻辑推理方式
    type: 思维方法
    ipo:
      input:
      - 大前提（普遍规律）
      - 小前提（具体情境）
      process:
        steps:
        - 确认大前提为真
        - 确认小前提落入大前提适用范围
        - 由两者推出结论
        - 检查不可由结论反推前提
      output:
      - 关于具体情境的结论
    relations:
      related_to:
      - concept://演绎
      - concept://逻辑自洽
      - concept://形式逻辑
    tags: [演绎, 形式逻辑, 三段论]

  - id: 不求甚解
    sources:
      - raw/进入职场后的学习逻辑三层六阶段金字塔学习方法论和PPT分享.md
    define: 先一览事物整体全貌，静态只问外部能力，动态只问能否从A到Z
    type: 学习理论
    ipo:
      input:
      - 一个全新的知识领域或陌生事物
      process:
        steps:
        - 不急于打开黑盒，先一览事物的整体全貌
        - 静态层面不管内部结构，只搞清事物提供哪些外部能力
        - 动态层面只关注能否由A到达Z，先不关心具体路线
      output:
      - 事物整体全貌的初步认知
      - 事物的外部能力与输入输出边界
    relations:
      depends_on:
      - concept://黑盒思维
      produces:
      - concept://找寻主干
      related_to:
      - concept://基础认知
      - concept://大架构观
      - entity://三层六阶段学习法
    tags: [黑盒思维, 整体全貌, 学习入门, 三层六阶段]

  - id: 业务驱动技术
    sources:
      - raw/软件架构师应走出技术狂热误区锻炼核心全局思维能力.md
    define: 技术为解决业务问题和业务目标服务，避免技术狂热与过度设计
    type: 管理学原理
    ipo:
      input:
      - 业务场景与业务需求目标
      - 候选技术与开源框架清单
      - 成本与收益数据
      process:
        steps:
        - 全面理解业务需求，明确要解决的业务问题和业务目标
        - 判断候选技术能否真正支撑业务目标的实现
        - 做技术适配与成本收益分析，选当前最合适而非最新最热的技术
        - 检查是否存在过度设计和技术平台反复推翻重建
      output:
      - 业务与技术相互适配的技术方案
      - 避免高估的技术狂热与过度设计
    relations:
      depends_on:
      - concept://架构思维
      uses:
      - concept://模式匹配
      related_to:
      - concept://迭代思维
      - concept://大架构观
      - entity://RUP
    tags: [业务驱动, 技术适配, 成本收益, 反技术狂热]

  - id: 临界点突破
    sources:
      - raw/进入职场后的学习逻辑三层六阶段金字塔学习方法论和PPT分享.md
    define: 持续改进逼近极限与临界点，由量变积累触发质变并真正突破
    type: 学习理论
    ipo:
      input:
      - 长期实践练习后积累的知识与实践量
      - 自我反省与复盘形成的方法论
      - 高人对突破关键点的指点
      process:
        steps:
        - 分析无法突破的原因，是练习时间不够、基础不牢还是知识没有系统化
        - 养成总结反省和复盘的习惯，形成自己的方法论和模式
        - 用更严格专业的眼光要求自己去追求极致，形成持续改进意识
        - 在持续改进中不断逼近极限和临界点直至突破
      output:
      - 由量变触发的质变突破
      - 突破后贯通的完整领域认知
    relations:
      produces:
      - concept://融会贯通
      related_to:
      - concept://质变突破
      - concept://长期主义
      - concept://负熵
      - entity://三层六阶段学习法
    tags: [量变质变, 持续改进, 复盘习惯, 三层六阶段]

  - id: 主动信息过滤
    sources:
      - raw/信息爆炸时代认知高和认知低的六大核心差异体现.md
    define: 按核心目标与价值观启动过滤机制，只让相关信号进入认知系统
    type: 分析操作
    ipo:
      input:
      - 外部涌入的海量信息
      - 自己当前的核心目标与关注焦点
      process:
        steps:
        - 先建立清晰的目标和关注焦点，明确自己的关注点在哪里
        - 面对外界信息时启动感知接收器的过滤机制
        - 只放行与核心目标、核心价值观相关的信号
        - 主动屏蔽无关的娱乐八卦与情绪垃圾
        - 训练注意力的选择性和持久性，保持聚焦
        tools:
        - entity://认知系统模型
      output:
      - 与核心目标相关的高质量信息原材料
      - 持续聚焦而不被分散的注意力
    relations:
      depends_on:
      - concept://目标定位
      uses:
      - entity://认知系统模型
      related_to:
      - concept://信息降噪
      - concept://认知水平差异
      - concept://认知偏差
    tags: [主动过滤, 降噪, 目标导向, 注意力]

  - id: 主动探索
    sources:
      - raw/关于思维的七个观点供大家参考.md
    define: 从被动接受任务转向主动思考，任务完成后主动弥补其暴露的知识缺陷
    type: 学习理论
    ipo:
      input:
      - 已完成的一个具体工作任务
      - 已解决的一个具体问题
      process:
        steps:
        - 任务完成后追问该任务还涉及哪些知识或外延值得学习
        - 问题解决了追问该问题暴露了自己哪些知识缺陷
        - 针对识别出的缺陷主动去搜索材料并学习弥补
        - 在没有工作安排时也自主发起思考和探索
      output:
      - 补上的知识外延与缺陷清单
      - 持续自我提升的主动习惯
    relations:
      related_to:
      - concept://问题驱动学习
      - concept://从点到面学习
      - concept://主动信息过滤
      - concept://实践驱动学习
    tags: [主动学习, 自我驱动, 持续改进]

  - id: 主干认知
    sources:
      - raw/思维系列从学习的本质到如何高效快速学习.md
    define: 先掌握新领域核心点及其关系、依赖和整体脉络的认知
    type: 学习理论
    ipo:
      input:
      - 新领域中大量陌生的名词术语与概念
      - 事物对外提供的能力与功能说明
      process:
        steps:
        - 以不求甚解的策略先不钻细节，只把握事物整体
        - 静态层面只确认事物对外提供哪些功能和能力
        - 动态层面只确认起点状态A能否到达终点状态Z
        - 理清黑盒内部究竟有几个主干点
        - 分析主干点之间的相互影响与前后依赖顺序
        - 能用自己的语言复述出主干脉络才算真正掌握
        tools:
        - entity://SSH框架
      output:
      - 新领域的主干框架与粗粒度脉络
      - 可供后续深入学习挂靠的骨架结构
    decomposition:
      - step: 战略性跳过细节
        uses: concept://不求甚解
        why: 一开始钻入细节容易丧失信心也无法把握全貌
      - step: 以黑盒视角看整体
        uses: concept://黑盒思维
        why: 静态只关心对外功能，动态只关心起点到终点能否到达
      - step: 识别并复述主干点
        uses: concept://找寻主干
        why: 只有能用自己的语言复述清楚才说明掌握了主干框架
    relations:
      depends_on:
      - concept://不求甚解
      contains:
      - concept://黑盒思维
      - concept://找寻主干
      uses:
      - entity://SSH框架
      produces:
      - concept://知识树
      related_to:
      - concept://从点到面学习
      - concept://目标驱动学习
    tags: [黑盒思维, 先总后分, 主干框架, 新领域学习]

  - id: 主题阅读
    sources:
      - raw/碎片化工作和时间如何构建体系化知识库提升系统思维.md
    define: 基于目标或主题对收集资料归类整理并精读，形成个人知识库
    type: 知识管理
    ipo:
      input:
      - 平时收集来的资料与碎片化信息
      - 明确的学习目标或主题
      process:
        steps:
        - 按目标或主题对收集到的资料进行归类整理
        - 围绕该主题跨学科搜集素材做主题学习
        - 对筛选出的有用资料进行精读和学习
        - 将精读成果挂接进已有知识树的对应枝叶
      output:
      - 条理清晰的知识树枝干
      - 初步形成的个人知识库
    relations:
      uses:
      - concept://目标驱动学习
      produces:
      - concept://知识树
      related_to:
      - concept://知识四层演进
      - concept://知识体系构建
    tags: [主题阅读, 精读, 归类整理]

  - id: 举一反三
    sources:
      - raw/克服认知障碍实现认知升级打造认知闭环.md
    define: 由单个案例抽象出共性后推及同类场景，获得独立解决问题能力
    type: 思维方法
    ipo:
      input:
      - 已经做过的单个案例或题目
      - 从该案例中抽象出的共性规律
      process:
        steps:
        - 解决完单个案例后回看其关键求解点
        - 从该案例抽象出同类问题的通用思路
        - 遇到换了花样或换了场景的新问题时做模式匹配
        - 把通用思路适配到新场景并求解，验证是否需要修正
      output:
      - 面对同类新场景的独立解决能力
      - 修正完善后的通用思路
    decomposition:
      - step: 抽象共性
        uses: concept://抽象
        why: 认知升级的人一定是具备了抽象共性、举一反三的人
      - step: 推及新场景
        uses: concept://演绎
        why: 由抽象出的通用思路推导到具体的新场景才能算会用
    relations:
      depends_on:
      - concept://基础认知
      contains:
      - concept://抽象
      - concept://演绎
      related_to:
      - concept://方法论迁移
      - concept://事物群分析
      - concept://深度复盘
    tags: [抽象共性, 迁移, 通用思路, 认知升级]

  - id: 事实
    sources:
      - raw/诸法皆因缘起世界是事实的总和而非事物的总和从事实到逻辑空间.md
    define: 事物间发生关联或作用后最终展现出来的形态或行为
    type: 哲学概念
    ipo:
      input:
      - 客观存在的若干事物或对象
      process:
        steps:
        - 识别参与该场景的事物或更小颗粒度的对象
        - 确认事物彼此间发生了何种关联和联系
        - 记录相互发生作用后最终展现出来的形态或行为
      output:
      - 一个当下正在发生的客观事实
    relations:
      depends_on:
      - concept://事物认知
      produces:
      - concept://命题
      related_to:
      - concept://事态
      - concept://逻辑图像
      - entity://《逻辑哲学论》
    tags: [事实, 关联作用, 客观现实, 逻辑哲学论]

  - id: 事态
    sources:
      - raw/诸法皆因缘起世界是事实的总和而非事物的总和从事实到逻辑空间.md
    define: 潜在可能发生但尚未发生的状态，是成为事实之前的一种可能性
    type: 哲学概念
    ipo:
      input:
      - 当前正在发生的事实与事物状态
      - 观察者基于现状做出的推测
      process:
        steps:
        - 基于当前情况推测下一步可能发生何种变化
        - 确认该变化此刻尚未发生，仅为潜在可能
        - 随时间推移观察其是否由潜在变为现实
      output:
      - 尚未实现的一种可能状态
    relations:
      depends_on:
      - concept://事实
      related_to:
      - concept://逻辑空间
      - entity://《逻辑哲学论》
    tags: [潜在可能, 可能性, 时间维度, 逻辑哲学论]

  - id: 事物群分析
    sources:
      - raw/克服认知障碍实现认知升级打造认知闭环.md
    define: 由问题驱动的单个事物研究转入自我驱动的同类事物群研究以抽象共性
    type: 分析操作
    ipo:
      input:
      - 大量同类事物或事件的案例积累
      - 已有的基础认知
      process:
        steps:
        - 在问题驱动下积累足够多的同类单个案例
        - 自我驱动地提出这类问题是否存在通用化求解思路
        - 把同类案例放在一起对比，找出共同点与差异
        - 抽象共性并归纳出一般性的规律和方法论
        - 用无法套用的反例修正和完善该规律
      output:
      - 同类事物的普遍性规律
      - 可迁移的方法论
    relations:
      depends_on:
      - concept://基础认知
      uses:
      - entity://认知闭环
      related_to:
      - concept://深度复盘
      - concept://概念抽象
      - concept://举一反三
      - concept://模式提炼
    tags: [事物群, 自我驱动, 共性抽象, 认知升级]

  - id: 事物群认知
    sources:
      - raw/基于思维框架逻辑来构建思维能力体系并应用到实践.md
    define: 由单个事物认知扩展到同类事物群，归纳抽象出普适性规律并入库
    type: 认知原理
    ipo:
      input:
      - 多个同类事物的单次认知记录
      - 知识经验库中的历史同类分析经验
      process:
        steps:
        - 去知识经验库查找是否原来分析过类似的同类事物
        - 把同类事物放到一起做周期性的复盘
        - 抽象归纳出同类事物共性的规律和方法论
        - 将形成的普适性规律入库到经验模式库
      output:
      - 同类事物的普适性规律
      - 经验模式库中的新增条目
    decomposition:
      - step: 周期性复盘同类事物
        uses: concept://深度复盘
        why: 对一类事物的周期性复盘才是一个深度复盘过程
      - step: 从特殊到一般归纳抽象
        uses: concept://归纳
        why: 认知升级的关键就是从特殊到一般完成关键的抽象动作
    relations:
      is_a:
      - concept://事物认知
      depends_on:
      - concept://深度复盘
      - concept://归纳
      produces:
      - concept://经验模式库
      related_to:
      - concept://举一反三
      - concept://空间换时间
    tags: [事物群, 归纳抽象, 认知升级]

  - id: 事物观察
    sources:
      - raw/构建你的多维思考力从事物认知到问题解决.md
    define: 从事物的三维立体模型、所处空间环境与所处时间周期三个维度完成对事物的观察
    type: 分析操作
    ipo:
      input:
      - 待认识的单个事物
      - 事物所处的空间环境
      - 事物运行所处的时间周期
      process:
        steps:
        - 观察事物的外形、颜色、部件组成等三维立体结构
        - 观察事物随时间展开的运行情况与发展规律
        - 将事物放回所处环境，考察它与周围事物的依存关联
        - 由表象打破黑盒，深入到内部构件的协同机理
      output:
      - 事物在时空环境中的完整观察记录
      - 从表象到内在机理的分层认知
    relations:
      related_to:
      - concept://事物认知
      - concept://从表象到本质
      - concept://静态结构分析
      - concept://动态行为分析
