  - id: 目标转化
    sources:
      - raw/我是如此思考的思维整体框架和逻辑.md
    define: 从问题找到期望，再将期望量化为带时空约束的目标
    type: 分析操作
    ipo:
      input:
      - 当前面临的具体困惑或问题
      - 现实结果与期望之间的差距
      process:
        steps:
        - 明确问题即现实与期望之间的差距
        - 由差距反溯其背后真正的期望
        - 把期望转化为目标并加上空间性与时间性约束
        - 将多个子目标抽象提升为单一的终极目标
        - 剔除被误当作目标的影响因素和制约因素
        - 无法量化时先做短周期试验评估目标可达成性
        tools:
        - entity://SMART原则
      output:
      - 符合空间与时间要求的单一终极目标
    decomposition:
      - step: 先定义清楚问题
        uses: concept://问题定义
        why: 问题就是期望与现实的差距，不明确差距就无从谈目标
      - step: 由问题反溯期望
        uses: concept://目标反溯
        why: 思考之第一步是破题，从对表象的思考转化到对目标的定义
      - step: 对目标做量化约束
        uses: concept://定性到定量
        why: 单纯的空间目标没有意义，必须加上时间与范围的量化
      - step: 用短周期试验校准
        uses: concept://最小目标验证
        why: 无法很好量化时通过短周期试验来评估并最终确定目标
    relations:
      depends_on:
      - concept://问题定义
      - concept://目标反溯
      uses:
      - entity://SMART原则
      related_to:
      - concept://定性到定量
      - concept://最小目标验证
      - concept://目标定位
    tags: [问题转目标, 终极目标, 时空约束, 破题]

