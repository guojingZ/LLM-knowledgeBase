        - 资料停留在资料库而缺少分类归纳
        - 缺少亲身实践导致知识无法内化
        - 零散信息无法汇聚为解决复杂问题的能力
      output:
      - 信息焦虑的困境状态
      - 无法转化为实践战力的零散信息
