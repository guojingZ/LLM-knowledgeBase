    define: 将多个相关问题按属性归类处理，大问题拆小问题、大目标拆小目标
    type: 分析操作
    ipo:
      input:
      - 一个大问题或一组相关问题
      process:
        steps:
        - 判断当前面对的是单个大问题还是一组相关问题
        - 对大问题做拆解，大问题拆小问题、大目标拆小目标
        - 对多个相关问题按属性做归类处理
        - 对每一类问题分别确定后续的处理方式
      output:
      - 归类后的小问题清单与问题类别
    relations:
      related_to:
