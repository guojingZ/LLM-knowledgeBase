    relations:
      uses:
      - entity://思维导图
      - entity://认知系统模型
      related_to:
      - concept://知识树
      - concept://知识体系构建
      - concept://概念抽象
    tags: [知识树, 连接, 挂载, 结构化]

  - id: 知识网络构建
    sources:
      - raw/思维系列从个人知识体系构建到知识网络图谱的构建.md
    define: 将知识层级、依赖、映射、流程和场景连接成可用网络
    type: 知识管理
    ipo:
      input:
      - 已形成的知识树与离散知识点
      - 知识点之间的层级、依赖与映射关系
      process:
        steps:
        - 梳理知识的组成与层级关系形成知识树
        - 标注知识点之间前后依赖顺序
        - 建立跨领域知识点之间的关联与映射
        - 把静态结构、动态流程与场景问题和解决方法连接起来
        - 补出依赖、映射、聚合和复用关系使知识点不再是孤岛
        tools:
        - entity://ima知识库
        - entity://知识图谱
      output:
      - 可支撑问题解决的知识网络
      - 知识地图与可检索的知识索引
    decomposition:
      - step: 下层知识点向上归纳
        uses: concept://归纳
        why: 只有不断朝上归纳抽象，知识树才长得起来
      - step: 跨领域关联映射
        uses: concept://知识关联
        why: 跨学科知识点之间的关联映射能力决定能否把树连成网
