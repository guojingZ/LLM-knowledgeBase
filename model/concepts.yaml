  - id: 场景约束结合
    sources:
      - raw/如何理解辩证思维从抽象规定到思维具体化的完整过程.md
    define: 应用抽象概念必须结合相应场景，不能脱离事物内在关联与依赖约束
    type: 认知原理
    ipo:
      input:
