  - id: 结构逻辑
    sources:
      - raw/思维究竟是什么思维的逻辑和模式匹配.md
    define: 由静态结构和动态结构构成、要求内容承上启下相互衔接的逻辑
    type: 哲学概念
    ipo:
      input:
      - 待呈现的核心主题
      - 已分解出的各层内容
      process:
        steps:
        - 确定核心主题作为金字塔结构的根节点
        - 自顶向下逐层展开，把内容挂到对应层级
        - 对每个子节点向上检查是否已在父层出现，保证承上可追溯
        - 对每个父节点向下检查子项是否已先行铺垫，保证启下逐层分解
        - 剔除任何脱离该树状结构的内容
        tools:
        - entity://金字塔原理
      output:
      - 结构完整且合乎逻辑的方案或呈现材料
    relations:
      uses:
      - entity://金字塔原理
      related_to:
      - concept://结构化思维
      - concept://静态结构分析
      - concept://动态行为分析
      - concept://逻辑自洽
    tags: [结构逻辑, 承上启下, 金字塔结构, 自顶向下]

