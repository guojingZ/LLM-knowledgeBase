  - id: 形式逻辑
    sources:
      - raw/思维究竟是什么思维的逻辑和模式匹配.md
    define: 讲任何结论都要有大前提小前提，基于三段论推理的思维规律和规则
    type: 哲学概念
    ipo:
      input:
      - 待论证的结论
      - 支撑结论的前提素材
      process:
        steps:
        - 给出并确认被大家公认的大前提是否成立
        - 给出对具体情境的事实陈述作为小前提
        - 由大小前提按三段论推出结论
        - 检查是否存在以偏概全、偷梁换柱或由结论反推前提的漏洞
      output:
      - 合乎形式逻辑的结论
      - 逻辑漏洞的具体定位
