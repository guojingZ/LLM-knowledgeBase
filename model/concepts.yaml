    ipo:
      input:
      - 待认识的事物或问题
      - 事物的组成信息
      process:
        steps:
        - 按MECE原则自顶向下分解事物的静态组成结构
        - 用树状或表格结构呈现分解结果
        - 沿流程梳理事物的动态行为与步骤
        - 将静态组成部件与动态操作步骤建立映射
        tools:
        - entity://树模型
