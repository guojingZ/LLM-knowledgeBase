    sources:
      - raw/一文详细讲解基于系统工程思想构建自己的学习体系和学习系统.md
    define: 认知—解决为内循环、学习—复盘为外循环，两者叠加的反馈结构
    type: 通用框架
    ipo:
      input:
      - 待认知的事物与待解决的问题
      - 已沉淀的经验模式库
      process:
        steps:
        - 内循环从事物认知进入问题解决
        - 将问题分解到细粒度，在经验模式库寻找匹配点
        - 组合为候选方案，再以验证闭环收敛为结论
        - 外循环由学习进入实践，实践完成后进入复盘
        - 复盘产出的经验模式回灌内循环
      output:
      - 收敛后的解决方案
      - 可复用的经验模式
    relations:
