  - id: 加工
    sources:
      - raw/思维究竟是什么思维的逻辑和模式匹配.md
    define: 对输入做分解、组合、排序、聚合、抽象、重组，为后续模式匹配做准备
    type: 分析操作
    ipo:
      input:
      - 降噪后得到的清晰事实
      - 已定义但粒度仍过粗的问题或事物
      process:
        steps:
        - 判断本次加工应沿静态维度还是动态维度展开
        - 静态维度做分类、分组、维度属性、矩阵、树和层级、关联关系的处理
        - 动态维度按阶段、流程、活动、事件、消息拆解时间序
        - 用分解、组合、排序、聚合、抽象、重组把输入重排为可匹配形态
        - 检查加工后是否达到能与知识经验对应的细粒度
        tools:
        - entity://树模型
      output:
      - 细粒度且结构清晰的问题点集合
      - 可进入模式匹配的加工后数据
    decomposition:
      - step: 静态维度加工
        uses: concept://静态结构分析
        why: 静态维度覆盖分类分组、维度属性、矩阵、树和层级与关联关系
      - step: 动态维度加工
        uses: concept://动态行为分析
        why: 动态维度覆盖阶段、流程、活动、事件、消息等随时间发展的内容
      - step: 降低粒度以可匹配
        uses: concept://分解
        why: 粒度越粗越难匹配，必须分解到能与已有知识经验对应的粒度
    relations:
      uses:
      - entity://树模型
      related_to:
      - concept://信息降噪
      - concept://模式匹配
      - concept://静态结构分析
      - concept://动态行为分析
    tags: [加工, 动静结合, 细粒度, 降噪后]

  - id: 动态学习链
    sources:
      - raw/思维系列从个人知识体系构建到知识网络图谱的构建.md
    define: 围绕前导知识、当前问题和外延知识双向拓展的学习过程
    type: 学习理论
    ipo:
      input:
      - 已确定的知识边界与树干结构
      - 当前正在推进的工作任务与问题
      process:
        steps:
        - 先参考业界标准参考模型确定该领域的树干与边界
        - 当前工作推进不下去时回溯补齐缺失的前导知识
        - 当前任务完成后继续主动思考以拓展外延知识
        - 在前导与外延两端的不断补齐中让知识树持续生长
      output:
      - 持续生长的知识树与知识外延
      - 前导、当前、外延串联起来的知识结构
    decomposition:
      - step: 先立树干再谈深入
        uses: concept://找寻主干
        why: 树干没有立起来，树叶再多也连不起来
      - step: 补齐前导知识
        uses: concept://问题驱动学习
        why: 当前工作做不下去往往是前导知识缺失，问题是补齐的触发器
      - step: 向外延拓展
        uses: concept://从点到面学习
        why: 任务做完就停止思考会失去外延拓展的机会
    relations:
      depends_on:
      - concept://找寻主干
      uses:
      - entity://SCOR
      - entity://CMMI
      - entity://PMBOK
      produces:
      - concept://知识树
      related_to:
      - concept://问题驱动学习
      - concept://从点到面学习
      - concept://知识体系构建
    tags: [前导知识, 外延拓展, 双向拓展, 知识树]

