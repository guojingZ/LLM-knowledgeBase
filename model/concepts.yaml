        - 为每条行为特征找出其成立的前提条件与约束
        - 将概念放到具体场景中检验其行为是否成立
        - 按场景约束补充或修正属性与行为定义
      output:
      - 带前提约束的行为特征
      - 结合场景后更完整的概念认知
    relations:
