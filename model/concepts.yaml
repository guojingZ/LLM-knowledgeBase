        - 由二元判定形成命题
        - 由命题构成三段论式的推理逻辑
        - 沿二元分裂不断泛化演绎出细分学科与知识体系
      output:
      - 形式逻辑与认识论的推理体系
      - 难以穷尽的细分学科知识
    relations:
