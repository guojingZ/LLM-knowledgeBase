  - id: 脉络追溯
    sources:
      - raw/诸法皆因缘起世界是事实的总和而非事物的总和从事实到逻辑空间.md
    define: 沿逻辑空间→复合命题→基础命题→事实→事物逐层向下追溯的分析路径
    type: 分析操作
    ipo:
      input:
      - 一个待分析的现象或命题世界
      process:
        steps:
        - 从逻辑空间即世界中定位所处整体
        - 向下拆解为复合命题
        - 将复合命题继续拆为基础命题
        - 由基础命题回溯到其描述的事实
        - 由事实进一步追溯到构成事实的事物本身
      output:
      - 从事物到逻辑空间的完整追溯路径
    relations:
