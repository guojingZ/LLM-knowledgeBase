      - concept://系统思维
      contains:
      - concept://分解
      - concept://集成
      - concept://抽象
      references:
      - entity://《P9工作法》
    tags: [架构思维, 分解集成, 复用]

  - id: 样本充分性
    sources:
      - raw/深度思考的一个关键完成思维逻辑的自洽.md
    define: 归纳结论成立所需观察样本在数量与代表性上的要求
    type: 认知原理
    ipo:
      input:
      - 已观察到的若干样本现象
      process:
        steps:
        - 统计已观察样本的数量
        - 检查样本在不同情境下的代表性
        - 判断样本是否足以支撑归纳结论
        - 不足则补充样本或收窄结论适用范围
      output:
      - 可靠的归纳结论或收窄后的结论
    relations:
