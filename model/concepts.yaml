  - id: 认知四境界
    sources:
      - raw/如何高效和系统化的构建个人思维和认知体系.md
    define: 不知道自己不知道、知道自己不知道、知道自己知道、不知道自己知道
    type: 认知原理
    decomposition:
      - step: 不知道自己不知道
        uses: concept://元认知
        why: 此境界知识库和经验库都贫乏且元认知缺失，需靠重大挫折意识到无知
      - step: 知道自己不知道
        uses: concept://知识体系构建
        why: 突破路径是系统化学习与大量输入，构建初步知识框架
      - step: 知道自己知道
        uses: concept://深度复盘
        why: 突破路径是大量刻意实践与深度复盘反思，使理性推理流畅
      - step: 不知道自己知道
        uses: concept://模式匹配
        why: 此境界的特征是专家直觉，能快速识别模式并做出判断
    relations:
      related_to:
      - concept://元认知
      - concept://认知水平差异
      - concept://模式匹配
      - concept://长期主义
    tags: [认知境界, 元认知, 螺旋上升]

  - id: 认知水平差异
    sources:
      - raw/信息爆炸时代认知高和认知低的六大核心差异体现.md
    define: 高认知与低认知在感知、抽象、结构、时空、解题与进化上的系统性差异
    type: 通用框架
    decomposition:
      - step: 信息感知差异
        uses: concept://主动信息过滤
        why: 认知高的人启动过滤机制只放行与核心目标相关的信号，认知低的人被动接收
      - step: 抽象能力差异
        uses: concept://概念抽象
        why: 认知高的人提取第二实体即概念与共性，认知低的人只停留在具体现象
      - step: 思维结构差异
        uses: concept://知识结构化
        why: 认知高的人把新知识点挂载到知识树上形成连接，认知低的人知识零散点状
      - step: 时空维度差异
        uses: concept://认知三要素
        why: 认知高的人掌握时间与空间维度的思维武器，坚持长期主义
      - step: 解决问题差异
        uses: concept://方法论迁移
        why: 认知高的人做模式匹配后适配迁移，认知低的人只能生搬硬套经验
      - step: 自我进化差异
        uses: concept://元认知
        why: 认知高的人靠元认知监控与复盘持续迭代，认知低的人静态重复
    relations:
      contains:
      - concept://主动信息过滤
      - concept://概念抽象
      - concept://知识结构化
      - concept://方法论迁移
      related_to:
      - concept://认知三要素
      - concept://元认知
    tags: [认知差异, 六维度, 高认知, 自我进化]

  - id: 认识论分析
    sources:
      - raw/所有的思维均来源于我们对世界和自我的认知对思维框架逻辑构建的哲学思考.md
    define: 研究知识、信念与意见的性质、起源、范围和限制
    type: 哲学概念
    ipo:
      input:
      - 对外部世界的感知与观察
      - 已有的知识、信念与意见
      process:
        steps:
        - 区分事物本身与对事物的认识，承认认识因人而异
        - 追问我们如何知道我们所知道的
        - 检验该认识的真理标准
        - 界定这一认识的适用范围与限制条件
        - 由感性材料经知性判断再到理性综合形成普遍必然认知
