      - 大脑中已有的知识经验库
      process:
        steps:
        - 判断当前思维活动更偏事物认知还是偏问题解决
        - 偏事物认知时回答是什么以及如何选择，输出认知与评价
        - 偏问题解决时回答如何做与哪里出错，输出解决方案与决策
        - 注意到事物认知的本质仍是问题分析和解决，两条主线最终融合
