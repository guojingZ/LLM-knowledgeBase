      - concept://演绎
      - concept://方法论抽象
      - concept://经验模式库
    tags: [呈现, 泛化, 金字塔原理, 方法论沉淀, 证据不足]

  - id: 命题
    sources:
      - raw/诸法皆因缘起世界是事实的总和而非事物的总和从事实到逻辑空间.md
    define: 用语言对事实进行描述形成的语言表达，即事实的语言化结果
    type: 哲学概念
    ipo:
      input:
      - 一个已发生的具体事实
      process:
        steps:
        - 观察并确认事实展现出来的形态和行为
        - 用语言和文字对事实的形态和行为进行描述
        - 形成一句完整可传达的语句
      output:
