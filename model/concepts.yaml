  - id: 静态架构与动态运转
    sources:
      - raw/基于思维框架逻辑来构建思维能力体系并应用到实践.md
    define: 由静态架构、动态运转及二者结合构成的具备普遍适用性的思维框架元模型
    type: 通用框架
    ipo:
      input:
      - 待认知的事物或待解决的问题
      process:
        steps:
        - 分析面对的思维场景属于事物认知类还是问题分析解决类
        - 认知类按静态加动态再加动静结合的认知模型展开
        - 问题解决类按问题定义、问题分析、问题解决验证的流程展开
        - 完成后复盘并将经验入库到个人知识经验库
      output:
      - 对事物的完整认知或问题的解决方案
      - 入库后的可复用经验点
    decomposition:
      - step: 静态架构分析
        uses: concept://静态结构分析
        why: 先研究事物内在的组成部件与静态架构
      - step: 动态运转分析
        uses: concept://动态行为分析
        why: 再研究事物的行为特征与运作流程
      - step: 动静结合
        uses: concept://动静结合分析
        why: 回答底层各组件如何匹配到具体活动并协同完成外在行为
      - step: 降维后整合
        uses: concept://集成
        why: 核心逻辑是分解加集成，降维后再整合回完整认知
    relations:
      contains:
      - concept://静态结构分析
      - concept://动态行为分析
      - concept://动静结合分析
      related_to:
      - entity://思维钻石模型
      - concept://思维框架体系
      - concept://分解
    tags: [元模型, 静态架构, 动态运转]

