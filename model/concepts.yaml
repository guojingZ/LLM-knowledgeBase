      process:
        steps:
        - 承认不存在一步到位的最优架构
        - 跟踪业务需求的变化
        - 随需求变化对架构做持续的迭代和演化
        - 每轮迭代后校验它是否仍是当下最适合的架构
      output:
      - 随业务不断进化的架构
    relations:
      depends_on:
      - concept://业务驱动技术
      related_to:
      - concept://大架构观
      - concept://POC验证
    tags: [迭代演化, 最合适而非最优, 架构]

  - id: 逻辑元素
    sources:
      - raw/普通人理解和认知事物的底层逻辑完整版本.md
    define: 经大量学习、实践和复盘提炼出的、可跨场景复用的思考单元
    type: 知识管理
    ipo:
      input:
      - 大量学习实践复盘后积累的经验素材
      process:
        steps:
        - 去除具体场景的个性化细节
        - 抽象出可跨场景复用的共性思考单元
        - 用简洁语言陈述并保证解释力与适用性
        - 在新场景中检验并修正该单元
      output:
      - 可复用的思考单元
    relations:
      depends_on:
      - concept://深度复盘
      uses:
      - concept://抽象
      related_to:
      - concept://底层逻辑网络
      - concept://证悟
    tags: [逻辑元素, 复用单元, 抽象提炼]

  - id: 逻辑分层
    sources:
      - raw/普通人理解和认知事物的底层逻辑完整版本.md
    define: 由基础逻辑、逻辑要素、逻辑方法到领域方法论构成的倒生大树式分层
    type: 认知原理
    decomposition:
      - step: 树根层的基础逻辑
        uses: concept://底层逻辑
        why: 归纳、演绎、辩证这三大基础逻辑位于倒生大树最上层根的位置
      - step: 第二层的逻辑要素
        uses: concept://逻辑要素
        why: 空间、时间、质、量、关系等是探讨任何逻辑都不能脱离的成分
      - step: 第三层的逻辑方法
        uses: concept://逻辑方法
        why: 常见的各种思维方式本质是基础逻辑与逻辑要素的组合形态
    relations:
      contains:
      - concept://底层逻辑
      - concept://逻辑要素
      - concept://逻辑方法
      related_to:
      - concept://分层
      - concept://方法论抽象
    tags: [逻辑分层, 倒生大树, 分层]

  - id: 逻辑图像
    sources:
      - raw/诸法皆因缘起世界是事实的总和而非事物的总和从事实到逻辑空间.md
    define: 对事实的描述形成的图像，是事实形态与行为在逻辑上的呈现
    type: 哲学概念
    ipo:
      input:
      - 一个已发生的事实
      - 对该事实的语言描述
      process:
        steps:
        - 用语言描述事实，形成基本命题
        - 依据命题在脑海中浮现出对应画面
        - 把事实的形态和行为以图像方式固化呈现
        - 将该逻辑图像存入庞大的逻辑空间
      output:
      - 反映事实形态与行为的逻辑图像
    relations:
      depends_on:
      - concept://命题
      related_to:
      - concept://事实
      - concept://逻辑空间
      - entity://《逻辑哲学论》
    tags: [逻辑图像, 事实描述, 图像化]

  - id: 逻辑思维
    sources:
      - raw/什么是系统思维个人应该如何培养系统思维能力从基本概念到案例分析.md
    define: 以归纳和演绎为核心、由多因得果或由结论泛化诸因的思维形式
    type: 思维方法
    ipo:
      input:
      - 多个已知的事实或前提
      process:
        steps:
        - 明确推导方向：由多个因归纳得一果，或由一个结论演绎泛化出多个因
        - 逐层检验每一步推导是否符合形式逻辑规则
        - 检查结论能否回溯到前提，排除反向倒推
      output:
      - 因果关联的判断或结论
    relations:
      contains:
      - concept://归纳
      - concept://演绎
      related_to:
      - concept://结构化思维
      - concept://辩证逻辑
    tags: [归纳, 演绎, 形式逻辑]

  - id: 逻辑方法
    sources:
      - raw/思维框架和知识体系构建知识组件并实现知识快速组装.md
    define: 分解、集成、抽象、聚合、泛化、匹配、依赖等处理组件关系的方法
    type: 思维方法
    ipo:
      input:
      - 结构模型中已识别出的组件
      - 组件与组件之间的待处理关系
      process:
        steps:
        - 判断待处理关系属于分解、集成、抽象、聚合、泛化、匹配、依赖中的哪一类
        - 选用对应的逻辑方法处理该组组件关系
        - 必要时把多种逻辑方法与概率分析、推理组合使用
        - 回溯到归纳、演绎、辩证三大基础逻辑校验方法的成立前提
      output:
      - 组件之间清晰的关系与依赖
      - 支撑举一反三的演绎能力
    decomposition:
      - step: 打散整体
        uses: concept://分解
        why: 分析定义问题时从上到下不断分解是最常用的组件处理方法
      - step: 复原整体
        uses: concept://集成
        why: 最终解决问题要从底朝上不断演绎，把组件重新聚合为整体
      - step: 提炼共性
        uses: concept://抽象
        why: 抽象后的组件才能在更高层面被泛化和复用
    relations:
      contains:
      - concept://分解
      - concept://集成
      related_to:
      - concept://归纳
      - concept://演绎
      - concept://辩证逻辑
      - concept://知识三层模型
    tags: [逻辑方法, 组件关系, 三大基础逻辑, 举一反三]

  - id: 逻辑空间
    sources:
      - raw/诸法皆因缘起世界是事实的总和而非事物的总和从事实到逻辑空间.md
    define: 由无数逻辑图像组成的巨大集合，世界是它在当下的一个子集
    type: 哲学概念
    ipo:
      input:
      - 由基本命题与复合命题形成的各类逻辑图像
      process:
        steps:
        - 汇集描述各类事实和事态的逻辑图像
        - 把它们统一存放到一个庞大的集合中
        - 加入时间维度以区分当下、历史与未来的图像
        - 取当下图像的总和作为我们看到的世界
      output:
      - 由无数逻辑图像构成的逻辑空间
      - 作为其子集的世界
    relations:
      contains:
      - concept://逻辑图像
      related_to:
      - concept://复合命题
      - concept://事态
      - entity://《逻辑哲学论》
    tags: [逻辑空间, 图像集合, 时间维度]

  - id: 逻辑自洽
    sources:
      - raw/如何提升自己的结构化思维和系统思维能力.md
      - raw/深度思考的一个关键完成思维逻辑的自洽.md
    define: 结论在因果、关系、过程三个层面均能自圆其说的思维状态
    type: 认知原理
    ipo:
      input:
      - 得出的结论
      - 支撑结论的素材与论据
      process:
        steps:
        - 检查归纳样本是否充分、演绎前提能否支撑结论
        - 检查多个知识点之间的关联关系能否说清
        - 复述从素材一步步推导出结论的完整过程
      output:
      - 在因果、关系、过程三方面均能自洽的结论
    decomposition:
      - step: 因果自洽
        uses: concept://三段论推理
        why: 结论必须由前提按形式逻辑推出，且不可由结论反推前提
      - step: 关系自洽
        uses: concept://知识关联
        why: 多个知识点之间的关联关系要能完整说清，不能各说各话
      - step: 过程自洽
        uses: concept://演绎
        why: 要能一步步复述从素材到结论的推导路径，不能只有素材和结论
    relations:
      related_to:
      - concept://批判思维
      - concept://样本充分性
      - concept://三段论推理
    tags: [自洽, 深度思考, 逻辑]

  - id: 逻辑要素
    sources:
      - raw/普通人理解和认知事物的底层逻辑完整版本.md
    define: 空间、时间、质、量、关系、模态，与逻辑组合才形成逻辑方法
    type: 认知原理
    ipo:
      input:
      - 待认知事物所处的问题情境
      - 所选用的归纳、演绎或辩证基础逻辑
      process:
        steps:
        - 明确该情境使用的是哪一类基础逻辑
        - 按康德的十二范畴逐项考察质、量、关系、模态
        - 补上空间与时间这两个先验的认识框架
        - 把逻辑与要素组合落地为具体的逻辑方法
      output:
      - 结合了该情境要素的逻辑方法
    relations:
