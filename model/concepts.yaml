  - id: 知识经验库
    sources:
      - raw/基于思维框架逻辑来构建思维能力体系并应用到实践.md
      - raw/对思维框架和内在逻辑的完整梳理和认识.md
      - raw/思维究竟是什么思维的逻辑和模式匹配.md
    define: 由基础记忆、知识、经验方法论构成，供思维处理时调用的积累
    type: 知识管理
    ipo:
