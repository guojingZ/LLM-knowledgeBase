      - 自身当前的能力现状
      process:
        steps:
        - 明确长期目标，找准个人职业发展方向
        - 识别短期目标，看清当前岗位要求
        - 对比自身能力看清差距
        - 用数据记录和量化差距，明确当下所处位置
      output:
      - 明确的长短期目标
      - 用数据量化的能力差距
