    tags: [追溯脉络, 命题链条, 逻辑哲学论]

  - id: 自底向上装配
    sources:
      - raw/思维究竟是什么思维的逻辑和模式匹配.md
    define: 先组合整合各个细粒度子件，再集成装配到总体架构框架上
