        - 跳出盒子站在用户视角看待整个事物的运行
        - 既追根究底又不求甚解，同时做静态分解与动态集成
        - 回到业务需求本身校验理解偏差并给出当下最合理的架构模型
      output:
      - 对产品组成与整体运行的完整理解
      - 当下最合理且能落地的架构模型
