      - entity://康德
      - entity://亚里士多德
      related_to:
      - concept://逻辑分层
      - concept://逻辑方法
    tags: [逻辑要素, 十二范畴, 质量关系模态]

  - id: 重复自动化
    sources:
      - raw/个体进化的底层逻辑从知识到技能从技能到方法论.md
    define: 把做事过程中重复的东西自动化，以提升效率的路径
    type: 管理学原理
    ipo:
      input:
      - 做事过程中反复出现的重复动作
      process:
        steps:
        - 识别做事过程中哪些东西是重复的
        - 把重复动作固化为可执行的固定步骤
        - 用工具或脚本将固定步骤自动化
        - 运行自动化并检查产出是否符合预期
