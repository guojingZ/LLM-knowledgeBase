      - concept://归纳
      - concept://逻辑自洽
      - concept://误认因果
    tags: [归纳, 样本, 逻辑自洽]

  - id: 根因两类
    sources:
      - raw/问题分析解决核心逻辑麦肯锡解决问题七步法仅是开始.md
    define: 问题根因只有两类：输入的某个条件错误，或加工处理的某个步骤错误
    type: 认知原理
    ipo:
      input:
      - 已发生的异常或错误现象
      - 问题的输入条件清单与加工步骤清单
      process:
        steps:
        - 逐一核对输入端的各个条件是否发生错误
        - 再逐一核对加工处理的各个步骤是否出错
        - 定位到出错的那个条件或那个具体步骤
      output:
      - 二选一的问题根因归类
    relations:
      produces:
      - concept://假设验证
      related_to:
      - concept://根因分析
      - concept://优先级排序
      - concept://非结构化分析
    tags: [根因二分, 输入条件, 加工步骤]

  - id: 根因分析
    sources:
      - raw/我们在解决复杂问题时如何抽丝剥茧透过现象看本质.md
    define: 将复杂问题逐层拆为因素，经排除验证锁定根本原因
    type: 分析操作
    ipo:
      input:
      - 已定义为期望与实际差距的问题
      process:
        steps:
        - 将复杂问题逐层拆解为多个子问题
        - 深入分析每个子问题背后的各种因素
        - 通过排除和验证逐步收敛因素范围
        - 综合各方面结果锁定牵一发而动全身的根本原因
      output:
      - 确认的根本原因
      - 指向根因的解决方案方向
    decomposition:
      - step: 分解
        uses: concept://分解
        why: 问题粒度越粗越难匹配，拆解为子问题才能逐个分析
      - step: 匹配
        uses: concept://模式匹配
        why: 将子问题与知识经验库中的经验模式进行对应
      - step: 综合
        uses: concept://集成
        why: 逐个子问题的分析结果需要综合成完整的解决方案
    relations:
      depends_on:
      - concept://问题定义
