        - 自己先分析问题，不直接向AI要答案代替自己思考
        - 自己提出问题并把问题边界定义清楚
        - 对AI输出的结果保持自己的判断与验证
      output:
      - 属于自己的分析结论与问题定义
    relations:
      related_to:
      - concept://问题定义
      - concept://外思考
      - concept://批判思维
    tags: [独立思考, AI时代, 问题定义]

  - id: 现象学还原
    sources:
      - raw/从知识到智慧如何从西方哲学发展历史角度来理解知识这个核心概念.md
    define: 胡塞尔通过分析意识的意向模式揭示知识构造过程的方法
    type: 思维方法
    ipo:
      input:
      - 意识中的意向活动与被指向的对象
      process:
        steps:
        - 分析意识当下以感知、回忆或想象何种模式指向对象
        - 考察对象的意义如何被意向活动构造出来
        - 沿时间–生成结构追溯该知识的起源与历史背景
        - 揭示知识作为动态构造过程的生成性
      output:
      - 对象意义被构造的方式
      - 知识构造过程的揭示
    relations:
      references:
      - entity://胡塞尔
      related_to:
      - concept://认识论分析
      - concept://知识
      - concept://先验知识
    tags: [胡塞尔, 现象学, 意向性, 知识构造]

  - id: 理解型学习
    sources:
      - raw/思维系列从学习的本质到如何高效快速学习.md
    define: 信息摄入后经主动思考加工并形成自己新理解的学习
    type: 学习理论
    ipo:
      input:
      - 感知器官摄入的外部信息
      - 多个可供观察的具体现象或案例
      process:
        steps:
        - 通过感知器官完成信息摄入
        - 在大脑内部对信息进行主动思考和加工
        - 从多个具体现象中归纳出通用的规律或套路
        - 形成属于自己的新理解即一次理解
        - 在实践中检验并把公理条件化为特定场景成立的定理
      output:
      - 自己加工后形成的新理解
      - 经实践检验的二次理解与条件化定理
    decomposition:
      - step: 对摄入信息主动加工
        uses: concept://加工
        why: 没有大脑内部思考加工的过程就只是记忆型学习
      - step: 从具体现象中归纳
        uses: concept://归纳
        why: 从大量个例中归纳出通用套路才是真正的学习
      - step: 实践检验深化理解
        uses: concept://知识内化
        why: 一次理解停留在理论，二次理解才是知识内化为能力的关键
    relations:
      contains:
      - concept://加工
      - concept://归纳
      related_to:
      - concept://深度学习
      - concept://知识内化
      - concept://实践驱动学习
    tags: [信息摄入, 主动思考, 一次理解, 二次理解]

  - id: 目标反溯
