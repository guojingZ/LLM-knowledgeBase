        - 汇总各子问题各自匹配到的解决方案
        - 检查各方案间的边界、依赖与冲突
        - 按目标贡献度做整合排序，确定哪些内容优先呈现
        - 把各子问题方案聚合为能协同达成大目标的完整方案
      output:
