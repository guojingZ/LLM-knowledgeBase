        - 设定假想场景下的最小可行目标
        - 明确该目标的验证标准与自我期望
        - 不等理论全部学完，立即亲自动手实践
        - 对照标准确认结果是否满足期望
        - 复盘各个组件之间如何协同工作
      output:
