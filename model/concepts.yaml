      - 自身在该领域已有的知识经验
      process:
        steps:
        - 检索并浏览该领域大量资料，包括方案材料与业务资料
        - 横向对比各份材料，拆分出其中的关键项
        - 以已有的通用思路为骨架搭出大框架轮廓
        - 把业界做法整合填入框架并逐层展开
        - 校验每项内容是否承上启下、相互衔接为一个整体
        tools:
        - entity://金字塔原理
      output:
      - 覆盖该领域的关键概念模型
      - 承上启下逻辑完整的总体框架
    decomposition:
      - step: 横向对比归纳共性
        uses: concept://归纳
        why: 需要综合对比多份业界资料才能理出通用的大框架逻辑
      - step: 保证框架承上启下
        uses: concept://结构逻辑
        why: 框架中每项内容要能向上追溯并向下铺垫，衔接为完整整体
      - step: 抽离无关细节
        uses: concept://抽象
        why: 不必深入每个子系统细节也能先搭出可用的概念模型
    relations:
