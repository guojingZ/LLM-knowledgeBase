      process:
        steps:
        - 学习阶段按通识方式优先铺开广度，为后续发展打基础
        - 职业初期聚焦垂直领域深度突破，用项目实践固化核心技能
        - 进入瓶颈期时回溯广度，学习相邻领域寻找新突破
        - 成熟期让广度与深度深度融合形成复合型知识结构
      output:
      - 与阶段匹配的广度深度取舍策略
    decomposition:
      - step: 瓶颈期突破
        uses: concept://回溯广度
        why: 深度到极限后必须先扩展底面积，跨域学习才能带来新的启发
      - step: 融合期收敛
        uses: concept://价值锚点
        why: 融合仍需以深度创造价值为锚，否则容易沦为门门通的杂家
    relations:
      contains:
      - concept://回溯广度
      references:
      - entity://沙堆理论
      related_to:
      - concept://知识广度
      - concept://知识深度
      - concept://价值锚点
    tags: [阶段策略, 广度深度, 核心竞争力]

  - id: 底层逻辑
    sources:
      - raw/普通人理解和认知事物的底层逻辑完整版本.md
    define: 归根结底只有归纳法、演绎法和辩证法这三大最基础的逻辑
    type: 认知原理
    ipo:
      input:
      - 待认知的事物或待抽象的领域问题
      - 该情境涉及的质、量、关系等逻辑要素
      process:
        steps:
        - 选定可用的基础逻辑：归纳、演绎或辩证
        - 叠加空间时间、质与量、关系与模态等关键要素
        - 组合成适配该情境的逻辑方法并用于认知事物
      output:
      - 可落地的逻辑方法而非停留在书本上的空谈
    decomposition:
      - step: 由特殊到一般
        uses: concept://归纳
        why: 归纳法与演绎法共同构成形式逻辑的内核
      - step: 由一般到特殊
        uses: concept://演绎
        why: 演绎法负责把普遍结论推到具体情境
      - step: 处理矛盾与对立统一
        uses: concept://辩证逻辑
        why: 辩证法是三大基础逻辑之一，负责看事物的正反两面
    relations:
