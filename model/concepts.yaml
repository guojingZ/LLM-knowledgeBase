  - id: 体系思维
    sources:
      - raw/碎片化时代从体系思维到系统化知识体系构建之路.md
    define: 由静态结构与动态逻辑构成、靠归纳演绎驱动并持续闭环反馈的思维系统
    type: 思维方法
    ipo:
      input:
      - 待认知的事物或待解决的新问题
      - 与时间、环境、信息相关的输入要素
      process:
        steps:
        - 用静态结构模型解剖信息的组成并完成分类组织
        - 用输入到黑盒再到输出的模型打开黑盒看清运行机制
        - 将静态零件清单与动态运转行为集成为完整系统
        - 借助归纳与演绎的逻辑引擎驱动知识与经验升级
        - 通过结构化输出与闭环反馈让系统自我进化
        tools:
        - entity://逻辑树
        - entity://问题分类矩阵
      output:
      - 动静结合的完整系统认知
      - 由模式匹配得到的解决方案
    decomposition:
      - step: 静态结构解剖
        uses: concept://静态结构分析
        why: 先把纷繁信息分类组织并分解立体结构，得到可管理的组成单元
      - step: 动态结构理解
        uses: concept://动态行为分析
        why: 静态只回答是什么，还要靠过程与状态逻辑理解事物如何运作
      - step: 系统集成
        uses: concept://要素关联分析
        why: 系统思维的核心是研究组成要素之间的相互影响和关联
      - step: 归纳演绎驱动
        uses: concept://归纳演绎循环
        why: 归纳构建模型、演绎验证应用模型，是推动知识提炼升华的核心动力
      - step: 闭环反馈进化
        uses: concept://复盘
        why: 静态体系没有生命力，复盘提炼的新模式回灌知识库才形成持续迭代
    relations:
      contains:
