  - id: 辩证思维
    sources:
      - raw/如何理解辩证思维从抽象规定到思维具体化的完整过程.md
      - raw/所有的思维均来源于我们对世界和自我的认知对思维框架逻辑构建的哲学思考.md
    define: 从抽象规定出发经思维具体化，分析事物属性与行为间内在影响与正反作用
    type: 思维方法
    ipo:
      input:
      - 对具体事物的感性认知
      - 归纳演绎得出的抽象概念
      process:
        steps:
        - 由多个同类具体事物归纳得出一个抽象规定
        - 为抽象概念补全它究竟应该包括的属性
        - 为抽象概念补全它究竟应该具备的行为特征
        - 分析属性与行为之间的内在影响
        - 分析行为与行为之间相互的正反作用
        - 结合具体场景与约束检验概念以形成完整认知
      output:
      - 对事物完整而具体的抽象认知
    decomposition:
      - step: 得出抽象规定
        uses: concept://抽象规定
        why: 辩证思维的起点是从特殊到一般抽象出概念，类似定义出Class类
      - step: 完成思维具体化
        uses: concept://思维具体化
        why: 只有事物具备了完整的属性和行为，才完成对事物完整的抽象
      - step: 分析属性行为内在影响
        uses: concept://属性行为内在影响分析
        why: 分析属性和行为间的内在影响与行为间正反作用是辩证逻辑最核心的内容
      - step: 结合场景约束应用
        uses: concept://场景约束结合
        why: 应用概念一定要结合相应场景，不能脱离事物内在关联和依赖约束
    relations:
      contains:
      - concept://抽象规定
      - concept://思维具体化
