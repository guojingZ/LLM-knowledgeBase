      - 因子间的正负反馈关系
      process:
        steps:
        - 观察各因子取值在反馈作用下的变化
        - 找到各因子作用力相互抵消的均衡点
        - 施加外部扰动，观察系统是否自行调整回到均衡
      output:
      - 系统当前的动态平衡点
      - 扰动后的演化趋势
    relations:
      related_to:
      - concept://系统思维
      - entity://系统动力学
    tags: [系统, 均衡, 仿真]

  - id: 动态行为分析
    sources:
