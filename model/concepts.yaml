    tags: [不确定性, 数据驱动, 概率, 人工智能]

  - id: 缘起性空
    sources:
      - raw/诸法皆因缘起世界是事实的总和而非事物的总和从事实到逻辑空间.md
    define: 事物由多因素在某种因缘下相互作用形成，没有独立自存的本质
    type: 哲学概念
    ipo:
      input:
      - 呈现在眼前的事物表象
      process:
        steps:
        - 追问该事物由哪些因素在何种因缘下相互作用而成
        - 继续下探到事物内部更小颗粒度的运动与作用
        - 确认不存在可脱离他物独立自存的本质
        - 把所见形态判定为特定因缘下的暂时表象
      output:
      - 对事物无独立自存本质的认识
      - 剥离表象后的理解
