  - id: 学习系统建模
    sources:
      - raw/一文详细讲解基于系统工程思想构建自己的学习体系和学习系统.md
    define: 用分层建模方法把个人学习系统建为具层次、接口与反馈的复杂系统
    type: 学习理论
    ipo:
      input:
      - 个人长期写作与一线实践积累的经验
      - MBSE系统工程学的分层建模思想
      process:
        steps:
        - 划定个人学习系统边界，定义需求层的能力、转化与方法论诉求
        - 梳理功能层，按事物认知、问题解决、学习实践、复盘总结串联
        - 抽象逻辑层，形成思维框架逻辑、知识管理逻辑与学习方法逻辑
        - 确定物理层载体，即大脑、知识库系统、实践环境与反馈系统
        - 用行为层状态机表达学习、实践、复盘、进化的转换关系
      output:
      - 具层次、接口与反馈的个人学习系统架构
    decomposition:
      - step: 系统分层
        uses: concept://分层
        why: 学习系统要按需求、功能、逻辑、物理、行为分层才谈得上接口与反馈
      - step: 方法论主骨
        uses: concept://知识体系构建
        why: 学习方法逻辑要以三层六阶段为主骨并可度量可迭代
      - step: 闭环反馈
        uses: concept://双循环
        why: 认知解决是内循环、学习复盘是外循环，双循环叠加才能持续演进
    relations:
      uses:
      - entity://MBSE
      - entity://三层六阶段学习法
      - entity://PDCA
      contains:
      - concept://双循环
      - concept://事物认知
      - concept://知识四层演进
    tags: [学习系统, MBSE, 分层建模]

