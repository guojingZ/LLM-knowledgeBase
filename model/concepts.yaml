  - id: 问题分析建模
    sources:
      - raw/个人提升解决问题能力的关键从结果到过程通过复盘形成闭环.md
    define: 打开黑盒研究内部组件关系与依赖，用最简单模型描述问题成因
    type: 分析操作
    ipo:
      input:
      - 已定义并分解后的问题
      - 问题涉及的对象与组件
      process:
        steps:
        - 把问题看作黑盒，先确认其外在行为表现
        - 打开黑盒，识别内部各个对象或组件
        - 研究组件之间的关系与依赖
        - 分析组件如何相互作用而暴露出外部行为
        - 用最简单的模型把问题成因描述出来
      output:
      - 描述问题成因的最简模型
    relations:
